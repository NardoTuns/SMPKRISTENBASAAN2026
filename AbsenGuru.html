<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Absensi Guru — SMP Kristen Basaan</title>
<meta name="theme-color" content="#16243E">
<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --navy:#16243E;
  --navy-2:#22385C;
  --navy-3:#0E1830;
  --gold:#C79A3E;
  --gold-2:#E4C776;
  --cream:#F7F3EA;
  --white:#FFFFFF;
  --ink:#1D2430;
  --ink-soft:#5B6472;
  --border:#E4DCC9;
  --border-2:#DDD4C0;
  --success:#2F7D5C;
  --success-bg:#E6F2EC;
  --warning:#C77E1D;
  --warning-bg:#FBEDDC;
  --info:#2C6E9E;
  --info-bg:#E4EEF5;
  --danger:#B23B3B;
  --danger-bg:#F8E7E7;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --shadow:0 2px 10px rgba(22,36,62,0.08);
  --serif: Georgia, 'Times New Roman', Cambria, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
body.gelap{
  --cream:#131A24;
  --white:#1B2430;
  --ink:#E7ECF3;
  --ink-soft:#97A3B4;
  --border:#2B3543;
  --border-2:#2B3543;
  --navy:#2C4570;
  --success-bg:#16302A;
  --warning-bg:#332614;
  --info-bg:#132A3A;
  --danger-bg:#331B1B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:700;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-2);}
.hidden{display:none !important;}
a{color:inherit;}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============================================================
   LAYOUT SHELL
============================================================ */
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--cream);
  position:relative;
}

.topbar{
  background:linear-gradient(155deg, #16243E 0%, #0E1830 100%);
  color:#FFFFFF;
  padding:14px 16px 16px;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:0 3px 10px rgba(0,0,0,0.18);
}
.topbar-row{display:flex; align-items:center; gap:10px;}
.topbar-badge{
  width:38px;height:38px;border-radius:10px;
  background:var(--gold);
  color:#0E1830;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:16px;
  flex-shrink:0;
}
.topbar-title{font-family:var(--serif);font-size:16px;line-height:1.25;font-weight:700;}
.topbar-sub{font-size:11px;color:#C9D2E2;margin-top:1px;letter-spacing:.2px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sync-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.18);
  padding:5px 9px;border-radius:20px;font-size:11px;color:#EDEFF3;
  cursor:pointer;
}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#63C48A;}
.sync-pill.pending .dot{background:var(--gold-2);}
.sync-pill.off .dot{background:#9AA4B5;}
.sync-pill.busy .dot{background:var(--gold-2);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.view-title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;}
.view-title{font-size:20px;}
.view-caption{font-size:12px;color:#B9C2D4;}

main{
  flex:1;
  padding:14px 14px 90px;
  overflow-y:auto;
}

.bottomnav{
  position:sticky;
  bottom:0;
  z-index:30;
  background:var(--white);
  border-top:1px solid var(--border-2);
  display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 10px rgba(22,36,62,0.08);
}
.navbtn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-soft);
  padding:6px 2px;border-radius:10px;font-size:10.5px;
  cursor:pointer;
}
.navbtn svg{width:21px;height:21px;}
.navbtn.active{color:var(--navy);}
body.gelap .navbtn.active{color:var(--gold-2);}
.navbtn.active .navicon{background:var(--cream);}
.navicon{width:34px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:8px;}

/* ============================================================
   COMPONENTS
============================================================ */
.card{
  background:var(--white);
  border:1px solid var(--border-2);
  border-radius:var(--radius-m);
  padding:14px;
  margin-bottom:12px;
}
.card-flush{padding:0;overflow:hidden;}

.section-label{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:0 0 8px 2px;
  font-weight:600;
}

.stat-row{display:flex;gap:10px;margin-bottom:12px;}
.stat-card{
  flex:1;background:var(--white);border:1px solid var(--border-2);
  border-radius:var(--radius-m);padding:12px 10px;text-align:left;
  border-left:4px solid var(--navy);
}
.stat-card .num{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);line-height:1;}
.stat-card .lbl{font-size:11px;color:var(--ink-soft);margin-top:5px;}
.stat-card.gold{border-left-color:var(--gold);}
.stat-card.gold .num{color:#8A6A22;}
body.gelap .stat-card.gold .num{color:var(--gold-2);}
.stat-card.green{border-left-color:var(--success);}
.stat-card.green .num{color:var(--success);}
.stat-card.red{border-left-color:var(--danger);}
.stat-card.red .num{color:var(--danger);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:var(--radius-s);
  border:1px solid transparent;font-size:14px;font-weight:600;
  cursor:pointer;line-height:1.1;width:100%;
}
.btn-primary{background:#16243E;color:#fff;}
.btn-primary:active{background:#0E1830;}
.btn-gold{background:var(--gold);color:#0E1830;}
.btn-outline{background:var(--white);color:var(--ink);border-color:var(--border-2);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border-2);}
.btn-danger{background:var(--white);color:var(--danger);border-color:var(--danger);}
.btn-sm{width:auto;padding:7px 12px;font-size:12.5px;}
.btn-row{display:flex;gap:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text], .field input[type=password], .field input[type=date], .field input[type=time],
.field input[type=month], .field select, .field textarea, .field input[type=url], .field input[type=number]{
  width:100%;padding:10px 11px;border:1px solid var(--border-2);border-radius:var(--radius-s);
  background:var(--white);font-size:14.5px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:64px;}
.field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}

.seg{display:flex;border:1px solid var(--border-2);border-radius:var(--radius-s);overflow:hidden;}
.seg button{
  flex:1;padding:10px 6px;border:none;background:var(--white);color:var(--ink-soft);
  font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--border-2);
}
.seg button:last-child{border-right:none;}
.seg button.active{background:#16243E;color:#fff;}

.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-btn{
  padding:12px 8px;border-radius:var(--radius-s);border:1.5px solid var(--border-2);
  background:var(--white);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;gap:8px;justify-content:center;
}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.status-btn[data-st="Hadir"] .status-dot{background:var(--success);}
.status-btn[data-st="Sakit"] .status-dot{background:var(--warning);}
.status-btn[data-st="Izin"] .status-dot{background:var(--info);}
.status-btn[data-st="Alpa"] .status-dot{background:var(--danger);}
.status-btn.active[data-st="Hadir"]{background:var(--success-bg);border-color:var(--success);color:var(--success);}
.status-btn.active[data-st="Sakit"]{background:var(--warning-bg);border-color:var(--warning);color:#8A5613;}
.status-btn.active[data-st="Izin"]{background:var(--info-bg);border-color:var(--info);color:var(--info);}
.status-btn.active[data-st="Alpa"]{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
body.gelap .status-btn.active[data-st="Sakit"]{color:var(--gold-2);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.b-hadir{background:var(--success-bg);color:var(--success);}
.badge.b-sakit{background:var(--warning-bg);color:#8A5613;}
.badge.b-izin{background:var(--info-bg);color:var(--info);}
.badge.b-alpa{background:var(--danger-bg);color:var(--danger);}
.badge.b-sync{background:var(--info-bg);color:var(--info);}
.badge.b-pending{background:var(--warning-bg);color:#8A5613;}
.badge.b-belum{background:var(--border);color:var(--ink-soft);}
body.gelap .badge.b-sakit, body.gelap .badge.b-pending{color:var(--gold-2);}
.list-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

.list-item{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border-2);
  background:var(--white);
}
.list-item:last-child{border-bottom:none;}
.list-avatar{
  width:34px;height:34px;border-radius:50%;background:#16243E;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  font-family:var(--serif);
}
.list-main{flex:1;min-width:0;}
.list-name{font-weight:700;font-size:14px;}
.list-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.list-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}

.empty{text-align:center;padding:34px 16px;color:var(--ink-soft);}
.empty .t{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:3px;}
.empty .d{font-size:12.5px;}

.tabs2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.tabs2 button{
  flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border-2);
  background:var(--white);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.tabs2 button.active{background:#16243E;color:#fff;border-color:#16243E;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(14,24,48,0.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-backdrop.center{align-items:center;padding:16px;}
.modal-sheet{
  background:var(--white);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  max-height:88vh;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
}
.modal-backdrop.center .modal-sheet{border-radius:16px;max-height:85vh;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.modal-head h3{font-size:17px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}

.toast-wrap{position:fixed;left:0;right:0;bottom:78px;display:flex;justify-content:center;z-index:200;pointer-events:none;}
.toast{
  background:#0E1830;color:#fff;padding:10px 16px;border-radius:24px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);max-width:88%;text-align:center;margin-top:6px;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}

table.rpt{width:100%;border-collapse:collapse;font-size:12px;}
table.rpt th, table.rpt td{border:1px solid #cfc9b8;padding:6px 6px;text-align:left;}
table.rpt th{background:var(--cream);font-size:11px;}
body.gelap table.rpt th, body.gelap table.rpt td{border-color:var(--border-2);}

/* KOP laporan — teks saja, tanpa logo */
.kop{text-align:center;padding-bottom:10px;margin-bottom:12px;border-bottom:3px double #16243E;}
.kop h2{font-size:17px;letter-spacing:1px;margin-bottom:2px;}
.kop .kop-dinas{font-size:12.5px;font-weight:700;letter-spacing:.5px;margin-bottom:1px;}
.kop p{margin:1px 0;font-size:11.5px;font-weight:600;color:#555;}
.kop .kop-alamat{font-size:10.5px;font-weight:400;color:#666;margin-top:3px;}

.gate-wrap{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#16243E 0%, #0E1830 65%);padding:26px 20px;color:#fff;
}
.gate-card{background:var(--white);color:var(--ink);border-radius:18px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.gate-crest{width:64px;height:64px;border-radius:16px;background:var(--gold);color:#0E1830;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:26px;margin:0 auto 14px;}
.gate-title{text-align:center;font-size:18px;margin-bottom:2px;}
.gate-sub{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:18px;}

.mini-note{background:var(--info-bg);color:var(--info);border-radius:var(--radius-s);padding:10px 11px;font-size:12px;margin-bottom:12px;}
.mini-note.warn{background:var(--warning-bg);color:#8A5613;}
.mini-note.danger{background:var(--danger-bg);color:var(--danger);}
.mini-note.ok{background:var(--success-bg);color:var(--success);}
body.gelap .mini-note.warn{color:var(--gold-2);}

.divider{height:1px;background:var(--border-2);margin:14px 0;}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 11px;border-radius:20px;background:var(--cream);border:1px solid var(--border-2);font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.chip.active{background:#16243E;color:#fff;border-color:#16243E;}

.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-2);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;flex-shrink:0;}
.iconbtn svg{width:16px;height:16px;}

.search-box{position:relative;margin-bottom:12px;}
.search-box input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--border-2);border-radius:20px;background:var(--white);font-size:13.5px;color:var(--ink);}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);}

.bar-wrap{display:flex;align-items:flex-end;gap:10px;height:130px;padding:10px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-fill{width:100%;max-width:34px;border-radius:5px 5px 0 0;min-height:3px;}
.bar-val{font-size:11px;font-weight:700;margin-bottom:2px;}
.bar-lbl{font-size:10.5px;color:var(--ink-soft);margin-top:6px;text-align:center;}

/* Absen massal */
.massal-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border-2);}
.massal-row:last-child{border-bottom:none;}
.massal-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.massal-pick{display:flex;gap:4px;flex-shrink:0;}
.mp{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--border-2);background:var(--white);
  font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:0;}
.mp[data-st="Hadir"].on{background:var(--success);border-color:var(--success);color:#fff;}
.mp[data-st="Sakit"].on{background:var(--warning);border-color:var(--warning);color:#fff;}
.mp[data-st="Izin"].on{background:var(--info);border-color:var(--info);color:#fff;}
.mp[data-st="Alpa"].on{background:var(--danger);border-color:var(--danger);color:#fff;}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:3px 0;}
.cal-cell{
  aspect-ratio:1/1;border-radius:7px;border:1px solid var(--border-2);background:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;cursor:pointer;color:var(--ink);padding:0;
}
.cal-cell.kosong{border:none;background:transparent;cursor:default;}
.cal-cell.libur{background:var(--cream);color:var(--ink-soft);}
.cal-cell.hariini{border-color:var(--gold);border-width:2px;}
.cal-dots{display:flex;gap:2px;height:5px;align-items:center;}
.cal-dots i{width:4px;height:4px;border-radius:50%;display:block;}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-soft);}
.cal-legend span{display:flex;align-items:center;gap:4px;}
.cal-legend i{width:8px;height:8px;border-radius:50%;}

.rank-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border-2);}
.rank-row:last-child{border-bottom:none;}
.rank-no{width:22px;height:22px;border-radius:50%;background:var(--cream);border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.rank-no.top{background:var(--gold);border-color:var(--gold);color:#0E1830;}
.rank-bar{height:6px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:5px;}
.rank-bar i{display:block;height:100%;background:var(--success);}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
.switch-row .sw-label{font-size:13.5px;font-weight:600;}
.switch-row .sw-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.sw{width:44px;height:25px;border-radius:20px;background:var(--border-2);border:none;position:relative;cursor:pointer;flex-shrink:0;padding:0;}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;}
.sw.on{background:var(--success);}
.sw.on i{left:22px;}

#exportRoot{position:fixed;left:-9999px;top:0;width:760px;background:#fff;color:#1D2430;padding:30px;}
#exportRoot .kop h2, #exportRoot .kop p, #exportRoot .kop div{color:#1D2430;}
#exportRoot .kop{border-bottom:3px double #16243E;}
#exportRoot table.rpt th{background:#F7F3EA;color:#1D2430;border-color:#cfc9b8;}
#exportRoot table.rpt td{color:#1D2430;border-color:#cfc9b8;}

@media (min-width:560px){ .gate-wrap{padding:40px;} }
</style>
</head>
<body>

<div id="gate"></div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-badge">SKB</div>
      <div>
        <div class="topbar-title">SMP Kristen Basaan</div>
        <div class="topbar-sub">Sistem Absensi Guru</div>
      </div>
      <div class="topbar-right">
        <div class="sync-pill off" id="syncPill" onclick="go('sync')">
          <span class="dot"></span><span id="syncPillText">Offline</span>
        </div>
      </div>
    </div>
    <div class="view-title-row">
      <div class="view-title" id="viewTitle">Beranda</div>
      <div class="view-caption" id="viewCaption"></div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottomnav">
    <button class="navbtn" data-tab="beranda" onclick="go('beranda')">
      <span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
      Beranda
    </button>
    <button class="navbtn" data-tab="absen" onclick="go('absen')">

<script>
/* ============================================================
   DATA LAYER
   absensi: {id, guruId, tanggal, jam, jenis, status, ketDetail,
             ketBebas, deleted, synced, rev}
   guru   : {id, nama, nip, jk, nuptk, mapel, deleted, synced, rev}
============================================================ */
const DBKEY = 'agdb_v2';
const DBKEY_LAMA = 'agdb_v1';
const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbymqczAaBU71v8jviuUdnyVRngx3xSSLbSt4lIk4VtZQRoXhdCuJIIh3bRpscWtF66L/exec';

const defaultDB = () => ({
  config:{
    setupDone:false, sheetUrl:DEFAULT_SHEET_URL, password:'', lastSync:null,
    schoolName:'SMP KRISTEN BASAAN',
    dinas:'DINAS PENDIDIKAN DAERAH KABUPATEN MINAHASA TENGGARA',
    alamat:'Desa Basaan, Kecamatan Ratatotok, Kabupaten Minahasa Tenggara, Sulawesi Utara',
    kota:'Ratatotok',
    kepsek:'', nipKepsek:'',
    tema:'terang', autoSync:true, hitungSabtu:false, jamMasuk:'07:15'
  },
  guru:[],
  absensi:[]
});

function migrasiLama(){
  try{
    const lama = localStorage.getItem(DBKEY_LAMA);
    if(!lama) return null;
    const d = JSON.parse(lama);
    const db = defaultDB();
    Object.assign(db.config, d.config||{});
    db.guru = (d.guru||[]).map(g=>Object.assign({mapel:'', rev:Date.now()}, g));
    db.absensi = (d.absensi||[]).map(a=>Object.assign({jam:'', deleted:false, rev:a.ts||Date.now()}, a));
    return db;
  }catch(e){ return null; }
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DBKEY);
    let db;
    if(raw){
      db = Object.assign(defaultDB(), JSON.parse(raw));
      db.config = Object.assign(defaultDB().config, db.config||{});
    } else {
      db = migrasiLama() || defaultDB();
    }
    if(!db.config.sheetUrl) db.config.sheetUrl = DEFAULT_SHEET_URL;
    db.guru = (db.guru||[]).map(g=>Object.assign({mapel:'', deleted:false, rev:0}, g));
    db.absensi = (db.absensi||[]).map(a=>Object.assign({jam:'', deleted:false, rev:a.ts||0}, a));
    return db;
  }catch(e){ return defaultDB(); }
}
function saveDB(){
  try{ localStorage.setItem(DBKEY, JSON.stringify(DB)); }
  catch(e){ toast('Penyimpanan perangkat penuh.','err'); }
}
let DB = loadDB();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function fmtDateID(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  return `${NAMA_HARI[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  return `${d.getDate()} ${BULAN_SINGKAT[d.getMonth()]} ${d.getFullYear()}`;
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function pendingGuru(){ return DB.guru.filter(g=>!g.synced); }
function pendingAbsensi(){ return DB.absensi.filter(a=>!a.synced); }
function pendingCount(){ return pendingGuru().length + pendingAbsensi().length; }
function activeGuru(){ return DB.guru.filter(g=>!g.deleted); }
function activeAbsensi(){ return DB.absensi.filter(a=>!a.deleted); }
function guruById(id){ return DB.guru.find(g=>g.id===id); }
function namaGuru(id){ const g=guruById(id); return g?g.nama:'Guru dihapus'; }
function absenById(id){ return DB.absensi.find(a=>a.id===id); }
function absensiTanggal(tgl){ return activeAbsensi().filter(a=>a.tanggal===tgl); }
function urutNama(list){ return list.slice().sort((a,b)=>(a.nama||'').localeCompare(b.nama||'')); }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function terapkanTema(){
  document.body.classList.toggle('gelap', DB.config.tema==='gelap');
}

/* ============================================================
   GATE (setup / login)
============================================================ */
function renderGate(){
  const gate = document.getElementById('gate');
  document.getElementById('app').classList.add('hidden');
  gate.classList.remove('hidden');

  if(!DB.config.setupDone){
    gate.innerHTML = `
      <div class="gate-wrap">
        <div class="gate-card">
          <div class="gate-crest">SKB</div>
          <div class="gate-title">Absensi Guru</div>
          <div class="gate-sub">SMP Kristen Basaan · Kec. Ratatotok · Kab. Minahasa Tenggara</div>
          <div class="mini-note">Masukkan password yang sudah diatur di Spreadsheet sekolah. Aplikasi akan mengambil data guru dan seluruh riwayat absensi dari spreadsheet.</div>
          <div class="field">
            <label>Password Spreadsheet</label>
            <input type="password" id="setupPass" placeholder="Password dari admin/spreadsheet" onkeydown="if(event.key==='Enter')doInitialSync()">
          </div>

        </div>
      </div>`;

  }

  gate.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-crest">SKB</div>
        <div class="gate-title">Masuk Aplikasi</div>
        <div class="gate-sub">Masukkan password untuk membuka absensi</div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div id="loginErr" class="mini-note danger hidden"></div>
        <button class="btn btn-primary" onclick="doLogin()">Masuk</button>
        <div style="text-align:center;margin-top:12px;">
          <a href="#" style="font-size:12px;color:var(--ink-soft);text-decoration:underline;" onclick="resetPasswordFlow();return false;">Lupa password?</a>
        </div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('loginPass')?.focus(), 50);
}

function doSkipSetup(){
  const pass = document.getElementById('setupPass').value;
  const err = document.getElementById('setupErr');
  if(pass.length<4){ err.textContent='Password minimal 4 karakter.'; err.classList.remove('hidden'); return; }
  DB.config.password = pass;
  DB.config.sheetUrl = DB.config.sheetUrl || DEFAULT_SHEET_URL;
  DB.config.setupDone = true;
  saveDB();
  sessionStorage.setItem('ag_authed','1');
  toast('Aplikasi siap dipakai offline. Sinkron nanti di menu Sinkron.');

}

async function doInitialSync(){
  const pass = document.getElementById('setupPass').value;
  const err = document.getElementById('setupErr');
  err.classList.add('hidden');
  if(!pass){ err.textContent='Masukkan password terlebih dahulu.'; err.classList.remove('hidden'); return; }
  const url = DB.config.sheetUrl || DEFAULT_SHEET_URL;
  try{
    toast('Menghubungi spreadsheet…');
    const data = await apiKirim({action:'pull', password:pass}, url);
    if(!data.ok){ err.textContent = data.message || 'Password salah atau gagal terhubung.'; err.classList.remove('hidden'); return; }
    DB.config.password = pass;
    DB.config.sheetUrl = url;
    DB.config.setupDone = true;
    const hasil = gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString();
    saveDB();
    sessionStorage.setItem('ag_authed','1');
    toast(`Berhasil. ${hasil.guru} guru dan ${hasil.absensi} catatan absensi dimuat.`, 'ok');
    bootApp();
  }catch(e){
    err.textContent = 'Tidak dapat terhubung ke internet. Tekan "Mulai offline dulu", data bisa disinkronkan nanti.';
    err.classList.remove('hidden');
  }
}

function doLogin(){
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  if(pass !== DB.config.password){
    err.textContent = 'Password salah.';
    err.classList.remove('hidden');
    return;
  }
  sessionStorage.setItem('ag_authed','1');
  bootApp();
}

function resetPasswordFlow(){
  alert('Untuk mengatur ulang password, hubungi admin sekolah agar mengirim ulang password spreadsheet, atau pulihkan dari file cadangan.\n\nJika Anda admin: buka file ini di komputer, lalu pada Console ketik localStorage.clear() untuk mengatur ulang seluruh data lokal.');
}
/* ============================================================
   MESIN SINKRON — DUA ARAH (kirim + tarik)
============================================================ */
let SYNC_BUSY = false;

async function apiKirim(payload, urlOverride){
  const url = urlOverride || DB.config.sheetUrl;
  if(!url) throw new Error('URL kosong');
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
    redirect:'follow'
  });
  const teks = await res.text();
  try{ return JSON.parse(teks); }
  catch(e){ throw new Error('Balasan server tidak valid'); }
}

/* Menggabungkan data dari spreadsheet ke perangkat.
   Aturan: catatan lokal yang BELUM tersinkron tidak akan ditimpa,
   karena catatan itu masih menunggu giliran dikirim. */
function gabungDataServer(data){
  let masukGuru = 0, masukAbsensi = 0;

  (data.guru||[]).forEach(sg=>{
    if(!sg || !sg.id) return;
    const rev = Number(sg.rev||sg.updatedAt||0);
    const lokal = guruById(sg.id);
    const isi = {
      id:String(sg.id), nama:sg.nama||'', nip:sg.nip||'', jk:sg.jk||'L',
      nuptk:sg.nuptk||'', mapel:sg.mapel||'',
      deleted: sg.deleted===true || sg.deleted==='TRUE' || sg.deleted==='true',
      synced:true, rev:rev
    };
    if(!lokal){ DB.guru.push(isi); masukGuru++; }
    else if(lokal.synced && rev >= (lokal.rev||0)){ Object.assign(lokal, isi); masukGuru++; }
  });

  (data.absensi||[]).forEach(sa=>{
    if(!sa || !sa.guruId || !sa.tanggal) return;
    const rev = Number(sa.rev||sa.updatedAt||0);
    const isi = {
      id: String(sa.id||uid()),
      guruId:String(sa.guruId),
      tanggal:String(sa.tanggal).slice(0,10),
      jam: sa.jam||'',
      jenis: sa.jenis||'Datang',
      status: sa.status||'Hadir',
      ketDetail: sa.ketDetail||'',
      ketBebas: sa.ketBebas||'',
      deleted: sa.deleted===true || sa.deleted==='TRUE' || sa.deleted==='true',
      synced:true, rev:rev
    };
    let lokal = absenById(isi.id);
    if(!lokal){
      // cocokkan catatan lama yang id-nya berbeda tapi isinya sama
      lokal = DB.absensi.find(a=>a.guruId===isi.guruId && a.tanggal===isi.tanggal && a.jenis===isi.jenis);
    }
    if(!lokal){ DB.absensi.push(isi); masukAbsensi++; }
    else if(lokal.synced && rev >= (lokal.rev||0)){ Object.assign(lokal, isi); masukAbsensi++; }
  });

  return {guru:masukGuru, absensi:masukAbsensi};
}

function muatanKirim(){
  return {
    guru: pendingGuru().map(g=>({
      id:g.id, nama:g.nama, nip:g.nip, jk:g.jk, nuptk:g.nuptk, mapel:g.mapel||'',
      deleted:!!g.deleted, rev:g.rev||Date.now()
    })),
    absensi: pendingAbsensi().map(a=>({
      id:a.id, guruId:a.guruId, tanggal:a.tanggal, jam:a.jam||'', jenis:a.jenis,
      status:a.status, ketDetail:a.ketDetail||'', ketBebas:a.ketBebas||'',
      deleted:!!a.deleted, rev:a.rev||Date.now()
    }))
  };
}

/* Sinkron penuh: kirim yang tertunda, lalu tarik seluruh data spreadsheet. */
async function doSync(diam){
  if(SYNC_BUSY) return false;
  if(!DB.config.sheetUrl){ if(!diam) toast('Alamat Web App belum diisi.','err'); return false; }
  SYNC_BUSY = true; updateSyncPill();
  const kirim = muatanKirim();
  const jumlahKirim = kirim.guru.length + kirim.absensi.length;
  if(!diam) toast(jumlahKirim>0 ? `Mengirim ${jumlahKirim} data & mengambil data spreadsheet…` : 'Mengambil data dari spreadsheet…');
  try{
    const data = await apiKirim({
      action:'sync',
      password: DB.config.password,
      guru: kirim.guru,
      absensi: kirim.absensi
    });
    if(!data.ok){
      if(!diam) toast(data.message||'Sinkron ditolak server.','err');
      SYNC_BUSY=false; updateSyncPill(); return false;
    }
    // tandai terkirim dulu (hanya yang ikut dalam paket ini), supaya data server tidak dianggap bentrok
    const idGuruTerkirim = new Set(kirim.guru.map(g=>g.id));
    const idAbsenTerkirim = new Set(kirim.absensi.map(a=>a.id));
    DB.guru.forEach(g=>{ if(idGuruTerkirim.has(g.id)) g.synced = true; });
    DB.absensi.forEach(a=>{ if(idAbsenTerkirim.has(a.id)) a.synced = true; });
    const hasil = gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString();
    saveDB();
    updateSyncPill();
    if(!diam){
      toast(`Sinkron selesai. ${jumlahKirim} terkirim, ${hasil.guru+hasil.absensi} data masuk dari spreadsheet.`, 'ok');
      if(STATE.tab==='sync') renderSync(); else refresh();
    }
    SYNC_BUSY=false; updateSyncPill();
    return true;
  }catch(e){
    if(!diam) toast('Gagal terhubung. Data tetap aman dan akan dikirim saat online.','err');
    SYNC_BUSY=false; updateSyncPill();
    return false;
  }
}

/* Tarik saja (dipakai tab Laporan supaya selalu data online terbaru) */
async function tarikOnline(diam){
  if(!DB.config.sheetUrl) return false;
  if(pendingCount()>0) return await doSync(diam); // kirim dulu yang tertunda, baru tarik
  if(SYNC_BUSY) return false;
  SYNC_BUSY = true; updateSyncPill();
  try{
    const data = await apiKirim({action:'pull', password:DB.config.password});
    if(!data.ok){ SYNC_BUSY=false; updateSyncPill(); return false; }
    gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString();
    saveDB();
    SYNC_BUSY=false; updateSyncPill();
    return true;
  }catch(e){
    SYNC_BUSY=false; updateSyncPill();
    return false;
  }
}

let STATE = {
  tab:'beranda', laporanTab:'harian', absenTab:'satuan',
  absenFilterDate: todayStr(), absenFilterStatus:'',

  onlineLaporan:null
};

function bootApp(){
  terapkanTema();
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  updateSyncPill();
  go('beranda');
  if(DB.config.autoSync && navigator.onLine){
    doSync(true).then(ok=>{ if(ok){ updateSyncPill(); refresh(); } });
  }
  window.addEventListener('online', ()=>{
    if(DB.config.autoSync && pendingCount()>0){
      doSync(true).then(ok=>{ if(ok){ toast('Data tertunda berhasil dikirim.','ok'); refresh(); } });
    }
  });
}

function updateSyncPill(){
  const pill = document.getElementById('syncPill');
  const txt = document.getElementById('syncPillText');
  if(!pill) return;
  const p = pendingCount();
  if(SYNC_BUSY){ pill.className='sync-pill busy'; txt.textContent='Menyinkron…'; return; }
  if(!DB.config.sheetUrl){ pill.className='sync-pill off'; txt.textContent='Belum diatur'; }
  else if(!navigator.onLine){ pill.className='sync-pill off'; txt.textContent = p>0 ? p+' offline' : 'Offline'; }
  else if(p>0){ pill.className='sync-pill pending'; txt.textContent=p+' menunggu'; }
  else { pill.className='sync-pill'; txt.textContent='Tersinkron'; }
}

function go(tab){
  STATE.tab = tab;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const titles = {beranda:'Beranda', absen:'Absen Guru', laporan:'Laporan', admin:'Data Guru', sync:'Sinkronisasi'};
  document.getElementById('viewTitle').textContent = titles[tab];
  document.getElementById('viewCaption').textContent = fmtDateShort(todayStr());
  updateSyncPill();
  ({beranda:renderBeranda, absen:renderAbsen, laporan:renderLaporan, admin:renderAdmin, sync:renderSync}[tab])();
  document.getElementById('main').scrollTop = 0;
}
function refresh(){ go(STATE.tab); }

        urutNama(guruAktif).map(g=>{
          const rec = todays.find(a=>a.guruId===g.id);
          const bcls = rec ? ({Hadir:'b-hadir',Sakit:'b-sakit',Izin:'b-izin',Alpa:'b-alpa'}[rec.status]) : 'b-belum';
          const label = rec ? rec.status : 'Belum absen';
          return `
          <div class="list-item">
            <div class="list-avatar">${initials(g.nama)}</div>
            <div class="list-main">
              <div class="list-name-row">
                <span class="list-name">${esc(g.nama)}</span>
                <span class="badge ${bcls}">${label}</span>
              </div>
              <div class="list-sub">${g.jk==='L'?'Laki-laki':'Perempuan'} · NIP ${esc(g.nip||'-')}</div>
            </div>
            ${rec
              ? `<button class="iconbtn" title="Ubah" onclick="bukaEditAbsen('${rec.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>`
              : `<button class="btn btn-sm btn-outline" onclick="bukaEditAbsen(null,'${g.id}','${today}')">Absen</button>`}

        }).join('')}
    </div>

    <div class="card card-flush">
      <div style="padding:12px 14px 6px;" class="section-label">Absensi terbaru</div>
      ${renderAbsenList(todays.slice().reverse().slice(0,6))}
    </div>
  `;
}

function renderAbsenList(list){
  if(!list.length) return `<div class="empty"><div class="t">Belum ada data</div></div>`;
  return list.map(a=>{
    const bcls = {Hadir:'b-hadir',Sakit:'b-sakit',Izin:'b-izin',Alpa:'b-alpa'}[a.status]||'b-belum';
    return `
    <div class="list-item">
      <div class="list-avatar">${initials(namaGuru(a.guruId))}</div>
      <div class="list-main">
        <div class="list-name">${esc(namaGuru(a.guruId))}</div>
        <div class="list-sub">${esc(a.jenis)}${a.jam?' '+esc(a.jam):''} · ${fmtDateShort(a.tanggal)}${a.ketDetail?' · '+esc(a.ketDetail):''}</div>
      </div>
      <div class="list-side">
        <span class="badge ${bcls}">${esc(a.status)}</span>
        ${a.synced?'':'<span class="badge b-pending">Belum sinkron</span>'}
      </div>
    </div>`;
  }).join('');
}

function segPick(btn, hiddenId){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(hiddenId).value = btn.dataset.v;
}
function statusPick(btn){
  btn.parentElement.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const wrap = btn.closest('[data-statusfield]');
  document.getElementById(wrap ? wrap.dataset.statusfield : 'f_status').value = btn.dataset.st;
}
function toggleAlasanLain(){
  const v = document.getElementById('f_ketdetail').value;
  document.getElementById('alasanLainWrap').classList.toggle('hidden', v!=='Lainnya');
}

function catatAbsen(data){
  const rec = {
    id: uid(), guruId:data.guruId, tanggal:data.tanggal, jam:data.jam||'',
    jenis:data.jenis, status:data.status, ketDetail:data.ketDetail||'', ketBebas:data.ketBebas||'',
    deleted:false, synced:false, rev:Date.now()
  };
  DB.absensi.push(rec);
  return rec;
}

function simpanAbsen(){
  const guruId = document.getElementById('f_guru').value;
  const tanggal = document.getElementById('f_tanggal').value;
  const jam = document.getElementById('f_jam').value;
  const jenis = document.getElementById('f_jenis').value;
  const status = document.getElementById('f_status').value;
  let ketDetail = document.getElementById('f_ketdetail').value;
  const alasanLain = document.getElementById('f_alasanlain').value.trim();
  const ketBebas = document.getElementById('f_ketbebas').value.trim();

  if(!guruId){ toast('Pilih guru terlebih dahulu.','err'); return; }
  if(!tanggal){ toast('Pilih tanggal.','err'); return; }
  if(!status){ toast('Pilih status kehadiran.','err'); return; }
  if(ketDetail==='Lainnya' && !alasanLain){ toast('Tuliskan alasan lainnya.','err'); return; }
  if(ketDetail==='Lainnya') ketDetail = 'Lainnya: '+alasanLain;

  const kembar = activeAbsensi().find(a=>a.guruId===guruId && a.tanggal===tanggal && a.jenis===jenis);
  if(kembar && !confirm(`${namaGuru(guruId)} sudah punya absen ${jenis} pada tanggal ini (${kembar.status}). Ganti dengan data baru?`)) return;
  if(kembar){
    Object.assign(kembar, {jam, status, ketDetail, ketBebas, synced:false, rev:Date.now()});
  } else {
    catatAbsen({guruId, tanggal, jam, jenis, status, ketDetail, ketBebas});
  }
  saveDB();
  toast('Absensi tersimpan.','ok');
  STATE.absenFilterDate = tanggal;
  STATE.absenTab = 'riwayat';
  renderAbsen();
  sinkronDiamJikaOnline();
}

function sinkronDiamJikaOnline(){
  if(DB.config.autoSync && navigator.onLine && DB.config.sheetUrl){
    doSync(true).then(ok=>{ if(ok){ updateSyncPill(); if(STATE.tab==='absen'||STATE.tab==='beranda') refresh(); } });
  }
}

    </div>

      <button class="btn btn-outline btn-sm" style="flex:1" onclick="massalSemua('Hadir')">Semua hadir</button>

    </div>

      ${guruAktif.length===0 ? `<div class="empty"><div class="t">Belum ada data guru</div></div>` :
        guruAktif.map(g=>`
        <div class="massal-row">
          <div class="massal-name">${esc(g.nama)}</div>
          <div class="massal-pick" data-guru="${g.id}">
            ${['Hadir','Sakit','Izin','Alpa'].map(s=>`
              <button class="mp ${MASSAL.pilihan[g.id]===s?'on':''}" data-st="${s}" onclick="massalPick('${g.id}','${s}',this)">${s[0]}</button>`).join('')}
          </div>
        </div>`).join('')}
    </div>

    <button class="btn btn-primary" onclick="simpanMassal()">Simpan absensi massal</button>
    <div class="mini-note" style="margin-top:10px;">Guru yang tidak diberi tanda akan dilewati. Data yang sudah ada pada tanggal ini otomatis diperbarui, bukan diduplikat.</div>
  `;
}
function massalPick(guruId, status, btn){
  const wrap = btn.parentElement;
  if(MASSAL.pilihan[guruId]===status){
    delete MASSAL.pilihan[guruId];
    wrap.querySelectorAll('.mp').forEach(b=>b.classList.remove('on'));
    return;
  }
  MASSAL.pilihan[guruId] = status;
  wrap.querySelectorAll('.mp').forEach(b=>b.classList.toggle('on', b.dataset.st===status));
}
function massalSemua(status){
  const guruAktif = activeGuru();
  MASSAL.pilihan = {};
  if(status) guruAktif.forEach(g=>{ MASSAL.pilihan[g.id]=status; });
  document.querySelectorAll('.massal-pick').forEach(wrap=>{
    wrap.querySelectorAll('.mp').forEach(b=>b.classList.toggle('on', !!status && b.dataset.st===status));
  });
}
function simpanMassal(){
  const ids = Object.keys(MASSAL.pilihan);
  if(!ids.length){ toast('Belum ada guru yang ditandai.','err'); return; }
  let baru=0, ubah=0;
  ids.forEach(guruId=>{
    const status = MASSAL.pilihan[guruId];
    const ada = activeAbsensi().find(a=>a.guruId===guruId && a.tanggal===MASSAL.tanggal && a.jenis===MASSAL.jenis);
    if(ada){
      if(ada.status!==status){ Object.assign(ada,{status, synced:false, rev:Date.now()}); ubah++; }
    } else {
      catatAbsen({guruId, tanggal:MASSAL.tanggal, jam:nowTime(), jenis:MASSAL.jenis, status});
      baru++;
    }
  });
  saveDB();
  toast(`${baru} absensi baru, ${ubah} diperbarui.`,'ok');
  STATE.absenFilterDate = MASSAL.tanggal;
  STATE.absenTab='riwayat';
  renderAbsen();
  sinkronDiamJikaOnline();
}

async function tarikTanggalOnline(tgl){
  if(!navigator.onLine){ toast('Tidak ada koneksi internet.','err'); return; }

    toast('Data tanggal '+fmtDateShort(tgl)+' diperbarui dari spreadsheet.','ok');

  } else {

        </div>

      </div>
      <div class="field">
        <label>Keterangan kehadiran</label>
        <select id="e_ketdetail" onchange="document.getElementById('e_lainWrap').classList.toggle('hidden', this.value!=='Lainnya')">
          <option value="">— Tidak ada —</option>
          ${ketBaku.map(k=>`<option value="${k}" ${pilihanKet===k?'selected':''}>${k}</option>`).join('')}

function simpanEditAbsen(id){
  const guruId = document.getElementById('e_guru').value;
  const tanggal = document.getElementById('e_tanggal').value;
  const jam = document.getElementById('e_jam').value;
  const jenis = document.getElementById('e_jenis').value;
  const status = document.getElementById('e_status').value;
  let ketDetail = document.getElementById('e_ketdetail').value;
  const alasanLain = (document.getElementById('e_alasanlain')?.value||'').trim();
  const ketBebas = document.getElementById('e_ketbebas').value.trim();

  if(!guruId){ toast('Pilih guru terlebih dahulu.','err'); return; }
  if(!tanggal){ toast('Pilih tanggal.','err'); return; }
  if(!status){ toast('Pilih status kehadiran.','err'); return; }
  if(ketDetail==='Lainnya'){
    if(!alasanLain){ toast('Tuliskan alasan lainnya.','err'); return; }
    ketDetail = 'Lainnya: '+alasanLain;
  }

  if(id){
    const a = absenById(id);
    if(!a){ toast('Catatan tidak ditemukan.','err'); return; }
    Object.assign(a, {guruId, tanggal, jam, jenis, status, ketDetail, ketBebas, synced:false, rev:Date.now()});
  } else {
    const kembar = activeAbsensi().find(a=>a.guruId===guruId && a.tanggal===tanggal && a.jenis===jenis);
    if(kembar){
      Object.assign(kembar, {jam, status, ketDetail, ketBebas, synced:false, rev:Date.now()});
    } else {
      catatAbsen({guruId, tanggal, jam, jenis, status, ketDetail, ketBebas});
    }
  }
  saveDB();
  document.querySelector('.modal-backdrop')?.remove();
  toast(id?'Perubahan tersimpan.':'Absensi tersimpan.','ok');
  STATE.absenFilterDate = tanggal;
  refresh();
  sinkronDiamJikaOnline();
}

function hapusAbsen(id, dariModal){
  if(!confirm('Hapus catatan absensi ini? Penghapusan juga akan dikirim ke spreadsheet saat sinkron.')) return;
  const a = absenById(id);
  if(!a) return;
  a.deleted = true; a.synced = false; a.rev = Date.now();
  saveDB();
  if(dariModal) document.querySelector('.modal-backdrop')?.remove();
  toast('Catatan absensi dihapus.');
  refresh();
  sinkronDiamJikaOnline();
}

  const teks =
`*REKAP ABSENSI GURU*
${DB.config.schoolName}
${fmtDateID(tgl)}

Hadir ${c.Hadir} · Sakit ${c.Sakit} · Izin ${c.Izin} · Alpa ${c.Alpa}

function statusCounts(list){
  const c = {Hadir:0,Sakit:0,Izin:0,Alpa:0};
  list.forEach(a=>{ if(c[a.status]!==undefined) c[a.status]++; });
  return c;
}

function gambarStatusLaporan(){
  const el = document.getElementById('lapStatus');
  if(!el) return;
  const waktu = DB.config.lastSync ? new Date(DB.config.lastSync).toLocaleString('id-ID') : 'belum pernah';
  if(STATE.onlineLaporan==='memuat'){
    el.innerHTML = `<div class="mini-note">Mengambil data terbaru dari spreadsheet…</div>`;
  } else if(STATE.onlineLaporan==='ok'){
    el.innerHTML = `<div class="mini-note ok" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <span>Data online per ${waktu}</span>
      <button class="btn btn-sm btn-outline" onclick="muatLaporanOnline(true)">Muat ulang</button></div>`;
  } else if(STATE.onlineLaporan==='gagal'){
    el.innerHTML = `<div class="mini-note warn" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <span>Gagal terhubung. Menampilkan data tersimpan di perangkat (sinkron terakhir ${waktu}).</span>
      <button class="btn btn-sm btn-outline" onclick="muatLaporanOnline(true)">Coba lagi</button></div>`;
  } else {
    el.innerHTML = '';
  }
}

async function muatLaporanOnline(paksa){
  if(!DB.config.sheetUrl) return;
  if(!paksa && STATE.onlineLaporan==='ok' && Date.now()-(STATE.lapFetchTs||0) < 60000) return;
  if(!navigator.onLine){ STATE.onlineLaporan='gagal'; gambarStatusLaporan(); return; }
  STATE.onlineLaporan = 'memuat';
  gambarStatusLaporan();
  const ok = await tarikOnline(true);
  STATE.onlineLaporan = ok ? 'ok' : 'gagal';
  if(ok) STATE.lapFetchTs = Date.now();
  if(STATE.tab==='laporan'){
    gambarLaporanBody();
    gambarStatusLaporan();
  }
  updateSyncPill();
  if(paksa) toast(ok?'Laporan diperbarui dari spreadsheet.':'Gagal mengambil data online.', ok?'ok':'err');
}

function pintasRentang(jenis){
  const d = new Date();
  const akhir = todayStr();
  let awal;
  if(jenis==='minggu'){ d.setDate(d.getDate()-6); }
  else if(jenis==='bulan'){ d.setDate(1); }
  else { d.setMonth(d.getMonth()-5); d.setDate(1); }
  awal = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  STATE.lapAwal = awal; STATE.lapAkhir = akhir;
  renderLaporanRentang();
}
function rekapPerGuru(list){
  const per = {};
  list.forEach(a=>{
    if(!per[a.guruId]) per[a.guruId] = {Hadir:0,Sakit:0,Izin:0,Alpa:0};
    if(per[a.guruId][a.status]!==undefined) per[a.guruId][a.status]++;
  });
  return Object.keys(per).map(gid=>{
    const t = per[gid].Hadir+per[gid].Sakit+per[gid].Izin+per[gid].Alpa;
    return {guruId:gid, nama:namaGuru(gid), ...per[gid], total:t, persen: t?Math.round(per[gid].Hadir/t*100):0};
  }).sort((a,b)=>a.nama.localeCompare(b.nama));
}

  if(kind==='harian'){
    const list = activeAbsensi().filter(a=>a.tanggal===STATE.lapTanggal)
      .slice().sort((a,b)=>namaGuru(a.guruId).localeCompare(namaGuru(b.guruId)));
    return {
      judul:'LAPORAN ABSENSI HARIAN',
      sub: fmtDateID(STATE.lapTanggal),
      head:['No','Nama Guru','NIP','Jenis','Jam','Status','Keterangan'],
      rows: list.map((a,i)=>{
        const g = guruById(a.guruId);
        return [i+1, namaGuru(a.guruId), g?(g.nip||'-'):'-', a.jenis, a.jam||'-', a.status, [a.ketDetail,a.ketBebas].filter(Boolean).join(' — ')||'-'];
      })
    };
  }
  if(kind==='rentang' || kind==='bulanan'){
    const list = kind==='bulanan'
      ? activeAbsensi().filter(a=>a.tanggal.slice(0,7)===STATE.lapBulan)
      : activeAbsensi().filter(a=>a.tanggal>=STATE.lapAwal && a.tanggal<=STATE.lapAkhir);
    const rows = rekapPerGuru(list);
    const [th,bl] = (STATE.lapBulan||'2026-01').split('-').map(Number);
    return {
      judul: kind==='bulanan' ? 'LAPORAN ABSENSI BULANAN' : 'LAPORAN ABSENSI RENTANG TANGGAL',
      sub: kind==='bulanan' ? `${NAMA_BULAN[bl-1]} ${th}` : `${fmtDateShort(STATE.lapAwal)} sampai ${fmtDateShort(STATE.lapAkhir)}`,
      head:['No','Nama Guru','NIP','Hadir','Sakit','Izin','Alpa','% Hadir'],
      rows: rows.map((r,i)=>{
        const g = guruById(r.guruId);
        return [i+1, r.nama, g?(g.nip||'-'):'-', r.Hadir, r.Sakit, r.Izin, r.Alpa, r.persen+'%'];
      })
    };
  }
  const g = guruById(STATE.lapGuruId);
  const list = activeAbsensi().filter(a=>a.guruId===STATE.lapGuruId).slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  return {
    judul:'LAPORAN ABSENSI PER GURU',
    sub: (g?g.nama:'-') + ' · NIP ' + (g?(g.nip||'-'):'-'),
    head:['No','Tanggal','Jenis','Jam','Status','Keterangan'],
    rows: list.map((a,i)=>[i+1, fmtDateShort(a.tanggal), a.jenis, a.jam||'-', a.status, [a.ketDetail,a.ketBebas].filter(Boolean).join(' — ')||'-'])
  };
}

function buildExportHTML(kind){
  const d = barisTabel(kind);
  const tabel = `<table class="rpt">
    <tr>${d.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>
    ${d.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${d.head.length}" style="text-align:center">Tidak ada data</td></tr>`}
  </table>`;
  return `
    ${kopHTML()}
    <div style="text-align:center;margin-bottom:14px;">
      <div style="font-family:Georgia,serif;font-weight:700;font-size:15px;text-decoration:underline;letter-spacing:.5px;">${d.judul}</div>
      <div style="font-size:12px;color:#555;margin-top:3px;">${esc(d.sub)}</div>
    </div>
    ${tabel}
    ${ttdHTML()}
  `;
}

async function exportReport(fmt, kind){
  const root = document.getElementById('exportRoot');
  root.innerHTML = buildExportHTML(kind);
  toast('Menyiapkan ekspor…');
  try{
    const canvas = await html2canvas(root, {scale:2, backgroundColor:'#ffffff'});
    const nama = 'Laporan_Absensi_'+kind+'_'+todayStr();
    if(fmt==='png'){
      const link = document.createElement('a');
      link.download = nama+'.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } else {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/png');
      const pdf = new jsPDF('p','mm','a4');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const imgH = canvas.height * pageW / canvas.width;
      let sisa = imgH, posisi = 8;
      pdf.addImage(imgData,'PNG',0,posisi,pageW,imgH);
      sisa -= (pageH - posisi);
      while(sisa > 0){
        posisi = sisa - imgH + 8;
        pdf.addPage();
        pdf.addImage(imgData,'PNG',0,posisi,pageW,imgH);
        sisa -= pageH;
      }
      pdf.save(nama+'.pdf');
    }
    toast('Laporan berhasil diekspor.','ok');
  }catch(e){
    toast('Gagal ekspor. Pastikan internet aktif agar pustaka ekspor termuat.','err');
  }
}

function exportCSV(kind){
  const d = barisTabel(kind);
  const aman = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const isi = [
    [DB.config.schoolName], [d.judul], [d.sub], [],
    d.head, ...d.rows
  ].map(r=>r.map(aman).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+isi], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Laporan_Absensi_'+kind+'_'+todayStr()+'.csv';
  link.click();
  toast('File CSV diunduh. Bisa dibuka di Excel.','ok');
}

  back.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-head"><h3>${g?'Ubah data guru':'Tambah guru'}</h3><button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">&times;</button></div>
      <div class="field"><label>Nama lengkap</label><input type="text" id="m_nama" value="${g?esc(g.nama):''}" placeholder="Nama guru"></div>
      <div class="field"><label>NIP</label><input type="text" id="m_nip" value="${g?esc(g.nip):''}" placeholder="Nomor Induk Pegawai"></div>
      <div class="field">
        <label>Jenis kelamin</label>
        <div class="seg">
          <button type="button" id="m_jk_L" class="${(!g||g.jk==='L')?'active':''}" onclick="mJkPick('L')">Laki-laki</button>
          <button type="button" id="m_jk_P" class="${(g&&g.jk==='P')?'active':''}" onclick="mJkPick('P')">Perempuan</button>
        </div>

function mJkPick(v){
  document.getElementById('m_jk').value=v;
  document.getElementById('m_jk_L').classList.toggle('active', v==='L');
  document.getElementById('m_jk_P').classList.toggle('active', v==='P');
}
function simpanGuru(id){
  const nama = document.getElementById('m_nama').value.trim();
  const nip = document.getElementById('m_nip').value.trim();
  const jk = document.getElementById('m_jk').value;
  const nuptk = document.getElementById('m_nuptk').value.trim();
  const mapel = document.getElementById('m_mapel').value.trim();
  if(!nama){ toast('Nama guru wajib diisi.','err'); return; }
  if(id){
    Object.assign(guruById(id), {nama,nip,jk,nuptk,mapel, synced:false, rev:Date.now()});
  } else {
    DB.guru.push({id:uid(), nama, nip, jk, nuptk, mapel, synced:false, deleted:false, rev:Date.now()});
  }
  saveDB();
  document.querySelector('.modal-backdrop')?.remove();
  renderAdmin();
  toast('Data guru tersimpan.','ok');
  sinkronDiamJikaOnline();
}
function hapusGuru(id){
  if(!confirm('Hapus data guru ini? Riwayat absensinya tetap tersimpan.')) return;
  const g = guruById(id);
  g.deleted = true; g.synced=false; g.rev = Date.now();
  saveDB(); renderAdmin();
  toast('Guru dihapus dari daftar aktif.');
  sinkronDiamJikaOnline();
}
function exportGuruCSV(){
  const aman = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = [['No','Nama','NIP','NUPTK','Jenis Kelamin','Mata Pelajaran']];
  urutNama(activeGuru()).forEach((g,i)=>rows.push([i+1,g.nama,g.nip||'',g.nuptk||'',g.jk==='L'?'Laki-laki':'Perempuan',g.mapel||'']));
  const blob = new Blob(['\uFEFF'+rows.map(r=>r.map(aman).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Daftar_Guru_'+todayStr()+'.csv';
  link.click();
  toast('Daftar guru diunduh.','ok');
}

        Sinkron terakhir: ${cfg.lastSync ? new Date(cfg.lastSync).toLocaleString('id-ID') : 'belum pernah'}<br>
        Tersimpan di perangkat: ${activeGuru().length} guru · ${activeAbsensi().length} catatan absensi

      <div style="font-size:11.5px;color:var(--ink-soft);">Sinkron mengirim data baru dari HP ke spreadsheet, lalu menarik seluruh data spreadsheet ke HP.</div>
    </div>

    <div class="card">
      <div class="section-label">Koneksi spreadsheet</div>
      <div class="field"><label>Alamat Web App Google Apps Script</label>
        <input type="url" id="s_url" value="${esc(cfg.sheetUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec">

      <div class="field"><label>Nama sekolah</label><input type="text" id="c_sekolah" value="${esc(cfg.schoolName||'')}"></div>

    </div>

    <div class="card">
      <div class="section-label">Preferensi</div>

function simpanUrl(){
  DB.config.sheetUrl = document.getElementById('s_url').value.trim();
  saveDB(); toast('Alamat sinkron disimpan.','ok'); updateSyncPill();
}
function simpanIdentitas(){
  Object.assign(DB.config, {
    dinas: document.getElementById('c_dinas').value.trim(),
    schoolName: document.getElementById('c_sekolah').value.trim(),
    alamat: document.getElementById('c_alamat').value.trim(),
    kota: document.getElementById('c_kota').value.trim(),
    kepsek: document.getElementById('c_kepsek').value.trim(),
    nipKepsek: document.getElementById('c_nipkepsek').value.trim()
  });
  saveDB(); toast('Identitas laporan disimpan.','ok');
}
function toggleCfg(key, btn){
  DB.config[key] = !DB.config[key];
  btn.classList.toggle('on', DB.config[key]);
  saveDB();
}
function toggleTema(btn){
  DB.config.tema = DB.config.tema==='gelap' ? 'terang' : 'gelap';
  btn.classList.toggle('on', DB.config.tema==='gelap');
  saveDB(); terapkanTema();
}
async function tarikPaksa(){
  if(!navigator.onLine){ toast('Tidak ada koneksi internet.','err'); return; }
  toast('Mengambil seluruh data spreadsheet…');
  const ok = await tarikOnline(true);
  toast(ok?'Data spreadsheet berhasil dimuat ke perangkat.':'Gagal mengambil data.', ok?'ok':'err');
  renderSync();
}
function openGantiPassword(){
  const back = document.createElement('div');
  back.className = 'modal-backdrop center';
  back.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-head"><h3>Ganti password</h3><button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">&times;</button></div>
      <div class="mini-note">Password ini harus sama dengan yang diatur di spreadsheet sekolah.</div>
      <div class="field"><label>Password lama</label><input type="password" id="p_old"></div>
      <div class="field"><label>Password baru</label><input type="password" id="p_new"></div>
      <div class="field"><label>Ulangi password baru</label><input type="password" id="p_new2"></div>
      <button class="btn btn-primary" onclick="gantiPassword()">Simpan password</button>
    </div>`;
  document.body.appendChild(back);
}
function gantiPassword(){
  const old = document.getElementById('p_old').value;
  const n1 = document.getElementById('p_new').value;
  const n2 = document.getElementById('p_new2').value;
  if(old!==DB.config.password){ toast('Password lama salah.','err'); return; }
  if(n1.length<4){ toast('Password baru minimal 4 karakter.','err'); return; }
  if(n1!==n2){ toast('Konfirmasi password tidak sama.','err'); return; }
  DB.config.password = n1;
  saveDB();
  document.querySelector('.modal-backdrop')?.remove();
  toast('Password berhasil diubah.','ok');
}
function backupData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'cadangan-absensi-'+todayStr()+'.json';
  link.click();
  toast('Cadangan diunduh.','ok');
}
function restoreData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Memulihkan cadangan akan mengganti seluruh data saat ini. Lanjutkan?')) return;
      DB = Object.assign(defaultDB(), data);
      DB.config = Object.assign(defaultDB().config, data.config||{});
      saveDB();
      terapkanTema();
      toast('Data berhasil dipulihkan.','ok');
      renderSync();
    }catch(e){ toast('File cadangan tidak valid.','err'); }
  };
  reader.readAsText(file);
}
function doLogout(){
  sessionStorage.removeItem('ag_authed');
  location.reload();
}

/* ============================================================
   BOOT
============================================================ */
(function init(){
  terapkanTema();
  renderGate();
  if(DB.config.setupDone && sessionStorage.getItem('ag_authed')==='1'){
    bootApp();
  }
})();
</script>
