<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Absensi Guru — SMP Kristen Basaan</title>
<meta name="theme-color" content="#16243E">
<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --navy:#16243E;
  --navy-2:#22385C;
  --navy-3:#0E1830;
  --gold:#C79A3E;
  --gold-2:#E4C776;
  --cream:#F7F3EA;
  --white:#FFFFFF;
  --ink:#1D2430;
  --ink-soft:#5B6472;
  --border:#E4DCC9;
  --border-2:#DDD4C0;
  --success:#2F7D5C;
  --success-bg:#E6F2EC;
  --warning:#C77E1D;
  --warning-bg:#FBEDDC;
  --info:#2C6E9E;
  --info-bg:#E4EEF5;
  --danger:#B23B3B;
  --danger-bg:#F8E7E7;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --shadow:0 2px 10px rgba(22,36,62,0.08);
  --serif: Georgia, 'Times New Roman', Cambria, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:700;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-2);}
.hidden{display:none !important;}
a{color:inherit;}

/* Focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============================================================
   LAYOUT SHELL
============================================================ */
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--cream);
  position:relative;
}

.topbar{
  background:linear-gradient(155deg, var(--navy) 0%, var(--navy-3) 100%);
  color:var(--white);
  padding:14px 16px 16px;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:0 3px 10px rgba(0,0,0,0.18);
}
.topbar-row{display:flex; align-items:center; gap:10px;}
.topbar-badge{
  width:38px;height:38px;border-radius:10px;
  background:var(--gold);
  color:var(--navy-3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:16px;
  flex-shrink:0;
}
.topbar-title{font-family:var(--serif);font-size:16px;line-height:1.25;font-weight:700;}
.topbar-sub{font-size:11px;color:#C9D2E2;margin-top:1px;letter-spacing:.2px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sync-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.18);
  padding:5px 9px;border-radius:20px;font-size:11px;color:#EDEFF3;
  cursor:pointer;
}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#63C48A;}
.sync-pill.pending .dot{background:var(--gold-2);}
.sync-pill.off .dot{background:#9AA4B5;}

.view-title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;}
.view-title{font-size:20px;}
.view-caption{font-size:12px;color:#B9C2D4;}

main{
  flex:1;
  padding:14px 14px 90px;
  overflow-y:auto;
}

/* Bottom nav */
.bottomnav{
  position:sticky;
  bottom:0;
  z-index:30;
  background:var(--white);
  border-top:1px solid var(--border-2);
  display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 10px rgba(22,36,62,0.08);
}
.navbtn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-soft);
  padding:6px 2px;border-radius:10px;font-size:10.5px;
  cursor:pointer;
}
.navbtn svg{width:21px;height:21px;}
.navbtn.active{color:var(--navy);}
.navbtn.active .navicon{background:var(--cream);}
.navicon{width:34px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:8px;}

/* ============================================================
   COMPONENTS
============================================================ */
.card{
  background:var(--white);
  border:1px solid var(--border-2);
  border-radius:var(--radius-m);
  padding:14px;
  margin-bottom:12px;
}
.card-flush{padding:0;overflow:hidden;}

.section-label{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:0 0 8px 2px;
  font-weight:600;
}

.stat-row{display:flex;gap:10px;margin-bottom:12px;}
.stat-card{
  flex:1;background:var(--white);border:1px solid var(--border-2);
  border-radius:var(--radius-m);padding:12px 10px;text-align:left;
  border-left:4px solid var(--navy);
}
.stat-card .num{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);line-height:1;}
.stat-card .lbl{font-size:11px;color:var(--ink-soft);margin-top:5px;}
.stat-card.gold{border-left-color:var(--gold);}
.stat-card.gold .num{color:#8A6A22;}
.stat-card.green{border-left-color:var(--success);}
.stat-card.green .num{color:var(--success);}
.stat-card.red{border-left-color:var(--danger);}
.stat-card.red .num{color:var(--danger);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:var(--radius-s);
  border:1px solid transparent;font-size:14px;font-weight:600;
  cursor:pointer;line-height:1.1;width:100%;
}
.btn-primary{background:var(--navy);color:var(--white);}
.btn-primary:active{background:var(--navy-3);}
.btn-gold{background:var(--gold);color:var(--navy-3);}
.btn-outline{background:var(--white);color:var(--navy);border-color:var(--navy);}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--border-2);}
.btn-danger{background:var(--white);color:var(--danger);border-color:var(--danger);}
.btn-sm{width:auto;padding:7px 12px;font-size:12.5px;}
.btn-row{display:flex;gap:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text], .field input[type=password], .field input[type=date], .field input[type=time],
.field select, .field textarea, .field input[type=url]{
  width:100%;padding:10px 11px;border:1px solid var(--border-2);border-radius:var(--radius-s);
  background:var(--white);font-size:14.5px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:64px;}
.field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}

.seg{display:flex;border:1px solid var(--border-2);border-radius:var(--radius-s);overflow:hidden;}
.seg button{
  flex:1;padding:10px 6px;border:none;background:var(--white);color:var(--ink-soft);
  font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--border-2);
}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--navy);color:var(--white);}

.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-btn{
  padding:12px 8px;border-radius:var(--radius-s);border:1.5px solid var(--border-2);
  background:var(--white);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;gap:8px;justify-content:center;
}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.status-btn[data-st="Hadir"] .status-dot{background:var(--success);}
.status-btn[data-st="Sakit"] .status-dot{background:var(--warning);}
.status-btn[data-st="Izin"] .status-dot{background:var(--info);}
.status-btn[data-st="Alpa"] .status-dot{background:var(--danger);}
.status-btn.active[data-st="Hadir"]{background:var(--success-bg);border-color:var(--success);color:var(--success);}
.status-btn.active[data-st="Sakit"]{background:var(--warning-bg);border-color:var(--warning);color:#8A5613;}
.status-btn.active[data-st="Izin"]{background:var(--info-bg);border-color:var(--info);color:var(--info);}
.status-btn.active[data-st="Alpa"]{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.b-hadir{background:var(--success-bg);color:var(--success);}
.badge.b-sakit{background:var(--warning-bg);color:#8A5613;}
.badge.b-izin{background:var(--info-bg);color:var(--info);}
.badge.b-alpa{background:var(--danger-bg);color:var(--danger);}
.badge.b-sync{background:var(--info-bg);color:var(--info);}
.badge.b-pending{background:var(--warning-bg);color:#8A5613;}

.list-item{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border-2);
  background:var(--white);
}
.list-item:last-child{border-bottom:none;}
.list-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--white);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  font-family:var(--serif);
}
.list-main{flex:1;min-width:0;}
.list-name{font-weight:700;font-size:14px;}
.list-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.list-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}

.empty{
  text-align:center;padding:34px 16px;color:var(--ink-soft);
}
.empty svg{width:44px;height:44px;color:var(--border-2);margin-bottom:8px;}
.empty .t{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:3px;}
.empty .d{font-size:12.5px;}

.tabs2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.tabs2 button{
  flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border-2);
  background:var(--white);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.tabs2 button.active{background:var(--navy);color:var(--white);border-color:var(--navy);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(14,24,48,0.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-backdrop.center{align-items:center;padding:16px;}
.modal-sheet{
  background:var(--white);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  max-height:88vh;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
}
.modal-backdrop.center .modal-sheet{border-radius:16px;max-height:85vh;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.modal-head h3{font-size:17px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}

.toast-wrap{position:fixed;left:0;right:0;bottom:78px;display:flex;justify-content:center;z-index:200;pointer-events:none;}
.toast{
  background:var(--navy-3);color:var(--white);padding:10px 16px;border-radius:24px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);max-width:88%;text-align:center;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}

table.rpt{width:100%;border-collapse:collapse;font-size:12px;}
table.rpt th, table.rpt td{border:1px solid #cfc9b8;padding:6px 6px;text-align:left;}
table.rpt th{background:var(--cream);font-size:11px;}

.kop{text-align:center;padding-bottom:10px;margin-bottom:12px;border-bottom:3px double var(--navy);}
.kop .kop-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.kop-crest{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--gold-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:20px;border:2px solid var(--gold);}
.kop h2{font-size:16px;letter-spacing:.3px;}
.kop p{margin:1px 0;font-size:11.5px;font-weight:600;color:var(--ink-soft);}

.gate-wrap{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy) 0%, var(--navy-3) 65%);padding:26px 20px;color:var(--white);
}
.gate-card{background:var(--white);color:var(--ink);border-radius:18px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.gate-crest{width:64px;height:64px;border-radius:16px;background:var(--gold);color:var(--navy-3);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:26px;margin:0 auto 14px;}
.gate-title{text-align:center;font-size:18px;margin-bottom:2px;}
.gate-sub{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:18px;}

.progress-dot{display:flex;gap:6px;justify-content:center;margin:14px 0;}
.progress-dot span{width:6px;height:6px;border-radius:50%;background:var(--border-2);}
.progress-dot span.on{background:var(--gold);}

.mini-note{background:var(--info-bg);color:var(--info);border-radius:var(--radius-s);padding:10px 11px;font-size:12px;margin-bottom:12px;}
.mini-note.warn{background:var(--warning-bg);color:#8A5613;}
.mini-note.danger{background:var(--danger-bg);color:var(--danger);}

.divider{height:1px;background:var(--border-2);margin:14px 0;}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 11px;border-radius:20px;background:var(--cream);border:1px solid var(--border-2);font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.chip.active{background:var(--navy);color:var(--white);border-color:var(--navy);}

.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-2);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;flex-shrink:0;}
.iconbtn svg{width:16px;height:16px;}

.search-box{position:relative;margin-bottom:12px;}
.search-box input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--border-2);border-radius:20px;background:var(--white);font-size:13.5px;}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);}

.bar-wrap{display:flex;align-items:flex-end;gap:10px;height:130px;padding:10px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-fill{width:100%;max-width:34px;border-radius:5px 5px 0 0;min-height:3px;}
.bar-val{font-size:11px;font-weight:700;margin-bottom:2px;}
.bar-lbl{font-size:10.5px;color:var(--ink-soft);margin-top:6px;text-align:center;}

#exportRoot{position:fixed;left:-9999px;top:0;width:720px;background:#fff;padding:26px;}

@media (min-width:560px){
  .gate-wrap{padding:40px;}
}
</style>
</head>
<body>

<div id="gate"></div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-badge">SKB</div>
      <div>
        <div class="topbar-title">SMP Kristen Basaan</div>
        <div class="topbar-sub">Sistem Absensi Guru</div>
      </div>
      <div class="topbar-right">
        <div class="sync-pill off" id="syncPill" onclick="go('sync')">
          <span class="dot"></span><span id="syncPillText">Offline</span>
        </div>
      </div>
    </div>
    <div class="view-title-row">
      <div class="view-title" id="viewTitle">Beranda</div>
      <div class="view-caption" id="viewCaption"></div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottomnav">
    <button class="navbtn" data-tab="beranda" onclick="go('beranda')">
      <span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
      Beranda
    </button>
    <button class="navbtn" data-tab="absen" onclick="go('absen')">
      <span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v6a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h11"/></svg></span>
      Absen
    </button>
    <button class="navbtn" data-tab="laporan" onclick="go('laporan')">
      <span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M9 19v-7"/><path d="M14 19V9"/><path d="M19 19v-4"/></svg></span>
      Laporan
    </button>
    <button class="navbtn" data-tab="admin" onclick="go('admin')">
      <span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      Guru
    </button>
    <button class="navbtn" data-tab="sync" onclick="go('sync')">
      <span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-2.6 6.3"/><path d="M21 5v6h-6"/></svg></span>
      Sinkron
    </button>
  </nav>
</div>

<div id="toastWrap" class="toast-wrap"></div>
<div id="exportRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* ============================================================
   DATA LAYER
============================================================ */
const DBKEY = 'agdb_v1';
const defaultDB = () => ({
  config:{ setupDone:false, sheetUrl:'', password:'', lastSync:null, schoolName:'SMP KRISTEN BASAAN' },
  guru:[],      // {id, nama, nip, jk, nuptk, synced, deleted}
  absensi:[],   // {id, guruId, tanggal, jenis, ketBebas, status, ketDetail, alasanLain, synced, ts}
});
function loadDB(){
  try{
    const raw = localStorage.getItem(DBKEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed);
  }catch(e){ return defaultDB(); }
}
function saveDB(){ localStorage.setItem(DBKEY, JSON.stringify(DB)); }
let DB = loadDB();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return 'h'+Math.abs(h).toString(36);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDateID(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'][d.getDay()];
  const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()];
  return `${hari}, ${d.getDate()} ${bln} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()];
  return `${d.getDate()} ${bln} ${d.getFullYear()}`;
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function pendingCount(){
  return DB.guru.filter(g=>!g.synced).length + DB.absensi.filter(a=>!a.synced).length;
}
function activeGuru(){ return DB.guru.filter(g=>!g.deleted); }
function guruById(id){ return DB.guru.find(g=>g.id===id); }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2400);
}

/* ============================================================
   GATE (setup / login)
============================================================ */
function renderGate(){
  const gate = document.getElementById('gate');
  document.getElementById('app').classList.add('hidden');
  gate.classList.remove('hidden');

  if(!DB.config.setupDone){
    gate.innerHTML = `
      <div class="gate-wrap">
        <div class="gate-card">
          <div class="gate-crest">SKB</div>
          <div class="gate-title">Absensi Guru</div>
          <div class="gate-sub">SMP Kristen Basaan · Kec. Ratatotok · Kab. Minahasa Tenggara</div>

function doSkipSetup(){
  const pass = document.getElementById('setupPass').value;
  const pass2 = document.getElementById('setupPass2').value;
  const url = document.getElementById('setupUrl').value.trim();
  const err = document.getElementById('setupErr');
  if(pass.length<4){ err.textContent='Password minimal 4 karakter.'; err.classList.remove('hidden'); return; }
  if(pass!==pass2){ err.textContent='Password tidak sama.'; err.classList.remove('hidden'); return; }
  DB.config.password = pass;
  DB.config.sheetUrl = url;
  DB.config.setupDone = true;
  saveDB();
  sessionStorage.setItem('ag_authed','1');
  toast('Aplikasi siap dipakai offline. Sinkron nanti di menu Sinkron.');
  bootApp();
}

async function doInitialSync(){
  const pass = document.getElementById('setupPass').value;
  const pass2 = document.getElementById('setupPass2').value;
  const url = document.getElementById('setupUrl').value.trim();
  const err = document.getElementById('setupErr');
  err.classList.add('hidden');
  if(pass.length<4){ err.textContent='Password minimal 4 karakter.'; err.classList.remove('hidden'); return; }
  if(pass!==pass2){ err.textContent='Password tidak sama.'; err.classList.remove('hidden'); return; }
  if(!url){ err.textContent='Isi alamat Web App Apps Script, atau tekan "Lewati sinkron" untuk mulai offline dulu.'; err.classList.remove('hidden'); return; }
  try{
    toast('Menghubungi spreadsheet…');
    const res = await fetch(url+'?action=init&pass='+encodeURIComponent(pass));
    const data = await res.json();
    if(!data.ok){ err.textContent = data.message || 'Gagal sinkron. Periksa URL/koneksi.'; err.classList.remove('hidden'); return; }
    (data.guru||[]).forEach(g=>{
      DB.guru.push({ id: g.id||uid(), nama:g.nama, nip:g.nip||'', jk:g.jk||'L', nuptk:g.nuptk||'', synced:true, deleted:false });
    });
    DB.config.password = pass;
    DB.config.sheetUrl = url;
    DB.config.setupDone = true;
    DB.config.lastSync = new Date().toISOString();
    saveDB();
    sessionStorage.setItem('ag_authed','1');
    toast('Sinkron berhasil. Selamat datang!', 'ok');
    bootApp();
  }catch(e){
    err.textContent = 'Tidak dapat terhubung ke internet/spreadsheet. Tekan "Lewati sinkron" untuk mulai offline, sinkron nanti.';
    err.classList.remove('hidden');
  }
}

function doLogin(){
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  if(pass !== DB.config.password){
    err.textContent = 'Password salah.';
    err.classList.remove('hidden');
    return;
  }
  sessionStorage.setItem('ag_authed','1');
  bootApp();
}

function resetPasswordFlow(){
  alert('Untuk mengatur ulang password, hubungi admin sekolah agar men-sinkron ulang dari spreadsheet, atau gunakan cadangan (backup) data jika tersedia di perangkat lain.\\n\\nJika Anda admin: buka file ini di komputer, lalu di Console tekan localStorage.clear() untuk mengatur ulang seluruh data (data lokal akan hilang).');
}

/* ---- Export (PNG / PDF) with KOP letterhead ---- */
function buildExportHTML(kind){
  const school = DB.config.schoolName || 'SMP KRISTEN BASAAN';
  let title='', tableHtml='', subtitle='';
  if(kind==='harian'){
    const list = DB.absensi.filter(a=>a.tanggal===STATE.lapTanggal).slice().sort((a,b)=>{
      const ga=guruById(a.guruId), gb=guruById(b.guruId); return (ga?ga.nama:'').localeCompare(gb?gb.nama:'');
    });
    title = 'LAPORAN ABSENSI HARIAN';
    subtitle = fmtDateID(STATE.lapTanggal);
    tableHtml = `<table class="rpt"><tr><th>No</th><th>Nama Guru</th><th>Jenis</th><th>Status</th><th>Keterangan</th></tr>
      ${list.map((a,i)=>{const g=guruById(a.guruId); return `<tr><td>${i+1}</td><td>${esc(g?g.nama:'-')}</td><td>${a.jenis}</td><td>${a.status}</td><td>${esc(a.ketDetail||'')} ${esc(a.ketBebas||'')}</td></tr>`}).join('') || '<tr><td colspan="5" style="text-align:center">Tidak ada data</td></tr>'}
      </table>`;
  } else if(kind==='rentang'){
    const list = DB.absensi.filter(a=> a.tanggal>=STATE.lapAwal && a.tanggal<=STATE.lapAkhir);
    const perGuru = {};
    list.forEach(a=>{ if(!perGuru[a.guruId]) perGuru[a.guruId]={Hadir:0,Sakit:0,Izin:0,Alpa:0}; perGuru[a.guruId][a.status]++; });
    const rows = Object.keys(perGuru).map(gid=>{ const g=guruById(gid); return {nama:g?g.nama:'-', ...perGuru[gid]}; }).sort((a,b)=>a.nama.localeCompare(b.nama));
    title = 'LAPORAN ABSENSI RENTANG TANGGAL';
    subtitle = fmtDateShort(STATE.lapAwal)+' — '+fmtDateShort(STATE.lapAkhir);
    tableHtml = `<table class="rpt"><tr><th>No</th><th>Nama Guru</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th></tr>
      ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${r.Hadir}</td><td>${r.Sakit}</td><td>${r.Izin}</td><td>${r.Alpa}</td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center">Tidak ada data</td></tr>'}
      </table>`;
  } else {
    const g = guruById(STATE.lapGuruId);
    const list = DB.absensi.filter(a=>a.guruId===STATE.lapGuruId).slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    title = 'LAPORAN ANALISIS PER GURU';
    subtitle = (g?g.nama:'-') + ' · NIP '+(g?g.nip||'-':'-');
    tableHtml = `<table class="rpt"><tr><th>No</th><th>Tanggal</th><th>Jenis</th><th>Status</th><th>Keterangan</th></tr>
      ${list.map((a,i)=>`<tr><td>${i+1}</td><td>${fmtDateShort(a.tanggal)}</td><td>${a.jenis}</td><td>${a.status}</td><td>${esc(a.ketDetail||'')} ${esc(a.ketBebas||'')}</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center">Tidak ada data</td></tr>'}
      </table>`;
  }
  const now = new Date();
  return `
    <div class="kop">
      <div class="kop-row">
        <div class="kop-crest">SKB</div>
        <div>
          <h2>${esc(school)}</h2>
          <p>KECAMATAN RATATOTOK</p>
          <p>KABUPATEN MINAHASA TENGGARA</p>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:14px;">
      <div style="font-family:Georgia,serif;font-weight:700;font-size:15px;text-decoration:underline;">${title}</div>
      <div style="font-size:12px;color:#555;margin-top:2px;">${subtitle}</div>
    </div>
    ${tableHtml}
    <div style="display:flex;justify-content:space-between;margin-top:34px;font-size:11.5px;">
      <div>Dicetak: ${now.toLocaleDateString('id-ID')} ${now.toLocaleTimeString('id-ID')}</div>
      <div style="text-align:center;">
        Ratatotok, ${now.toLocaleDateString('id-ID')}<br>Kepala Sekolah<br><br><br><br>
        (........................................)
      </div>
    </div>
  `;
}

async function exportReport(fmt, kind){
  const root = document.getElementById('exportRoot');
  root.innerHTML = buildExportHTML(kind);
  toast('Menyiapkan ekspor…');
  try{
    const canvas = await html2canvas(root, {scale:2, backgroundColor:'#ffffff'});
    const filename = 'Laporan_Absensi_'+kind+'_'+todayStr();
    if(fmt==='png'){
      const link = document.createElement('a');
      link.download = filename+'.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } else {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/png');
      const pdf = new jsPDF('p','mm','a4');
      const pageW = pdf.internal.pageSize.getWidth();
      const imgH = canvas.height * pageW / canvas.width;
      pdf.addImage(imgData, 'PNG', 0, 8, pageW, imgH);
      pdf.save(filename+'.pdf');
    }
    toast('Berhasil diekspor.', 'ok');
  }catch(e){
    toast('Gagal ekspor. Pastikan koneksi internet aktif untuk memuat pustaka ekspor.', 'err');
  }
}

function openGuruModal(id){

  back.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-head"><h3>${g?'Ubah Data Guru':'Tambah Guru'}</h3><button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">&times;</button></div>
      <div class="field"><label>Nama Lengkap</label><input type="text" id="m_nama" value="${g?esc(g.nama):''}" placeholder="Nama guru"></div>
      <div class="field"><label>NIP</label><input type="text" id="m_nip" value="${g?esc(g.nip):''}" placeholder="Nomor Induk Pegawai"></div>
      <div class="field">
        <label>Jenis Kelamin</label>
        <div class="seg">
          <button type="button" id="m_jk_L" class="${(!g||g.jk==='L')?'active':''}" onclick="mJkPick('L')">Laki-laki</button>
          <button type="button" id="m_jk_P" class="${(g&&g.jk==='P')?'active':''}" onclick="mJkPick('P')">Perempuan</button>
        </div>
        <input type="hidden" id="m_jk" value="${g?g.jk:'L'}">
      </div>
      <div class="field"><label>NUPTK</label><input type="text" id="m_nuptk" value="${g?esc(g.nuptk):''}" placeholder="Nomor Unik Pendidik dan Tenaga Kependidikan"></div>

function mJkPick(v){
  document.getElementById('m_jk').value=v;
  document.getElementById('m_jk_L').classList.toggle('active', v==='L');
  document.getElementById('m_jk_P').classList.toggle('active', v==='P');
}
function simpanGuru(id){
  const nama = document.getElementById('m_nama').value.trim();
  const nip = document.getElementById('m_nip').value.trim();
  const jk = document.getElementById('m_jk').value;
  const nuptk = document.getElementById('m_nuptk').value.trim();
  if(!nama){ toast('Nama guru wajib diisi.','err'); return; }
  if(id){
    const g = guruById(id);
    Object.assign(g, {nama,nip,jk,nuptk, synced:false});
  } else {
    DB.guru.push({id:uid(), nama, nip, jk, nuptk, synced:false, deleted:false});
  }
  saveDB();
  document.querySelector('.modal-backdrop')?.remove();
  renderAdmin();
  toast('Data guru tersimpan.','ok');
}
function hapusGuru(id){
  if(!confirm('Hapus data guru ini? Riwayat absensinya akan tetap tersimpan.')) return;
  const g = guruById(id);
  g.deleted = true; g.synced=false;
  saveDB(); renderAdmin();
  toast('Guru dihapus dari daftar aktif.');
}

/* ============================================================
   SYNC / PENGATURAN
============================================================ */
function renderSync(){
  const main = document.getElementById('main');
  const p = pendingCount();
  main.innerHTML = `
    <div class="card">
      <div class="section-label">Status Sinkronisasi</div>
      <div class="chip-row" style="margin-bottom:8px;">
        <span class="badge ${p>0?'b-pending':'b-sync'}">${p} data menunggu</span>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);">Sinkron terakhir: ${DB.config.lastSync ? new Date(DB.config.lastSync).toLocaleString('id-ID') : 'Belum pernah'}</div>
    </div>
    <div class="card">
      <div class="field"><label>Alamat Web App Google Apps Script</label>
        <input type="url" id="s_url" value="${esc(DB.config.sheetUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn btn-outline" style="margin-bottom:8px;" onclick="simpanUrl()">Simpan Alamat</button>
      <button class="btn btn-gold" onclick="doSync()">🔄 Sinkronkan Sekarang</button>
    </div>
    <div class="card">
      <div class="section-label">Keamanan</div>
      <button class="btn btn-ghost" onclick="openGantiPassword()">Ganti Password</button>
    </div>
    <div class="card">
      <div class="section-label">Cadangan Data</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="backupData()">Ekspor Cadangan</button>
        <button class="btn btn-outline" onclick="document.getElementById('restoreFile').click()">Impor Cadangan</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json" class="hidden" onchange="restoreData(event)">
    </div>
    <div class="card">
      <div class="section-label">Tentang</div>
      <div style="font-size:12px;color:var(--ink-soft);line-height:1.6;">
        Absensi Guru — SMP Kristen Basaan<br>
        Versi 1.0 · Data tersimpan aman di perangkat ini dan disinkron ke Google Spreadsheet sekolah.
      </div>
      <button class="btn btn-danger" style="margin-top:10px;" onclick="doLogout()">Keluar</button>
    </div>
  `;
}
function simpanUrl(){
  DB.config.sheetUrl = document.getElementById('s_url').value.trim();
  saveDB();
  toast('Alamat sinkron disimpan.','ok');
  updateSyncPill();
}
async function doSync(){
  if(!DB.config.sheetUrl){ toast('Isi alamat Web App terlebih dahulu.','err'); return; }
  const guruBaru = DB.guru.filter(g=>!g.synced);
  const absensiBaru = DB.absensi.filter(a=>!a.synced);
  if(guruBaru.length===0 && absensiBaru.length===0){
    toast('Mengambil data terbaru…');
  } else {
    toast('Mengirim '+(guruBaru.length+absensiBaru.length)+' data…');
  }
  try{
    const payload = {
      password: DB.config.password,
      guru: guruBaru.map(g=>({id:g.id, nama:g.nama, nip:g.nip, jk:g.jk, nuptk:g.nuptk, deleted:!!g.deleted})),
      absensi: absensiBaru.map(a=>({id:a.id, guruId:a.guruId, tanggal:a.tanggal, jenis:a.jenis, status:a.status, ketDetail:a.ketDetail, ketBebas:a.ketBebas}))
    };
    const res = await fetch(DB.config.sheetUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.ok){ toast(data.message||'Sinkron gagal.','err'); return; }
    guruBaru.forEach(g=>g.synced=true);
    absensiBaru.forEach(a=>a.synced=true);
    if(Array.isArray(data.guru)){
      data.guru.forEach(sg=>{
        if(!DB.guru.some(g=>g.id===sg.id)){
          DB.guru.push({id:sg.id, nama:sg.nama, nip:sg.nip||'', jk:sg.jk||'L', nuptk:sg.nuptk||'', synced:true, deleted:false});
        }
      });
    }
    DB.config.lastSync = new Date().toISOString();
    saveDB();
    toast('Sinkron berhasil.','ok');
    renderSync();
  }catch(e){
    toast('Gagal terhubung. Periksa koneksi internet.', 'err');
  }
}
function openGantiPassword(){
  const back = document.createElement('div');
  back.className = 'modal-backdrop center';
  back.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-head"><h3>Ganti Password</h3><button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">&times;</button></div>
      <div class="field"><label>Password Lama</label><input type="password" id="p_old"></div>
      <div class="field"><label>Password Baru</label><input type="password" id="p_new"></div>
      <div class="field"><label>Ulangi Password Baru</label><input type="password" id="p_new2"></div>
      <button class="btn btn-primary" onclick="gantiPassword()">Simpan Password</button>
    </div>`;
  document.body.appendChild(back);
}
function gantiPassword(){
  const old = document.getElementById('p_old').value;
  const n1 = document.getElementById('p_new').value;
  const n2 = document.getElementById('p_new2').value;
  if(old!==DB.config.password){ toast('Password lama salah.','err'); return; }
  if(n1.length<4){ toast('Password baru minimal 4 karakter.','err'); return; }
  if(n1!==n2){ toast('Konfirmasi password tidak sama.','err'); return; }
  DB.config.password = n1;
  saveDB();
  document.querySelector('.modal-backdrop')?.remove();
  toast('Password berhasil diubah.','ok');
}
function backupData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'cadangan-absensi-'+todayStr()+'.json';
  link.click();
  toast('Cadangan diunduh.','ok');
}
function restoreData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Memulihkan cadangan akan mengganti seluruh data saat ini. Lanjutkan?')) return;
      DB = Object.assign(defaultDB(), data);
      saveDB();
      toast('Data berhasil dipulihkan.','ok');
      renderSync();
    }catch(e){ toast('File cadangan tidak valid.','err'); }
  };
  reader.readAsText(file);
}
function doLogout(){
  sessionStorage.removeItem('ag_authed');
  location.reload();
}

(function init(){
  renderGate();
  if(DB.config.setupDone && sessionStorage.getItem('ag_authed')==='1'){

})();
