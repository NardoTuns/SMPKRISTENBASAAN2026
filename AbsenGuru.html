<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' about: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Absensi Guru — SMP Kristen Basaan</title>
<meta name="theme-color" content="#16243E">
<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --navy:#16243E; --navy-2:#22385C; --navy-3:#0E1830;
  --gold:#C79A3E; --gold-2:#E4C776; --gold-ink:#7A5A16;
  --bg:#F2F4F8; --white:#FFFFFF; --surface-2:#F7F8FB;
  --ink:#18202E; --ink-soft:#5A6474; --ink-faint:#8B94A3;
  --border:#E3E7EE; --border-2:#D9DEE7;
  --success:#23775A; --success-bg:#E3F3EC;
  --warning:#B8721A; --warning-bg:#FCEFDC;
  --info:#2A67A0; --info-bg:#E3EEF8;
  --danger:#B23535; --danger-bg:#FBE6E6;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --serif: Georgia, 'Times New Roman', Cambria, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --nav-h:64px;
}
body.gelap{
  --bg:#10151E; --white:#19202B; --surface-2:#1F2733;
  --ink:#E8EDF4; --ink-soft:#A1ACBC; --ink-faint:#768296;
  --border:#29323F; --border-2:#313B4A;
  --success-bg:#153128; --warning-bg:#33261250; --info-bg:#132A3E; --danger-bg:#361C1C;
  --gold-ink:#E4C776;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:14.5px;line-height:1.45;}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:700;}
button,input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
a{color:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ============================================================
   SHELL
============================================================ */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.topbar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:30;}
.topbar-in{max-width:880px;margin:0 auto;}
.topbar-row{display:flex;align-items:center;gap:10px;}
.crest{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--navy-3);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex-shrink:0;}
.topbar-title{font-family:var(--serif);font-size:16px;line-height:1.2;font-weight:700;}
.topbar-sub{font-size:11.5px;color:#BCC6D8;margin-top:1px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.sync-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);padding:6px 10px;border-radius:20px;font-size:11.5px;color:#EDEFF3;cursor:pointer;}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#63C48A;}
.sync-pill.pending .dot{background:var(--gold-2);}
.sync-pill.off .dot{background:#9AA4B5;}
.sync-pill.busy .dot{background:var(--gold-2);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.top-icon{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#EDEFF3;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.top-icon svg{width:17px;height:17px;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;gap:10px;}
.view-title{font-size:21px;font-family:var(--serif);font-weight:700;}
.view-caption{font-size:12px;color:#BCC6D8;text-align:right;}

main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 30px);}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--border-2);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bottomnav-in{display:flex;width:100%;max-width:560px;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-soft);padding:5px 2px;border-radius:10px;font-size:11px;cursor:pointer;font-weight:600;}
.navbtn svg{width:21px;height:21px;}
.navicon{width:44px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:13px;}
.navbtn.active{color:var(--navy);}
.navbtn.active .navicon{background:#E6EAF2;}
body.gelap .navbtn.active{color:var(--gold-2);}
body.gelap .navbtn.active .navicon{background:var(--surface-2);}

@media (min-width:980px){
  #app{padding-left:96px;}
  .bottomnav{top:0;bottom:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--border-2);padding:92px 8px 16px;}
  .bottomnav-in{flex-direction:column;gap:6px;}
  .navbtn{flex:none;padding:8px 2px;}
  main{padding-bottom:40px;}
  .toast-wrap{bottom:24px !important;}
}

/* ============================================================
   COMPONENTS
============================================================ */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-m);padding:14px;margin-bottom:12px;}
.card-flush{padding:0;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 9px;}
.h-sec{font-size:13px;font-weight:700;color:var(--ink);margin:0;}
.h-sec small{font-weight:500;color:var(--ink-soft);}
.muted{color:var(--ink-soft);font-size:12.5px;}
.faint{color:var(--ink-faint);font-size:12px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:420px){.grid-4{grid-template-columns:1fr 1fr;}}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r-m);padding:12px;}
.stat .num{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;}
.stat .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.stat.green .num{color:var(--success);}
.stat.gold .num{color:var(--gold-ink);}

.tally{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.tally div{border-radius:10px;padding:9px 4px;text-align:center;background:var(--surface-2);border:1px solid var(--border);}
.tally b{display:block;font-size:18px;font-family:var(--serif);}
.tally span{font-size:11px;color:var(--ink-soft);}
.tally .t-h b{color:var(--success);} .tally .t-s b{color:var(--warning);} .tally .t-i b{color:var(--info);} .tally .t-a b{color:var(--danger);} .tally .t-b b{color:var(--ink-faint);}

.progress{height:10px;border-radius:6px;background:var(--border);overflow:hidden;display:flex;}
.progress i{display:block;height:100%;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:var(--r-s);border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;line-height:1.15;width:100%;text-decoration:none;}
.btn svg{width:17px;height:17px;flex-shrink:0;}
.btn-primary{background:var(--navy);color:#fff;}
body.gelap .btn-primary{background:#2C4570;}
.btn-gold{background:var(--gold);color:var(--navy-3);}
.btn-outline{background:var(--white);color:var(--ink);border-color:var(--border-2);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border-2);}
.btn-danger{background:var(--white);color:var(--danger);border-color:var(--danger);}
.btn-danger-solid{background:var(--danger);color:#fff;}
.btn-sm{width:auto;padding:7px 12px;font-size:12.5px;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.action{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r-m);border:1px solid var(--border);background:var(--white);cursor:pointer;text-align:left;width:100%;color:var(--ink);}
.action .ai{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-2);color:var(--navy);}
body.gelap .action .ai{color:var(--gold-2);}
.action .ai svg{width:20px;height:20px;}
.action .at{display:block;min-width:0;}
.action b{display:block;font-size:14px;color:var(--ink);}
.action small{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px;}
.action.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.action.primary b{color:#fff;} .action.primary small{color:#C4CDDD;}
.action.primary .ai{background:var(--gold);color:var(--navy-3);}

.field{margin-bottom:12px;}
.field label,.lbl-f{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.inp,.field input[type=text],.field input[type=password],.field input[type=date],.field input[type=time],.field input[type=month],.field select,.field textarea,.field input[type=url],.field input[type=number],.field input[type=search]{
  width:100%;padding:10px 11px;border:1px solid var(--border-2);border-radius:var(--r-s);background:var(--white);font-size:15px;color:var(--ink);min-height:42px;}
.field textarea{resize:vertical;min-height:64px;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:44px !important;}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:none;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.pw-eye svg{width:18px;height:18px;}

.seg{display:flex;border:1px solid var(--border-2);border-radius:var(--r-s);overflow:hidden;}
.seg button{flex:1;padding:10px 6px;border:none;background:var(--white);color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;border-right:1px solid var(--border-2);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--navy);color:#fff;}

.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:380px){.status-grid{grid-template-columns:1fr 1fr;}}
.status-btn{padding:12px 6px;border-radius:var(--r-s);border:1.5px solid var(--border-2);background:var(--white);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px;justify-content:center;}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
[data-st="Hadir"] .status-dot{background:var(--success);} [data-st="Sakit"] .status-dot{background:var(--warning);}
[data-st="Izin"] .status-dot{background:var(--info);} [data-st="Alpa"] .status-dot{background:var(--danger);}
.status-btn.active[data-st="Hadir"]{background:var(--success-bg);border-color:var(--success);color:var(--success);}
.status-btn.active[data-st="Sakit"]{background:var(--warning-bg);border-color:var(--warning);color:var(--warning);}
.status-btn.active[data-st="Izin"]{background:var(--info-bg);border-color:var(--info);color:var(--info);}
.status-btn.active[data-st="Alpa"]{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-hadir{background:var(--success-bg);color:var(--success);}
.b-sakit{background:var(--warning-bg);color:var(--warning);}
.b-izin{background:var(--info-bg);color:var(--info);}
.b-alpa{background:var(--danger-bg);color:var(--danger);}
.b-sync{background:var(--info-bg);color:var(--info);}
.b-pending{background:var(--warning-bg);color:var(--warning);}
.b-belum{background:var(--border);color:var(--ink-soft);}
.b-libur{background:#EDE7F6;color:#5B3F8C;}
body.gelap .b-libur{background:#2A2238;color:#C8B5EA;}

.list-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--border);background:var(--white);}
.list-item.tap{cursor:pointer;}
.list-item.tap:hover{background:var(--surface-2);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;font-family:var(--serif);}
.avatar.soft{background:var(--border);color:var(--ink-soft);}
.list-main{flex:1;min-width:0;}
.list-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;}
.list-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.list-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.times{display:flex;gap:10px;font-size:12px;color:var(--ink-soft);margin-top:2px;flex-wrap:wrap;}
.times b{color:var(--ink);font-weight:600;}
.telat{color:var(--warning);font-weight:700;}

.empty{text-align:center;padding:30px 16px;color:var(--ink-soft);}
.empty .t{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:4px;}
.empty .d{font-size:12.5px;margin-bottom:10px;}

.tabs2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tabs2::-webkit-scrollbar{display:none;}
.tabs2 button{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border-2);background:var(--white);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.tabs2 button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 11px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border-2);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border-2);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;flex-shrink:0;padding:0;font-size:18px;}
.iconbtn svg{width:16px;height:16px;}

.search-box{position:relative;}
.search-box input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border-2);border-radius:22px;background:var(--white);font-size:14px;color:var(--ink);min-height:42px;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);}

.date-nav{display:flex;align-items:center;gap:8px;}
.date-nav input{flex:1;}

.note{border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;margin-bottom:12px;background:var(--info-bg);color:var(--info);display:flex;gap:9px;align-items:flex-start;}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.note.warn{background:var(--warning-bg);color:var(--warning);}
.note.danger{background:var(--danger-bg);color:var(--danger);}
.note.ok{background:var(--success-bg);color:var(--success);}
.note .note-act{margin-left:auto;flex-shrink:0;}

.divider{height:1px;background:var(--border);margin:12px 0;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(14,24,48,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s;}
.modal-backdrop.center{align-items:center;padding:16px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--white);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out;}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.modal-backdrop.center .modal-sheet{border-radius:18px;max-width:440px;}
@media (min-width:640px){.modal-backdrop{align-items:center;padding:16px;}.modal-sheet{border-radius:18px;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.modal-head h3{font-size:18px;}
.modal-close{background:none;border:none;font-size:24px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}

/* toast */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;z-index:200;pointer-events:none;gap:6px;}
.toast{background:var(--navy-3);color:#fff;padding:10px 16px;border-radius:24px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:92%;display:flex;align-items:center;gap:12px;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
.toast button{pointer-events:auto;background:none;border:none;color:var(--gold-2);font-weight:700;font-size:13px;cursor:pointer;padding:2px 0;}

/* table */
.tbl-wrap{overflow-x:auto;}
table.rpt{width:100%;border-collapse:collapse;font-size:12.5px;}
table.rpt th,table.rpt td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;}
table.rpt th{background:var(--surface-2);font-size:11.5px;color:var(--ink-soft);font-weight:700;}
table.rpt td.n,table.rpt th.n{text-align:center;}

/* gate */
.gate-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);padding:26px 18px;color:#fff;}
.gate-card{background:var(--white);color:var(--ink);border-radius:20px;padding:26px 20px 20px;width:100%;max-width:390px;}
.gate-crest{width:62px;height:62px;border-radius:16px;background:var(--gold);color:var(--navy-3);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:24px;margin:0 auto 14px;}
.gate-title{text-align:center;font-size:20px;margin-bottom:3px;font-family:var(--serif);font-weight:700;}
.gate-sub{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
.gate-foot{margin-top:16px;font-size:11.5px;color:#9FAAC0;text-align:center;max-width:360px;}
.linkbtn{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:12.5px;cursor:pointer;padding:6px;}

/* massal */
.massal-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--border);}
.massal-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.massal-pick{display:flex;gap:5px;flex-shrink:0;}
.mp{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border-2);background:var(--white);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:0;}
.mp[data-st="Hadir"].on{background:var(--success);border-color:var(--success);color:#fff;}
.mp[data-st="Sakit"].on{background:var(--warning);border-color:var(--warning);color:#fff;}
.mp[data-st="Izin"].on{background:var(--info);border-color:var(--info);color:#fff;}
.mp[data-st="Alpa"].on{background:var(--danger);border-color:var(--danger);color:#fff;}
.sticky-save{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));z-index:5;}
@media (min-width:980px){.sticky-save{bottom:12px;}}

/* kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);padding:3px 0;}
.cal-cell{aspect-ratio:1/1;border-radius:8px;border:1px solid var(--border);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;cursor:pointer;color:var(--ink);padding:0;}
.cal-cell.kosong{border:none;background:transparent;cursor:default;}
.cal-cell.libur{background:var(--surface-2);color:var(--ink-faint);}
.cal-cell.merah{color:var(--danger);}
.cal-cell.hariini{border-color:var(--gold);border-width:2px;}
.cal-dots{display:flex;gap:2px;height:5px;align-items:center;}
.cal-dots i{width:5px;height:5px;border-radius:50%;display:block;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}

.legend i{width:8px;height:8px;border-radius:50%;}

.rank-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);}
.rank-no{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.rank-no.top{background:var(--gold);border-color:var(--gold);color:var(--navy-3);}
.rank-bar{height:6px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:6px;}
.rank-bar i{display:block;height:100%;background:var(--success);}

.bar-wrap{display:flex;align-items:flex-end;gap:10px;height:130px;padding:10px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-fill{width:100%;max-width:38px;border-radius:6px 6px 0 0;min-height:3px;}
.bar-val{font-size:11.5px;font-weight:700;margin-bottom:3px;}
.bar-lbl{font-size:11px;color:var(--ink-soft);margin-top:6px;text-align:center;}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border);}
.set-row:first-of-type{border-top:none;}
.set-row .sl{font-size:14px;font-weight:600;}
.set-row .sd{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.sw{width:46px;height:27px;border-radius:20px;background:var(--border-2);border:none;position:relative;cursor:pointer;flex-shrink:0;padding:0;}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.sw.on{background:var(--success);}
.sw.on i{left:22px;}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer;font-size:13.5px;}
.check-row input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--navy);flex-shrink:0;}
.check-row small{display:block;color:var(--ink-soft);font-size:11.5px;}

.preview-box{background:var(--surface-2);border:1px dashed var(--border-2);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;margin:4px 0 12px;}
.preview-box b{font-family:var(--serif);font-size:16px;}

.log-row{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--border);font-size:12.5px;}
.log-row time{color:var(--ink-faint);font-size:11.5px;white-space:nowrap;min-width:92px;}
.log-row.warn b{color:var(--danger);}

.kbd-list{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0;padding-left:18px;}

#exportRoot{position:fixed;left:-9999px;top:0;width:794px;background:#fff;color:#1D2430;padding:36px 40px;font-family:Arial,Helvetica,sans-serif;}

<script>
'use strict';
/* ============================================================
   KONSTANTA & UTILITAS
   absensi: {id, guruId, tanggal, jam, jenis, status, ketDetail, ketBebas, deleted, synced, rev}
   guru   : {id, nama, nip, jk, nuptk, mapel, deleted, synced, rev}
============================================================ */
const APP_VERSI = '3.0';
const DBKEY = 'agdb_v2';
const DBKEY_LAMA = 'agdb_v1';
const LOGKEY = 'agdb_log';
const LOCKKEY = 'agdb_lockout';
const SESIKEY = 'ag_sesi';
const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbymqczAaBU71v8jviuUdnyVRngx3xSSLbSt4lIk4VtZQRoXhdCuJIIh3bRpscWtF66L/exec';
const URL_POLA = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/(exec|dev)$/;
const STATUS = ['Hadir','Sakit','Izin','Alpa'];
const KET_BAKU = ['Terlambat','Tugas Luar','Pulang Cepat','Dinas Luar','Cuti'];
const MAKS_HARI_RENTANG = 92;

const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const WARNA = {Hadir:'#23775A',Sakit:'#B8721A',Izin:'#2A67A0',Alpa:'#B23535',Belum:'#A9B1BE'};
const BADGE = {Hadir:'b-hadir',Sakit:'b-sakit',Izin:'b-izin',Alpa:'b-alpa'};

const IKON = {
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  hapus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15l3 3 3-3"/></svg>',
  cetak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  kal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 01-13.5 7.8L3 21l1.2-4.4A9 9 0 1121 12z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1c-1-.5-1.5-1-2-2l1-1-1-2z"/></svg>',
  grup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
  satu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  lap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M9 19v-7M14 19V9M19 19v-4"/></svg>',
  sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-2.6 6.3"/><path d="M21 5v6h-6"/></svg>',
  mata:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  csv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>'
};

function uid(){
  const r = new Uint8Array(5); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(r) : r.forEach((_,i)=>r[i]=Math.random()*256|0);
  return Date.now().toString(36)+Array.from(r,b=>b.toString(36).padStart(2,'0')).join('').slice(0,7);
}
/* ID hanya boleh berisi huruf, angka, _ dan - supaya aman disisipkan ke atribut HTML */
function safeId(v){ const s = String(v==null?'':v).replace(/[^A-Za-z0-9_\-]/g,'').slice(0,64); return s; }
function teks(v, maks){ return String(v==null?'':v).replace(/[\u0000-\u001F\u007F]/g,' ').trim().slice(0, maks||200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"'`]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c])); }
function isoDari(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return isoDari(new Date()); }
function isISO(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||'')); }
function tglObj(iso){ return new Date(iso+'T00:00:00'); }
function tambahHari(iso, n){ const d = tglObj(iso); d.setDate(d.getDate()+n); return isoDari(d); }
function nowTime(){ const d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function menit(jam){ const m = /^(\d{1,2}):(\d{2})/.exec(jam||''); return m ? (+m[1])*60+(+m[2]) : null; }
function fmtDateID(iso){ if(!isISO(iso)) return '-'; const d = tglObj(iso); return `${NAMA_HARI[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateLong(iso){ if(!isISO(iso)) return '-'; const d = tglObj(iso); return `${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(iso){ if(!isISO(iso)) return '-'; const d = tglObj(iso); return `${d.getDate()} ${BULAN_SINGKAT[d.getMonth()]} ${d.getFullYear()}`; }
function selisihHari(a,b){ return Math.round((tglObj(b)-tglObj(a))/86400000); }
function initials(name){ return (name||'?').trim().split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0])).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?'; }

/* Tanggal dari spreadsheet bisa datang sebagai "2026-09-28", "2026-09-27T16:00:00.000Z" (UTC),
   atau "28/09/2026". Semuanya dijadikan tanggal LOKAL agar tidak bergeser sehari (WITA = UTC+8). */
function normTanggal(v){
  const s = String(v==null?'':v).trim();
  if(isISO(s)) return s;
  let m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){ const d = new Date(s); if(!isNaN(d)) return isoDari(d); }
  const d = new Date(s); if(s && !isNaN(d)) return isoDari(d);
  return '';
}
function normJam(v){
  const s = String(v==null?'':v).trim();
  let m = /^(\d{1,2})[:.](\d{2})/.exec(s);
  if(m && !/^\d{4}-/.test(s)) return m[1].padStart(2,'0')+':'+m[2];
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){ const d = new Date(s); if(!isNaN(d)) return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  return '';
}
function normStatus(v){ const s = String(v||'').trim().toLowerCase(); return STATUS.find(x=>x.toLowerCase()===s) || (s.startsWith('alp')?'Alpa':'Hadir'); }
function normBool(v){ return v===true || v==='TRUE' || v==='true' || v===1 || v==='1'; }

/* ============================================================
   PENYIMPANAN
============================================================ */
const defaultConfig = () => ({
  setupDone:false, sheetUrl:DEFAULT_SHEET_URL, lastSync:null,
  passRec:null, passVerified:false,
  schoolName:'SMP KRISTEN BASAAN',
  dinas:'DINAS PENDIDIKAN DAERAH KABUPATEN MINAHASA TENGGARA',
  alamat:'Desa Basaan, Kecamatan Ratatotok, Kabupaten Minahasa Tenggara, Sulawesi Utara',
  kota:'Ratatotok', kepsek:'', nipKepsek:'',
  tema:'terang', autoSync:true,
  hitungSabtu:false, jamMasuk:'07:15', jamPulang:'13:30', tandaiTelat:true,
  libur:[], autoLockMin:10, ttdTanggal:'laporan'
});
const defaultDB = () => ({config:defaultConfig(), guru:[], absensi:[]});

function bersihkanGuru(g){
  const id = safeId(g && g.id); if(!id) return null;
  return { id, nama:teks(g.nama,120), nip:teks(g.nip,30), jk:g.jk==='P'?'P':'L', nuptk:teks(g.nuptk,30), mapel:teks(g.mapel,80),
    deleted:normBool(g.deleted), synced:g.synced!==false && !!g.synced, rev:Number(g.rev||0)||0 };
}
function bersihkanAbsen(a){
  const id = safeId(a && a.id), guruId = safeId(a && a.guruId), tanggal = normTanggal(a && a.tanggal);
  if(!id || !guruId || !tanggal) return null;
  return { id, guruId, tanggal, jam:normJam(a.jam), jenis:a.jenis==='Pulang'?'Pulang':'Datang', status:normStatus(a.status),
    ketDetail:teks(a.ketDetail,160), ketBebas:teks(a.ketBebas,300), deleted:normBool(a.deleted),
    synced:!!a.synced, rev:Number(a.rev||a.ts||0)||0 };
}
function bersihkanLibur(list){
  return (Array.isArray(list)?list:[]).map(l=>({tgl:normTanggal(l&&l.tgl), ket:teks(l&&l.ket,80)})).filter(l=>l.tgl)
    .sort((a,b)=>a.tgl.localeCompare(b.tgl));
}

function loadDB(){
  try{
    let raw = localStorage.getItem(DBKEY) || localStorage.getItem(DBKEY_LAMA);
    const d = raw ? JSON.parse(raw) : {};
    const db = defaultDB();
    Object.assign(db.config, d.config||{});
    if(!db.config.sheetUrl) db.config.sheetUrl = DEFAULT_SHEET_URL;
    db.config.libur = bersihkanLibur(db.config.libur);
    db.guru = (d.guru||[]).map(bersihkanGuru).filter(Boolean);
    db.absensi = (d.absensi||[]).map(bersihkanAbsen).filter(Boolean);
    return db;
  }catch(e){ return defaultDB(); }
}
function saveDB(){
  try{ localStorage.setItem(DBKEY, JSON.stringify(DB)); }
  catch(e){ toast('Penyimpanan perangkat penuh. Ekspor cadangan lalu hapus data lama.','err'); }
}
let DB = loadDB();

/* ---------- Log aktivitas (disimpan terpisah, maks 400 baris) ---------- */
function catatLog(aksi, detail, level){
  try{
    const log = JSON.parse(localStorage.getItem(LOGKEY)||'[]');
    log.unshift({t:new Date().toISOString(), a:teks(aksi,60), d:teks(detail,200), l:level||''});
    localStorage.setItem(LOGKEY, JSON.stringify(log.slice(0,400)));
  }catch(e){}
}
function bacaLog(){ try{ return JSON.parse(localStorage.getItem(LOGKEY)||'[]'); }catch(e){ return []; } }

/* ---------- Query data ---------- */
function pendingGuru(){ return DB.guru.filter(g=>!g.synced); }
function pendingAbsensi(){ return DB.absensi.filter(a=>!a.synced); }
function pendingCount(){ return pendingGuru().length + pendingAbsensi().length; }
function activeGuru(){ return DB.guru.filter(g=>!g.deleted); }
function activeAbsensi(){ return DB.absensi.filter(a=>!a.deleted); }
function guruById(id){ return DB.guru.find(g=>g.id===id); }
function namaGuru(id){ const g=guruById(id); return g?g.nama:'(guru dihapus)'; }
function absenById(id){ return DB.absensi.find(a=>a.id===id); }
function absensiTanggal(tgl){ return activeAbsensi().filter(a=>a.tanggal===tgl); }
function urutNama(list){ return list.slice().sort((a,b)=>(a.nama||'').localeCompare(b.nama||'','id')); }
function liburPada(tgl){ const l = DB.config.libur.find(x=>x.tgl===tgl); return l ? (l.ket||'Hari libur') : ''; }
function hariSekolah(tgl){
  const h = tglObj(tgl).getDay();
  if(h===0) return false;
  if(h===6 && !DB.config.hitungSabtu) return false;
  return !liburPada(tgl);
}
function statusCounts(list){ const c = {Hadir:0,Sakit:0,Izin:0,Alpa:0}; list.forEach(a=>{ if(c[a.status]!==undefined) c[a.status]++; }); return c; }

/* ============================================================
   KEAMANAN: HASH PASSWORD, SESI, PEMBATASAN PERCOBAAN
============================================================ */
/* SHA-256 cadangan (dipakai jika crypto.subtle tidak tersedia, mis. WebView lama) */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const l = bytes.length*8; bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>3?0:(l>>> (i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(x,n)=>(x>>>n)|(x<<(32-n)); const W=new Array(64);
  for(let o=0;o<bytes.length;o+=64){
    for(let i=0;i<16;i++) W[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){ const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)|0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
const hex = b => Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const unhex = s => new Uint8Array((s.match(/../g)||[]).map(h=>parseInt(h,16)));
function bisaPBKDF2(){ return !!(window.crypto && crypto.subtle && crypto.subtle.importKey && window.isSecureContext!==false); }

async function hitungHash(pass, alg, salt, iter){
  if(alg==='pbkdf2'){
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:unhex(salt), iterations:iter}, key, 256);
    return hex(new Uint8Array(bits));
  }
  let h = sha256hex(salt+'|'+pass);
  for(let i=0;i<iter;i++) h = sha256hex(h+salt);
  return h;
}
async function buatPassRec(pass){
  const s = new Uint8Array(16); crypto.getRandomValues(s);
  const salt = hex(s);
  const alg = bisaPBKDF2() ? 'pbkdf2' : 'sha256i';
  const iter = alg==='pbkdf2' ? 150000 : 3000;
  return {alg, salt, iter, hash: await hitungHash(pass, alg, salt, iter)};
}
function samaWaktuKonstan(a,b){ if(a.length!==b.length) return false; let x=0; for(let i=0;i<a.length;i++) x|=a.charCodeAt(i)^b.charCodeAt(i); return x===0; }
async function cocokPassword(pass){
  const r = DB.config.passRec;
  if(!r || !pass) return false;
  if(r.alg==='pbkdf2' && !bisaPBKDF2()) return false;
  try{ return samaWaktuKonstan(await hitungHash(pass, r.alg, r.salt, r.iter), r.hash); }catch(e){ return false; }
}
/* Versi lama menyimpan password polos. Ubah menjadi hash sekali saja, lalu hapus teks polosnya. */
async function migrasiPassword(){
  if(DB.config.password && !DB.config.passRec){
    DB.config.passRec = await buatPassRec(DB.config.password);
    DB.config.passVerified = true;
  }
  if('password' in DB.config){ delete DB.config.password; saveDB(); catatLog('Keamanan','Password lama diubah menjadi hash terenkripsi'); }
}

/* Sesi: password asli hanya ada di memori & sessionStorage (terhapus saat aplikasi ditutup). */
const SESI = {pass:null};
function sandi(){ return SESI.pass; }
function simpanSesi(pass){
  SESI.pass = pass;
  try{ sessionStorage.setItem(SESIKEY, btoa(unescape(encodeURIComponent(JSON.stringify({p:pass, t:Date.now()}))))); }catch(e){}
}
function hapusSesi(){ SESI.pass = null; try{ sessionStorage.removeItem(SESIKEY); sessionStorage.removeItem('ag_authed'); }catch(e){} }
async function pulihkanSesi(){
  try{
    const raw = sessionStorage.getItem(SESIKEY); if(!raw) return false;
    const s = JSON.parse(decodeURIComponent(escape(atob(raw))));
    const batas = (DB.config.autoLockMin||0)*60000;
    if(batas && Date.now()-(s.t||0) > batas) { hapusSesi(); return false; }
    if(await cocokPassword(s.p)){ SESI.pass = s.p; return true; }
  }catch(e){}
  hapusSesi(); return false;
}

/* Pembatasan percobaan: 5x salah → jeda 30 dtk, lalu berlipat hingga 15 menit. */
function bacaLockout(){ try{ return JSON.parse(localStorage.getItem(LOCKKEY)||'{"gagal":0,"sampai":0}'); }catch(e){ return {gagal:0,sampai:0}; } }
function sisaKunci(){ return Math.max(0, bacaLockout().sampai - Date.now()); }
function catatGagal(){
  const l = bacaLockout(); l.gagal++;
  if(l.gagal>=5) l.sampai = Date.now() + Math.min(15*60000, 30000*Math.pow(2, l.gagal-5));
  localStorage.setItem(LOCKKEY, JSON.stringify(l));
  catatLog('Login gagal', `Percobaan ke-${l.gagal}`, 'warn');
  return l;
}
function resetGagal(){ localStorage.setItem(LOCKKEY, JSON.stringify({gagal:0,sampai:0})); }
function fmtDurasi(ms){ const s = Math.ceil(ms/1000); return s>=60 ? `${Math.floor(s/60)} menit ${s%60} detik` : `${s} detik`; }

/* ============================================================
   UI DASAR: toast, modal, konfirmasi, minta password
============================================================ */
function toast(msg, type, aksi){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:'');
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if(aksi){
    const b = document.createElement('button'); b.textContent = aksi.label;
    b.onclick = ()=>{ el.remove(); aksi.fn(); }; el.appendChild(b);
  }
  wrap.appendChild(el);
  while(wrap.children.length>3) wrap.firstChild.remove();
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, aksi?6000:2800);
}
function bukaModal(html, opsi){
  opsi = opsi||{};
  const back = document.createElement('div');
  back.className = 'modal-backdrop'+(opsi.center?' center':'');
  back.innerHTML = `<div class="modal-sheet" role="dialog" aria-modal="true" ${opsi.id?`id="${opsi.id}"`:''}>${html}</div>`;
  back.addEventListener('mousedown', e=>{ if(e.target===back && !opsi.wajib) tutupModal(back); });
  document.body.appendChild(back);
  setTimeout(()=>{ const f = back.querySelector('[autofocus], input:not([type=hidden]):not([type=date]):not([type=time]), select'); if(f && !opsi.tanpaFokus) f.focus(); }, 40);
  return back;
}
function tutupModal(el){
  const b = el ? (el.classList && el.classList.contains('modal-backdrop') ? el : el.closest('.modal-backdrop')) : null;
  (b || [...document.querySelectorAll('.modal-backdrop')].pop())?.remove();
}
function kepalaModal(judul){ return `<div class="modal-head"><h3>${esc(judul)}</h3><button class="modal-close" aria-label="Tutup" onclick="tutupModal(this)">&times;</button></div>`; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const m=[...document.querySelectorAll('.modal-backdrop')].pop(); if(m) m.remove(); } });

function konfirmasi(o){
  return new Promise(res=>{
    const m = bukaModal(`
      ${kepalaModal(o.judul||'Konfirmasi')}
      <div style="font-size:14px;margin-bottom:${o.ketik?'12px':'16px'};">${o.pesan||''}</div>
      ${o.ketik?`<div class="field"><label>Ketik <b>${esc(o.ketik)}</b> untuk melanjutkan</label><input type="text" id="kf_ketik" autocomplete="off" autocapitalize="characters"></div>`:''}
      <div class="btn-row">
        <button class="btn btn-outline" data-v="0">${esc(o.batal||'Batal')}</button>
        <button class="btn ${o.bahaya?'btn-danger-solid':'btn-primary'}" data-v="1">${esc(o.ok||'Lanjutkan')}</button>
      </div>`, {center:true, tanpaFokus:!o.ketik});
    m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      if(b.dataset.v==='1' && o.ketik && (m.querySelector('#kf_ketik').value.trim().toUpperCase()!==o.ketik)){ toast(`Ketik ${o.ketik} dengan benar.`,'err'); return; }
      m.remove(); res(b.dataset.v==='1');
    });
    const obs = new MutationObserver(()=>{ if(!document.body.contains(m)){ obs.disconnect(); res(false); } });
    obs.observe(document.body,{childList:true});
  });
}
function inputSandi(id, ph, ekstra){
  return `<div class="pw-wrap"><input type="password" id="${id}" placeholder="${esc(ph||'Password')}" autocomplete="current-password" ${ekstra||''}>
    <button type="button" class="pw-eye" aria-label="Tampilkan password" onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'">${IKON.mata}</button></div>`;
}
/* Tindakan penting wajib memasukkan ulang password */
function mintaSandi(alasan){
  return new Promise(res=>{
    let selesai = false;
    const m = bukaModal(`
      ${kepalaModal('Konfirmasi password')}
      <div class="note warn">${IKON.warn}<span>${esc(alasan)}</span></div>
      <div class="field">${inputSandi('ms_pass','Password aplikasi','autofocus')}</div>
      <div class="btn-row"><button class="btn btn-outline" id="ms_batal">Batal</button><button class="btn btn-primary" id="ms_ok">Konfirmasi</button></div>`, {center:true});
    const cek = async ()=>{
      const sk = sisaKunci(); if(sk){ toast(`Terlalu banyak percobaan. Tunggu ${fmtDurasi(sk)}.`,'err'); return; }
      const p = m.querySelector('#ms_pass').value;
      if(await cocokPassword(p)){ resetGagal(); selesai=true; m.remove(); res(true); }
      else { catatGagal(); toast('Password salah.','err'); m.querySelector('#ms_pass').select(); }
    };
    m.querySelector('#ms_ok').onclick = cek;
    m.querySelector('#ms_pass').onkeydown = e=>{ if(e.key==='Enter') cek(); };
    m.querySelector('#ms_batal').onclick = ()=>{ m.remove(); };
    const obs = new MutationObserver(()=>{ if(!document.body.contains(m)){ obs.disconnect(); if(!selesai) res(false); } });
    obs.observe(document.body,{childList:true});
  });
}
function terapkanTema(){ document.body.classList.toggle('gelap', DB.config.tema==='gelap'); }

/* ============================================================
   GERBANG: pengaturan awal, masuk, kunci, reset perangkat
============================================================ */
let GATE_TIMER = null;
function renderGate(mode){
  const gate = document.getElementById('gate');
  document.getElementById('app').classList.add('hidden');
  gate.classList.remove('hidden');
  clearInterval(GATE_TIMER);

  if(!DB.config.setupDone){
    gate.innerHTML = `
      <div class="gate-wrap"><div class="gate-card">
        <div class="gate-crest">SKB</div>
        <div class="gate-title">Selamat datang</div>
        <div class="gate-sub">Absensi Guru ${esc(DB.config.schoolName)}</div>
        <div class="note">${IKON.info}<span>Masukkan password spreadsheet sekolah. Aplikasi akan mengambil data guru dan riwayat absensi, lalu tetap bisa dipakai tanpa internet.</span></div>
        <div class="field"><label for="setupPass">Password spreadsheet</label>${inputSandi('setupPass','Password dari admin sekolah','onkeydown="if(event.key===\'Enter\')doInitialSync()"')}</div>
        <div id="gateErr" class="note danger hidden"></div>
        <button class="btn btn-gold" id="btnSetup" style="margin-bottom:8px" onclick="doInitialSync()">Hubungkan &amp; mulai</button>
        <button class="btn btn-ghost" onclick="doSkipSetup()">Mulai tanpa internet dulu</button>
      </div>
      <div class="gate-foot">Password tidak disimpan dalam bentuk asli. Perangkat hanya menyimpan sidik digital (hash) untuk memeriksa login.</div></div>`;
    setTimeout(()=>document.getElementById('setupPass')?.focus(), 50);
    return;
  }

  const terkunci = mode==='kunci' || mode==='otomatis';
  gate.innerHTML = `
    <div class="gate-wrap"><div class="gate-card">
      <div class="gate-crest">SKB</div>
      <div class="gate-title">${terkunci?'Aplikasi terkunci':'Masuk aplikasi'}</div>
      <div class="gate-sub">${mode==='otomatis'?'Terkunci otomatis karena tidak ada aktivitas.':terkunci?'Masukkan password untuk melanjutkan.':esc(DB.config.schoolName)}</div>
      <div class="field"><label for="loginPass">Password</label>${inputSandi('loginPass','Password','onkeydown="if(event.key===\'Enter\')doLogin()"')}</div>
      <div id="gateErr" class="note danger hidden"></div>
      <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">${terkunci?'Buka kunci':'Masuk'}</button>
      <div style="text-align:center;margin-top:10px;"><button class="linkbtn" onclick="lupaPassword()">Lupa password?</button></div>
    </div>
    <div class="gate-foot">${pendingCount()?`${pendingCount()} data menunggu dikirim ke spreadsheet dan tetap aman di perangkat ini.`:''}</div></div>`;
  setTimeout(()=>document.getElementById('loginPass')?.focus(), 50);
  tampilLockout();
}
function tampilErrGate(msg){ const e = document.getElementById('gateErr'); if(!e) return; e.innerHTML = IKON.warn+'<span>'+msg+'</span>'; e.classList.remove('hidden'); }
function tampilLockout(){
  const btn = document.getElementById('btnLogin'); if(!btn) return;
  const upd = ()=>{
    const s = sisaKunci();
    btn.disabled = s>0;
    if(s>0) tampilErrGate(`Terlalu banyak percobaan salah. Coba lagi dalam ${fmtDurasi(s)}.`);
    else { clearInterval(GATE_TIMER); document.getElementById('gateErr')?.classList.add('hidden'); }
  };
  if(sisaKunci()>0){ upd(); GATE_TIMER = setInterval(upd, 1000); }
}

async function doSkipSetup(){
  const pass = document.getElementById('setupPass').value;
  if(pass.length<4){ tampilErrGate('Password minimal 4 karakter.'); return; }
  DB.config.passRec = await buatPassRec(pass);
  DB.config.passVerified = false;
  DB.config.setupDone = true;
  saveDB(); simpanSesi(pass);
  catatLog('Pengaturan awal','Mulai tanpa internet (password belum diverifikasi spreadsheet)');
  toast('Aplikasi siap dipakai. Hubungkan ke spreadsheet dari menu Pengaturan.');
  bootApp();
}
async function doInitialSync(){
  const pass = document.getElementById('setupPass').value;
  const btn = document.getElementById('btnSetup');
  if(!pass){ tampilErrGate('Masukkan password terlebih dahulu.'); return; }
  btn.disabled = true; btn.textContent = 'Menghubungkan…';
  try{
    const data = await apiKirim({action:'pull', password:pass}, DB.config.sheetUrl||DEFAULT_SHEET_URL);
    if(!data.ok){ tampilErrGate(esc(data.message||'Password salah atau spreadsheet menolak.')); return; }
    DB.config.passRec = await buatPassRec(pass);
    DB.config.passVerified = true;
    DB.config.setupDone = true;
    const hasil = gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString();
    saveDB(); simpanSesi(pass); resetGagal();
    catatLog('Pengaturan awal', `${hasil.guru} guru, ${hasil.absensi} absensi dimuat`);
    toast(`Berhasil. ${hasil.guru} guru dan ${hasil.absensi} catatan absensi dimuat.`, 'ok');
    bootApp();
  }catch(e){
    tampilErrGate('Tidak dapat terhubung. Periksa internet, atau pilih "Mulai tanpa internet dulu".');
  }finally{ if(document.body.contains(btn)){ btn.disabled=false; btn.textContent='Hubungkan & mulai'; } }
}
async function doLogin(){
  const input = document.getElementById('loginPass');
  const btn = document.getElementById('btnLogin');
  const pass = input.value;
  if(sisaKunci()>0){ tampilLockout(); return; }
  if(!pass){ tampilErrGate('Masukkan password.'); return; }
  btn.disabled = true;
  let ok = await cocokPassword(pass);
  /* Password mungkin sudah diganti di spreadsheet: periksa ke server bila online */
  if(!ok && navigator.onLine && DB.config.sheetUrl){
    try{
      const d = await apiKirim({action:'pull', password:pass});
      if(d && d.ok){ DB.config.passRec = await buatPassRec(pass); DB.config.passVerified = true; saveDB(); ok = true; catatLog('Keamanan','Password diperbarui mengikuti spreadsheet'); }
    }catch(e){}
  }
  btn.disabled = false;
  if(!ok){
    const l = catatGagal();
    input.value=''; input.focus();
    if(sisaKunci()>0) tampilLockout();
    else tampilErrGate(`Password salah.${l.gagal>=3?` Sisa ${5-l.gagal} percobaan sebelum dikunci sementara.`:''}`);
    return;
  }
  resetGagal(); simpanSesi(pass);
  catatLog('Masuk','Login berhasil');
  bootApp();
}
async function lupaPassword(){
  const m = bukaModal(`
    ${kepalaModal('Lupa password')}
    <p style="font-size:14px;margin-top:0;">Password aplikasi sama dengan password spreadsheet sekolah. Tanyakan ke admin sekolah, lalu masuk dengan password tersebut — aplikasi akan memeriksanya ke spreadsheet (butuh internet).</p>
    <div class="divider"></div>
    <p style="font-size:13px;color:var(--ink-soft);">Jika perangkat ini harus dipakai ulang dari awal, Anda bisa mengatur ulang perangkat. <b>Semua data di perangkat ini dihapus</b>${pendingCount()?`, termasuk <b>${pendingCount()} data yang belum terkirim</b>`:''}. Data di spreadsheet tidak terpengaruh.</p>
    <button class="btn btn-danger" id="btnResetDev">Atur ulang perangkat ini</button>`, {center:true, tanpaFokus:true});
  m.querySelector('#btnResetDev').onclick = async ()=>{
    m.remove();
    if(await konfirmasi({judul:'Atur ulang perangkat', pesan:'Seluruh data guru, absensi, dan pengaturan di perangkat ini akan dihapus permanen.', ok:'Hapus semua', bahaya:true, ketik:'HAPUS'})){
      [DBKEY, DBKEY_LAMA, LOCKKEY].forEach(k=>localStorage.removeItem(k));
      hapusSesi();
      catatLog('Atur ulang perangkat','Semua data lokal dihapus','warn');
      DB = defaultDB(); renderGate();
      toast('Perangkat diatur ulang.','ok');
    }
  };
}

/* ---------- Kunci otomatis saat tidak aktif ---------- */
let AKTIF_TERAKHIR = Date.now(), IDLE_TIMER = null;
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ AKTIF_TERAKHIR = Date.now(); if(SESI.pass) simpanSesiWaktu(); }, {passive:true}));
function simpanSesiWaktu(){ try{ const raw=sessionStorage.getItem(SESIKEY); if(!raw) return; const s=JSON.parse(decodeURIComponent(escape(atob(raw)))); s.t=Date.now(); sessionStorage.setItem(SESIKEY, btoa(unescape(encodeURIComponent(JSON.stringify(s))))); }catch(e){} }
function mulaiIdle(){
  clearInterval(IDLE_TIMER);
  IDLE_TIMER = setInterval(()=>{
    const m = DB.config.autoLockMin||0;
    if(m && SESI.pass && Date.now()-AKTIF_TERAKHIR > m*60000) kunciAplikasi(true);
  }, 15000);
}
function kunciAplikasi(otomatis){
  hapusSesi();
  document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove());
  catatLog('Kunci', otomatis?'Terkunci otomatis':'Dikunci manual');
  renderGate(otomatis?'otomatis':'kunci');
}

/* ============================================================
   MESIN SINKRON — DUA ARAH (kirim + tarik)
============================================================ */
let SYNC_BUSY = false;
async function apiKirim(payload, urlOverride){
  const url = urlOverride || DB.config.sheetUrl;
  if(!url || !URL_POLA.test(url)) throw new Error('Alamat Web App tidak valid');
  const ctrl = window.AbortController ? new AbortController() : null;
  const t = ctrl ? setTimeout(()=>ctrl.abort(), 25000) : null;
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload), redirect:'follow', credentials:'omit', referrerPolicy:'no-referrer', signal:ctrl?ctrl.signal:undefined});
    const isi = await res.text();
    try{ return JSON.parse(isi); }catch(e){ throw new Error('Balasan server tidak valid'); }
  } finally { if(t) clearTimeout(t); }
}

/* Gabungkan data spreadsheet ke perangkat. Catatan lokal yang BELUM tersinkron tidak ditimpa. */
function gabungDataServer(data){
  let masukGuru = 0, masukAbsensi = 0;
  (Array.isArray(data.guru)?data.guru:[]).forEach(sg=>{
    const isi = bersihkanGuru(Object.assign({}, sg, {synced:true, rev:Number(sg&&(sg.rev||sg.updatedAt)||0)}));
    if(!isi) return;
    const lokal = guruById(isi.id);
    if(!lokal){ DB.guru.push(isi); masukGuru++; }
    else if(lokal.synced && isi.rev >= (lokal.rev||0)){ Object.assign(lokal, isi); masukGuru++; }
  });
  (Array.isArray(data.absensi)?data.absensi:[]).forEach(sa=>{
    if(!sa) return;
    const isi = bersihkanAbsen(Object.assign({}, sa, {id:sa.id||uid(), synced:true, rev:Number(sa.rev||sa.updatedAt||0)}));
    if(!isi) return;
    let lokal = absenById(isi.id) || DB.absensi.find(a=>a.guruId===isi.guruId && a.tanggal===isi.tanggal && a.jenis===isi.jenis && !a.deleted);
    if(!lokal){ DB.absensi.push(isi); masukAbsensi++; }
    else if(lokal.synced && isi.rev >= (lokal.rev||0)){ Object.assign(lokal, isi); masukAbsensi++; }
  });
  return {guru:masukGuru, absensi:masukAbsensi};
}
function muatanKirim(){
  return {
    guru: pendingGuru().map(g=>({id:g.id, nama:g.nama, nip:g.nip, jk:g.jk, nuptk:g.nuptk, mapel:g.mapel||'', deleted:!!g.deleted, rev:g.rev||Date.now()})),
    absensi: pendingAbsensi().map(a=>({id:a.id, guruId:a.guruId, tanggal:a.tanggal, jam:a.jam||'', jenis:a.jenis, status:a.status, ketDetail:a.ketDetail||'', ketBebas:a.ketBebas||'', deleted:!!a.deleted, rev:a.rev||Date.now()}))
  };
}
async function doSync(diam){
  if(SYNC_BUSY) return false;
  if(!sandi()){ if(!diam) toast('Sesi berakhir. Masuk ulang untuk sinkron.','err'); return false; }
  if(!DB.config.sheetUrl){ if(!diam) toast('Alamat Web App belum diisi.','err'); return false; }
  SYNC_BUSY = true; updateSyncPill();
  const kirim = muatanKirim();
  const jumlahKirim = kirim.guru.length + kirim.absensi.length;
  if(!diam) toast(jumlahKirim>0 ? `Mengirim ${jumlahKirim} data…` : 'Mengambil data terbaru…');
  try{
    const data = await apiKirim({action:'sync', password:sandi(), guru:kirim.guru, absensi:kirim.absensi});
    if(!data.ok){ if(!diam) toast(data.message||'Sinkron ditolak server.','err'); catatLog('Sinkron ditolak', data.message||'', 'warn'); return false; }
    const idG = new Set(kirim.guru.map(g=>g.id)), idA = new Set(kirim.absensi.map(a=>a.id));
    DB.guru.forEach(g=>{ if(idG.has(g.id)) g.synced = true; });
    DB.absensi.forEach(a=>{ if(idA.has(a.id)) a.synced = true; });
    const hasil = gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString();
    if(!DB.config.passVerified){ DB.config.passVerified = true; }
    saveDB();
    if(jumlahKirim) catatLog('Sinkron', `${jumlahKirim} terkirim, ${hasil.guru+hasil.absensi} masuk`);
    if(!diam){ toast(`Sinkron selesai: ${jumlahKirim} terkirim, ${hasil.guru+hasil.absensi} diperbarui.`, 'ok'); refresh(); }
    return true;
  }catch(e){
    if(!diam) toast('Gagal terhubung. Data tetap aman di perangkat dan dikirim saat online.','err');
    return false;
  }finally{ SYNC_BUSY=false; updateSyncPill(); }
}
async function tarikOnline(diam){
  if(!DB.config.sheetUrl || !sandi()) return false;
  if(pendingCount()>0) return await doSync(diam);
  if(SYNC_BUSY) return false;
  SYNC_BUSY = true; updateSyncPill();
  try{
    const data = await apiKirim({action:'pull', password:sandi()});
    if(!data.ok) return false;
    gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString();
    saveDB();
    return true;
  }catch(e){ return false; }
  finally{ SYNC_BUSY=false; updateSyncPill(); }
}
function sinkronDiamJikaOnline(){
  if(DB.config.autoSync && navigator.onLine && DB.config.sheetUrl && sandi()){
    doSync(true).then(ok=>{ if(ok && ['absen','beranda'].includes(STATE.tab) && !document.querySelector('.modal-backdrop')) refresh(); });
  }
}

function updateSyncPill(){
  const pill = document.getElementById('syncPill'), txt = document.getElementById('syncPillText');
  if(!pill) return;
  const p = pendingCount();
  if(SYNC_BUSY){ pill.className='sync-pill busy'; txt.textContent='Menyinkron…'; return; }
  if(!DB.config.sheetUrl){ pill.className='sync-pill off'; txt.textContent='Belum diatur'; }
  else if(!navigator.onLine){ pill.className='sync-pill off'; txt.textContent = p>0 ? p+' menunggu' : 'Offline'; }
  else if(p>0){ pill.className='sync-pill pending'; txt.textContent=p+' menunggu'; }
  else { pill.className='sync-pill'; txt.textContent='Tersinkron'; }
}

function massalPick(guruId, status, btn){
  const wrap = btn.parentElement;
  if(MASSAL.pilihan[guruId]===status) delete MASSAL.pilihan[guruId];
  else MASSAL.pilihan[guruId] = status;
  wrap.querySelectorAll('.mp').forEach(b=>{ const on = MASSAL.pilihan[guruId]===b.dataset.st; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  perbaruiTombolMassal();

function massalSemua(status){
  MASSAL.pilihan = {};
  if(status) activeGuru().forEach(g=>{ MASSAL.pilihan[g.id]=status; });
  document.querySelectorAll('.massal-pick .mp').forEach(b=>b.classList.toggle('on', !!status && b.dataset.st===status));

function simpanMassal(){
  const ids = Object.keys(MASSAL.pilihan);
  if(!ids.length){ toast('Belum ada guru yang ditandai.','err'); return; }
  const jam = normJam(MASSAL.jam) || nowTime();
  let baru=0, ubah=0;
  ids.forEach(guruId=>{
    const status = MASSAL.pilihan[guruId];
    const ada = activeAbsensi().find(a=>a.guruId===guruId && a.tanggal===MASSAL.tanggal && a.jenis===MASSAL.jenis);
    if(ada){ if(ada.status!==status){ Object.assign(ada,{status, synced:false, rev:Date.now()}); ubah++; } }
    else { catatAbsen({guruId, tanggal:MASSAL.tanggal, jam, jenis:MASSAL.jenis, status}); baru++; }
  });
  saveDB();
  catatLog('Absen massal', `${baru} baru, ${ubah} diubah (${MASSAL.jenis}, ${fmtDateShort(MASSAL.tanggal)})`);
  toast(`${baru} absensi baru, ${ubah} diperbarui.`,'ok');

    <button class="btn btn-primary" onclick="simpanEditAbsen('${a?a.id:''}')">${a?'Simpan perubahan':'Simpan absensi'}</button>
    ${a?`<button class="btn btn-danger" style="margin-top:8px;" onclick="hapusAbsen('${a.id}', true)">Hapus catatan ini</button>`:''}`, {id:'modalAbsen', tanpaFokus:true});

function simpanEditAbsen(id){
  const d = bacaFormAbsen('e'); if(!d) return;
  if(id){
    const a = absenById(id); if(!a){ toast('Catatan tidak ditemukan.','err'); return; }
    const bentrok = activeAbsensi().find(x=>x.id!==id && x.guruId===d.guruId && x.tanggal===d.tanggal && x.jenis===d.jenis);
    if(bentrok){ toast(`Sudah ada absen ${d.jenis} untuk guru ini pada tanggal tersebut. Ubah catatan itu saja.`,'err'); return; }
    Object.assign(a, d, {synced:false, rev:Date.now()});
    catatLog('Ubah absen', `${namaGuru(d.guruId)}: ${d.status} (${d.jenis}, ${fmtDateShort(d.tanggal)})`);
  } else {
    const kembar = activeAbsensi().find(a=>a.guruId===d.guruId && a.tanggal===d.tanggal && a.jenis===d.jenis);
    if(kembar) Object.assign(kembar, {jam:d.jam, status:d.status, ketDetail:d.ketDetail, ketBebas:d.ketBebas, synced:false, rev:Date.now()});
    else catatAbsen(d);
    catatLog('Absen', `${namaGuru(d.guruId)}: ${d.status} (${d.jenis}, ${fmtDateShort(d.tanggal)})`);
  }
  saveDB();
  tutupModal(document.getElementById('modalAbsen'));
  toast(id?'Perubahan tersimpan.':'Absensi tersimpan.','ok');
  STATE.absenFilterDate = d.tanggal;
  refresh(); sinkronDiamJikaOnline();
}
async function hapusAbsen(id, dariModal){
  const a = absenById(id); if(!a) return;
  if(!await konfirmasi({judul:'Hapus absensi', pesan:`Hapus absen <b>${esc(a.jenis)}</b> ${esc(namaGuru(a.guruId))} pada ${fmtDateLong(a.tanggal)}?`, ok:'Hapus', bahaya:true})) return;
  const sebelum = {deleted:a.deleted, synced:a.synced, rev:a.rev};
  a.deleted = true; a.synced = false; a.rev = Date.now();
  saveDB();
  catatLog('Hapus absen', `${namaGuru(a.guruId)} (${a.jenis}, ${fmtDateShort(a.tanggal)})`, 'warn');
  if(dariModal) tutupModal(document.getElementById('modalAbsen'));
  refresh();
  toast('Catatan absensi dihapus.', '', {label:'Urungkan', fn:()=>{
    Object.assign(a, sebelum, {synced:false, rev:Date.now()}); a.deleted=false; saveDB();
    catatLog('Urungkan hapus', namaGuru(a.guruId)); toast('Penghapusan dibatalkan.','ok'); refresh();
  }});
  setTimeout(sinkronDiamJikaOnline, 6500);
}

/* ============================================================
   DATA LAPORAN HARIAN — satu baris per guru (Datang + Pulang digabung),
   termasuk guru yang belum absen. Dipakai layar, PDF, cetak, CSV & WA,
   sehingga formatnya selalu sama.
============================================================ */
function dataHarian(tgl){
  const recs = activeAbsensi().filter(a=>a.tanggal===tgl);
  const ids = new Set(activeGuru().map(g=>g.id));
  recs.forEach(a=>ids.add(a.guruId));
  const jamMasuk = DB.config.jamMasuk, mMasuk = menit(jamMasuk);
  const rows = [...ids].map(gid=>{
    const g = guruById(gid);
    const dtg = recs.find(a=>a.guruId===gid && a.jenis==='Datang');
    const plg = recs.find(a=>a.guruId===gid && a.jenis==='Pulang');
    const utama = dtg || plg;
    const status = utama ? utama.status : 'Belum';
    const ket = [];
    [dtg,plg].forEach(r=>{ if(r){ if(r.ketDetail) ket.push(r.ketDetail); if(r.ketBebas) ket.push(r.ketBebas); } });
    let telat = 0;
    if(DB.config.tandaiTelat && dtg && dtg.status==='Hadir' && mMasuk!=null && menit(dtg.jam)!=null && menit(dtg.jam)>mMasuk){
      telat = menit(dtg.jam)-mMasuk;
      if(!ket.some(k=>/terlambat/i.test(k))) ket.unshift(`Terlambat ${telat} menit`);
    }
    return {
      guruId:gid, nama:g?g.nama:'(guru dihapus)', nip:g?(g.nip||''):'', mapel:g?(g.mapel||''):'',
      datang:dtg, pulang:plg, status,
      jamDatang: dtg && dtg.status==='Hadir' ? (dtg.jam||'') : '',
      jamPulang: plg && plg.status==='Hadir' ? (plg.jam||'') : '',
      ket:[...new Set(ket)].join('; '), telat,
      tertunda:[dtg,plg].some(r=>r && !r.synced)
    };
  }).sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
  const c = {Hadir:0,Sakit:0,Izin:0,Alpa:0,Belum:0};
  rows.forEach(r=>c[r.status]++);
  const total = rows.length;
  return {tanggal:tgl, rows, c, total, telat:rows.filter(r=>r.telat).length,
    persen: total ? Math.round(c.Hadir/total*100) : 0, libur:liburPada(tgl), hariSekolah:hariSekolah(tgl), jumlahCatatan:recs.length};
}
function barisGuruHarianHTML(rows, tgl){
  return rows.map(r=>{
    const aksi = r.datang ? `bukaEditAbsen('${r.datang.id}')` : r.pulang ? `bukaEditAbsen('${r.pulang.id}')` : `bukaEditAbsen(null,'${r.guruId}','${tgl}')`;
    return `

      <div class="avatar ${r.status==='Belum'?'soft':''}">${esc(initials(r.nama))}</div>

        ${r.status==='Hadir' ? `<div class="times"><span>Datang <b class="${r.telat?'telat':''}">${esc(r.jamDatang||'-')}</b></span><span>Pulang <b>${esc(r.jamPulang||'-')}</b></span></div>` : ''}
        ${r.ket?`<div class="list-sub">${esc(r.ket)}</div>`:(r.status!=='Hadir'?`<div class="list-sub">Tanpa keterangan</div>`:'')}`}
      </div>

  }).join('');

function pintasRentangHarian(j){
  const d = new Date(), t = todayStr();
  if(j==='minggu'){ const h=(d.getDay()+6)%7; RENTANG.awal = tambahHari(t,-h); RENTANG.akhir = t; }
  else if(j==='bulan'){ RENTANG.awal = t.slice(0,8)+'01'; RENTANG.akhir = t; }
  else if(j==='lalu'){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); RENTANG.awal = isoDari(a); RENTANG.akhir = isoDari(b); }
  else { RENTANG.awal = tambahHari(t,-6); RENTANG.akhir = t; }
  document.getElementById('rg_awal').value = RENTANG.awal;
  document.getElementById('rg_akhir').value = RENTANG.akhir;
  pratinjauRentang();
}
function daftarTanggalRentang(o){
  const hasil = {tanggal:[], dilewati:0, error:''};
  if(!isISO(o.awal) || !isISO(o.akhir)){ hasil.error='Isi kedua tanggal.'; return hasil; }
  if(o.awal > o.akhir){ hasil.error='Tanggal awal harus sebelum tanggal akhir.'; return hasil; }
  const n = selisihHari(o.awal, o.akhir)+1;
  if(n > MAKS_HARI_RENTANG){ hasil.error=`Rentang maksimal ${MAKS_HARI_RENTANG} hari (dipilih ${n} hari). Bagi menjadi beberapa bagian.`; return hasil; }
  const adaData = new Set(activeAbsensi().map(a=>a.tanggal));
  for(let i=0;i<n;i++){
    const t = tambahHari(o.awal, i), h = tglObj(t).getDay();
    if((o.minggu && h===0) || (o.sabtu && h===6) || (o.libur && liburPada(t)) || (o.kosong && !adaData.has(t))){ hasil.dilewati++; continue; }
    hasil.tanggal.push(t);
  }
  if(!hasil.tanggal.length) hasil.error = 'Tidak ada tanggal yang tersisa setelah penyaringan.';
  return hasil;
}
function pratinjauRentang(){
  const el = document.getElementById('rg_preview'); if(!el) return;
  const h = daftarTanggalRentang(RENTANG);
  const tombol = ['rg_pdf','rg_cetak'].map(i=>document.getElementById(i));
  tombol.forEach(b=>b.disabled = !!h.error);
  if(h.error){ el.innerHTML = `<span style="color:var(--danger)">${esc(h.error)}</span>`; return; }
  const kosong = h.tanggal.filter(t=>!activeAbsensi().some(a=>a.tanggal===t)).length;
  el.innerHTML = `<b>${h.tanggal.length}</b> halaman laporan harian${RENTANG.rekap?' + 1 halaman rekap':''}<br>
    <span class="muted">${fmtDateLong(RENTANG.awal)} sampai ${fmtDateLong(RENTANG.akhir)}${h.dilewati?` · ${h.dilewati} tanggal dilewati`:''}${kosong?` · ${kosong} tanggal belum ada catatan`:''}</span>`;
}
async function jalankanRentang(cara){
  const h = daftarTanggalRentang(RENTANG);
  if(h.error){ toast(h.error,'err'); return; }
  STATE.lapAwal = RENTANG.awal; STATE.lapAkhir = RENTANG.akhir;
  const opsi = {rekap:RENTANG.rekap, awal:RENTANG.awal, akhir:RENTANG.akhir};
  if(cara==='pdf'){ const ok = await unduhPDFHarian(h.tanggal, opsi); if(ok) tutupModal(document.getElementById('modalRentang')); }
  else { tutupModal(document.getElementById('modalRentang')); cetakHarian(h.tanggal, opsi); }
}

/* ---------- Rekap periode ---------- */
function rekapPerGuru(list){
  /* Satu hari dihitung sekali per guru: status Datang diutamakan, jika tidak ada pakai Pulang */
  const per = {};
  const hari = {};
  list.forEach(a=>{
    const k = a.guruId+'|'+a.tanggal;
    if(!hari[k] || (a.jenis==='Datang' && hari[k].jenis!=='Datang')) hari[k] = a;
  });
  Object.values(hari).forEach(a=>{
    if(!per[a.guruId]) per[a.guruId] = {Hadir:0,Sakit:0,Izin:0,Alpa:0,telat:0};
    if(per[a.guruId][a.status]!==undefined) per[a.guruId][a.status]++;
    const m = menit(DB.config.jamMasuk);
    if(DB.config.tandaiTelat && a.jenis==='Datang' && a.status==='Hadir' && m!=null && menit(a.jam)>m) per[a.guruId].telat++;
  });
  return Object.keys(per).map(gid=>{
    const p = per[gid], t = p.Hadir+p.Sakit+p.Izin+p.Alpa, g = guruById(gid);
    return {guruId:gid, nama:namaGuru(gid), nip:g?(g.nip||''):'', ...p, total:t, persen: t?Math.round(p.Hadir/t*100):0};
  }).sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
}
