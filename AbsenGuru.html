const LIBS = {
  jspdf:['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'],
  autotable:['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js','https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'],
  html2canvas:['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js']
};
function muatSkrip(urls){
  return urls.reduce((p,url)=>p.catch(()=>new Promise((res,rej)=>{
    const s = document.createElement('script'); s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = ()=>res(); s.onerror = ()=>{ s.remove(); rej(new Error('gagal '+url)); };
    document.head.appendChild(s);
  })), Promise.reject());
}
async function siapkanPDF(){
  if(!window.jspdf) await muatSkrip(LIBS.jspdf);
  const J = window.jspdf.jsPDF;
  if(!J.API.autoTable) await muatSkrip(LIBS.autotable);
  if(!J.API.autoTable && window.jspdf_autotable && window.jspdf_autotable.applyPlugin) window.jspdf_autotable.applyPlugin(J);
  if(!J.API.autoTable) throw new Error('AutoTable tidak tersedia');
  return J;
}
/* Font standar PDF hanya mengenal huruf Latin dasar */
function pt(s){ return String(s==null?'':s).replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'?'); }
const RGB = {navy:[22,36,62], ink:[29,36,48], soft:[92,100,114], garis:[190,196,206], zebra:[246,247,250], libur:[232,234,239],
  Hadir:[35,119,90], Sakit:[184,114,26], Izin:[42,103,160], Alpa:[178,53,53], Belum:[130,138,150]};

function pdfKop(doc){
  const W = doc.internal.pageSize.getWidth(), cx = W/2, cfg = DB.config;
  let y = 14;
  doc.setTextColor(...RGB.ink);
  if(cfg.dinas){ doc.setFont('times','bold'); doc.setFontSize(11); const l = doc.splitTextToSize(pt(cfg.dinas.toUpperCase()), W-40); doc.text(l, cx, y, {align:'center'}); y += l.length*4.8; }
  doc.setFont('times','bold'); doc.setFontSize(16); doc.text(pt((cfg.schoolName||'').toUpperCase()), cx, y+1.5, {align:'center'}); y += 7.2;
  if(cfg.alamat){ doc.setFont('times','normal'); doc.setFontSize(9.5); const l = doc.splitTextToSize(pt(cfg.alamat), W-50); doc.text(l, cx, y, {align:'center'}); y += l.length*4.1; }
  y += 0.5;
  doc.setDrawColor(...RGB.navy); doc.setLineWidth(0.9); doc.line(15, y, W-15, y);
  doc.setLineWidth(0.3); doc.line(15, y+1.3, W-15, y+1.3);
  return y + 8;
}
function pdfJudul(doc, judul, sub, y){
  const cx = doc.internal.pageSize.getWidth()/2;
  doc.setTextColor(...RGB.ink); doc.setFont('times','bold'); doc.setFontSize(12.5);
  const t = pt(judul); doc.text(t, cx, y, {align:'center'});
  const w = doc.getTextWidth(t); doc.setLineWidth(0.3); doc.setDrawColor(...RGB.ink); doc.line(cx-w/2, y+1, cx+w/2, y+1);
  y += 5.5;
  if(sub){ doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...RGB.soft); [].concat(sub).forEach(s=>{ doc.text(pt(s), cx, y, {align:'center'}); y += 4.6; }); }
  return y + 2.5;
}
function tabelDasar(extra){
  return Object.assign({
    theme:'grid', margin:{left:15, right:15, top:18, bottom:20}, showHead:'everyPage',
    styles:{font:'helvetica', fontSize:8.8, cellPadding:{top:1.9,bottom:1.9,left:2,right:2}, textColor:RGB.ink, lineColor:RGB.garis, lineWidth:0.2, valign:'middle', overflow:'linebreak'},
    headStyles:{fillColor:RGB.navy, textColor:255, fontStyle:'bold', halign:'center', fontSize:8.6},
    alternateRowStyles:{fillColor:RGB.zebra}
  }, extra);
}
function warnaiStatus(kol){
  return data=>{
    if(data.section==='body' && data.column.index===kol){
      const s = String(data.cell.raw||'').split(' ')[0];
      if(RGB[s]){ data.cell.styles.textColor = RGB[s]; data.cell.styles.fontStyle = 'bold'; }
    }
  };
}
function pdfTTD(doc, y, tglIso){
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), cfg = DB.config;
  if(y + 44 > H - 20){ doc.addPage(); y = 22; }
  const x = W - 15 - 36;
  const tgl = (cfg.ttdTanggal==='cetak' || !isISO(tglIso)) ? fmtDateLong(todayStr()) : fmtDateLong(tglIso);
  doc.setFont('times','normal'); doc.setFontSize(10.5); doc.setTextColor(...RGB.ink);
  doc.text(pt(`${cfg.kota||'Ratatotok'}, ${tgl}`), x, y+4, {align:'center'});
  doc.text('Mengetahui,', x, y+9, {align:'center'});
  doc.text('Kepala Sekolah', x, y+14, {align:'center'});
  const nama = pt(cfg.kepsek || '..................................................');
  doc.setFont('times','bold'); doc.text(nama, x, y+36, {align:'center'});
  if(cfg.kepsek){ const w = doc.getTextWidth(nama); doc.setLineWidth(0.25); doc.line(x-w/2, y+36.9, x+w/2, y+36.9); }
  doc.setFont('times','normal'); doc.text(pt('NIP. '+(cfg.nipKepsek || '....................................')), x, y+41, {align:'center'});
  return y + 46;
}
function pdfFooter(doc){
  const n = doc.getNumberOfPages(), cetak = new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setDrawColor(...RGB.garis); doc.setLineWidth(0.2); doc.line(15, H-12, W-15, H-12);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...RGB.soft);
    doc.text(pt(`Absensi Guru ${DB.config.schoolName} - dicetak ${cetak}`), 15, H-8);
    doc.text(`Halaman ${i} dari ${n}`, W-15, H-8, {align:'right'});
  }
}
function tabelRingkas(doc, y, head, row){
  doc.autoTable(tabelDasar({startY:y, head:[head], body:[row], styles:{font:'helvetica', fontSize:8.8, halign:'center', textColor:RGB.ink, lineColor:RGB.garis, lineWidth:0.2, cellPadding:1.8},
    headStyles:{fillColor:[232,236,243], textColor:RGB.ink, fontStyle:'bold', halign:'center', fontSize:8.2}, alternateRowStyles:{}, showHead:'firstPage', pageBreak:'avoid'}));
  return doc.lastAutoTable.finalY;
}

/* Satu halaman laporan harian — format yang sama dipakai untuk 1 hari maupun rentang tanggal */
function pdfHarian(doc, lap){
  let y = pdfKop(doc);
  y = pdfJudul(doc, 'LAPORAN ABSENSI HARIAN GURU', [`Hari/Tanggal: ${fmtDateID(lap.tanggal)}${lap.libur?`  (Libur: ${lap.libur})`:''}`], y);
  doc.autoTable(tabelDasar({
    startY:y,
    head:[['No','Nama Guru','NIP','Datang','Pulang','Status','Keterangan']],
    body: lap.rows.length ? lap.rows.map((r,i)=>[i+1, pt(r.nama), pt(r.nip||'-'), r.jamDatang||'-', r.jamPulang||'-', r.status==='Belum'?'Belum absen':r.status, pt(r.ket||'-')])
                          : [[{content:'Belum ada data guru', colSpan:7, styles:{halign:'center', textColor:RGB.soft}}]],
    columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:47},2:{cellWidth:33},3:{cellWidth:15,halign:'center'},4:{cellWidth:15,halign:'center'},5:{cellWidth:23,halign:'center'},6:{cellWidth:'auto'}},
    didParseCell: warnaiStatus(5)
  }));
  y = doc.lastAutoTable.finalY + 5;
  if(y + 16 > doc.internal.pageSize.getHeight()-20){ doc.addPage(); y = 22; }
  y = tabelRingkas(doc, y, ['Hadir','Sakit','Izin','Alpa','Belum absen','Jumlah guru','Kehadiran'],
    [lap.c.Hadir, lap.c.Sakit, lap.c.Izin, lap.c.Alpa, lap.c.Belum, lap.total, lap.persen+'%']) + 2;
  if(DB.config.tandaiTelat){ doc.setFont('helvetica','italic'); doc.setFontSize(7.8); doc.setTextColor(...RGB.soft); doc.text(pt(`Jam masuk ${DB.config.jamMasuk}. Kedatangan setelah jam masuk ditandai terlambat.`), 15, y+3); y += 3; }
  pdfTTD(doc, y+2, lap.tanggal);
}
function rekapLengkap(list){
  const rows = rekapPerGuru(list);
  const ada = new Set(rows.map(r=>r.guruId));
  activeGuru().forEach(g=>{ if(!ada.has(g.id)) rows.push({guruId:g.id, nama:g.nama, nip:g.nip||'', Hadir:0,Sakit:0,Izin:0,Alpa:0,telat:0,total:0,persen:0}); });
  return rows.sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
}
function pdfRekap(doc, judul, sub, rows, tglTtd){
  let y = pdfKop(doc);
  y = pdfJudul(doc, judul, sub, y);
  doc.autoTable(tabelDasar({
    startY:y,
    head:[['No','Nama Guru','NIP','Hadir','Sakit','Izin','Alpa','Terlambat','% Hadir']],
    body: rows.length ? rows.map((r,i)=>[i+1, pt(r.nama), pt(r.nip||'-'), r.Hadir, r.Sakit, r.Izin, r.Alpa, r.telat||0, r.persen+'%'])
                      : [[{content:'Tidak ada data pada periode ini', colSpan:9, styles:{halign:'center', textColor:RGB.soft}}]],
    columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:'auto'},2:{cellWidth:33},3:{cellWidth:13,halign:'center'},4:{cellWidth:13,halign:'center'},5:{cellWidth:13,halign:'center'},6:{cellWidth:13,halign:'center'},7:{cellWidth:20,halign:'center'},8:{cellWidth:16,halign:'center',fontStyle:'bold'}}
  }));
  const tot = rows.reduce((s,r)=>{ STATUS.forEach(k=>s[k]+=r[k]); s.telat+=r.telat||0; return s; }, {Hadir:0,Sakit:0,Izin:0,Alpa:0,telat:0});
  const semua = tot.Hadir+tot.Sakit+tot.Izin+tot.Alpa;
  let y2 = doc.lastAutoTable.finalY + 5;
  y2 = tabelRingkas(doc, y2, ['Total Hadir','Sakit','Izin','Alpa','Terlambat','Rata-rata kehadiran'], [tot.Hadir, tot.Sakit, tot.Izin, tot.Alpa, tot.telat, (semua?Math.round(tot.Hadir/semua*100):0)+'%']);
  pdfTTD(doc, y2+4, tglTtd);
}

async function unduhPDFHarian(daftarTgl, opsi){
  opsi = opsi||{};
  if(!daftarTgl.length){ toast('Tidak ada tanggal untuk diekspor.','err'); return false; }
  toast(daftarTgl.length>1 ? `Menyusun ${daftarTgl.length} halaman laporan…` : 'Menyusun PDF…');
  let J;
  try{ J = await siapkanPDF(); }
  catch(e){ toast('Pustaka PDF belum bisa dimuat (offline). Membuka jendela cetak — pilih "Simpan sebagai PDF".','err'); cetakHarian(daftarTgl, opsi); return false; }
  try{
    const doc = new J({orientation:'p', unit:'mm', format:'a4'});
    daftarTgl.forEach((t,i)=>{ if(i>0) doc.addPage(); pdfHarian(doc, dataHarian(t)); });
    if(opsi.rekap && daftarTgl.length>1){
      const set = new Set(daftarTgl);
      doc.addPage();
      pdfRekap(doc, 'REKAP ABSENSI GURU', [`Periode ${fmtDateLong(opsi.awal||daftarTgl[0])} sampai ${fmtDateLong(opsi.akhir||daftarTgl[daftarTgl.length-1])}`, `Jumlah hari dilaporkan: ${daftarTgl.length} hari`],
        rekapLengkap(activeAbsensi().filter(a=>set.has(a.tanggal))), opsi.akhir||daftarTgl[daftarTgl.length-1]);
    }
    pdfFooter(doc);
    const nama = daftarTgl.length===1 ? `Laporan_Absensi_Harian_${daftarTgl[0]}` : `Laporan_Absensi_Harian_${daftarTgl[0]}_sd_${daftarTgl[daftarTgl.length-1]}`;
    doc.setProperties({title:nama.replace(/_/g,' '), author:DB.config.schoolName, creator:'Absensi Guru '+APP_VERSI});
    doc.save(nama+'.pdf');
    catatLog('Ekspor PDF', daftarTgl.length===1?`Harian ${daftarTgl[0]}`:`Harian ${daftarTgl[0]} s.d. ${daftarTgl[daftarTgl.length-1]} (${daftarTgl.length} hari)`);
    toast('PDF berhasil dibuat.','ok');
    return true;
  }catch(e){ console.error(e); toast('Gagal membuat PDF: '+e.message,'err'); return false; }
}
async function unduhPDFRekap(){
  const awal = STATE.lapAwal, akhir = STATE.lapAkhir;
  await buatPDF(`Rekap_Absensi_${awal}_sd_${akhir}`, doc=>pdfRekap(doc, 'REKAP ABSENSI GURU', [`Periode ${fmtDateLong(awal)} sampai ${fmtDateLong(akhir)}`], rekapLengkap(listPeriode(awal,akhir)), akhir));
}
async function unduhPDFRekapBulanan(){
  const [th,bl] = STATE.lapBulan.split('-').map(Number);
  const akhir = isoDari(new Date(th, bl, 0));
  await buatPDF(`Rekap_Absensi_Bulanan_${STATE.lapBulan}`, doc=>pdfRekap(doc, 'REKAP ABSENSI GURU BULANAN', [`Bulan ${NAMA_BULAN[bl-1]} ${th}`], rekapLengkap(activeAbsensi().filter(a=>a.tanggal.slice(0,7)===STATE.lapBulan)), akhir));
}
async function unduhPDFMatriks(){
  const [th,bl] = STATE.lapBulan.split('-').map(Number);
  const n = new Date(th, bl, 0).getDate();
  const tgl = Array.from({length:n},(_,i)=>`${th}-${String(bl).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);
  const list = activeAbsensi().filter(a=>a.tanggal.slice(0,7)===STATE.lapBulan);
  const rows = rekapLengkap(list);
  await buatPDF(`Daftar_Hadir_Guru_${STATE.lapBulan}`, doc=>{
    let y = pdfKop(doc);
    y = pdfJudul(doc, 'DAFTAR HADIR GURU', [`Bulan ${NAMA_BULAN[bl-1]} ${th}`], y);
    const libur = tgl.map(t=>!hariSekolah(t));
    const kolTgl = Math.min(7.5, (277-7-40-41)/n);
    const cs = {0:{cellWidth:7,halign:'center'},1:{cellWidth:40}};
    tgl.forEach((_,i)=>cs[i+2] = {cellWidth:kolTgl, halign:'center'});
    [0,1,2,3,4].forEach(k=>cs[n+2+k] = {cellWidth:k===4?11:7.5, halign:'center', fontStyle:'bold'});
    doc.autoTable(tabelDasar({
      startY:y, margin:{left:10,right:10,top:16,bottom:18},
      styles:{font:'helvetica', fontSize:6.8, cellPadding:{top:1.3,bottom:1.3,left:0.6,right:0.6}, textColor:RGB.ink, lineColor:RGB.garis, lineWidth:0.15, valign:'middle', halign:'center'},
      headStyles:{fillColor:RGB.navy, textColor:255, fontStyle:'bold', halign:'center', fontSize:6.6},
      alternateRowStyles:{},
      head:[['No','Nama Guru', ...tgl.map((_,i)=>String(i+1)), 'H','S','I','A','%']],
      body: rows.map((r,i)=>[i+1, pt(r.nama), ...tgl.map(t=>{
        const a = list.find(x=>x.guruId===r.guruId && x.tanggal===t && x.jenis==='Datang') || list.find(x=>x.guruId===r.guruId && x.tanggal===t);
        return a ? a.status[0] : '';
      }), r.Hadir, r.Sakit, r.Izin, r.Alpa, r.persen+'%']),
      columnStyles:cs,
      didParseCell:data=>{
        const c = data.column.index;
        if(c===1 && data.section==='body') data.cell.styles.halign = 'left';
        if(c>=2 && c<2+n){
          if(libur[c-2]) data.cell.styles.fillColor = data.section==='head' ? [70,82,104] : RGB.libur;
          if(data.section==='body'){ const m = {H:'Hadir',S:'Sakit',I:'Izin',A:'Alpa'}[data.cell.raw]; if(m){ data.cell.styles.textColor = RGB[m]; data.cell.styles.fontStyle='bold'; } }
        }
      }
    }));
    let y2 = doc.lastAutoTable.finalY + 4;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.8); doc.setTextColor(...RGB.soft);
    doc.text('Keterangan: H = Hadir, S = Sakit, I = Izin, A = Alpa. Kolom abu-abu = hari libur / bukan hari sekolah.', 10, y2+2);
    pdfTTD(doc, y2+4, isoDari(new Date(th, bl, 0)));
  }, 'l');
}
async function unduhPDFGuru(){
  const g = guruById(STATE.lapGuruId); if(!g){ toast('Pilih guru terlebih dahulu.','err'); return; }
  const list = listGuruPeriode();
  const tglSet = [...new Set(list.map(a=>a.tanggal))].sort();
  const rk = rekapPerGuru(list)[0] || {Hadir:0,Sakit:0,Izin:0,Alpa:0,telat:0,total:0,persen:0};
  const periode = (STATE.lapGuruAwal||STATE.lapGuruAkhir) ? `${STATE.lapGuruAwal?fmtDateLong(STATE.lapGuruAwal):'awal'} sampai ${STATE.lapGuruAkhir?fmtDateLong(STATE.lapGuruAkhir):'sekarang'}` : 'Seluruh data';
  await buatPDF(`Riwayat_Absensi_${g.nama.replace(/[^A-Za-z0-9]+/g,'_')}`, doc=>{
    let y = pdfKop(doc);
    y = pdfJudul(doc, 'LAPORAN ABSENSI PER GURU', null, y);
    doc.autoTable({startY:y, theme:'plain', margin:{left:15,right:15}, styles:{font:'helvetica',fontSize:9.2,cellPadding:0.9,textColor:RGB.ink},
      columnStyles:{0:{cellWidth:32,fontStyle:'bold'},1:{cellWidth:4},2:{cellWidth:'auto'}},
      body:[['Nama',':',pt(g.nama)],['NIP',':',pt(g.nip||'-')],['NUPTK',':',pt(g.nuptk||'-')],['Mata pelajaran',':',pt(g.mapel||'-')],['Periode',':',pt(periode)]]});
    y = doc.lastAutoTable.finalY + 4;
    y = tabelRingkas(doc, y, ['Hadir','Sakit','Izin','Alpa','Terlambat','Hari tercatat','Kehadiran'], [rk.Hadir, rk.Sakit, rk.Izin, rk.Alpa, rk.telat, rk.total, rk.persen+'%']) + 5;
    const mMasuk = menit(DB.config.jamMasuk);
    doc.autoTable(tabelDasar({startY:y,
      head:[['No','Hari, Tanggal','Datang','Pulang','Status','Keterangan']],
      body: tglSet.length ? tglSet.map((t,i)=>{
        const d = list.find(a=>a.tanggal===t && a.jenis==='Datang'), p = list.find(a=>a.tanggal===t && a.jenis==='Pulang');
        const u = d||p; const ket=[];
        [d,p].forEach(r=>{ if(r){ if(r.ketDetail) ket.push(r.ketDetail); if(r.ketBebas) ket.push(r.ketBebas); } });
        if(DB.config.tandaiTelat && d && d.status==='Hadir' && mMasuk!=null && menit(d.jam)>mMasuk && !ket.some(k=>/terlambat/i.test(k))) ket.unshift(`Terlambat ${menit(d.jam)-mMasuk} menit`);
        return [i+1, pt(fmtDateID(t)), d&&d.status==='Hadir'?(d.jam||'-'):'-', p&&p.status==='Hadir'?(p.jam||'-'):'-', u.status, pt([...new Set(ket)].join('; ')||'-')];
      }) : [[{content:'Belum ada catatan', colSpan:6, styles:{halign:'center', textColor:RGB.soft}}]],
      columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:48},2:{cellWidth:16,halign:'center'},3:{cellWidth:16,halign:'center'},4:{cellWidth:20,halign:'center'},5:{cellWidth:'auto'}},
      didParseCell:warnaiStatus(4)}));
    pdfTTD(doc, doc.lastAutoTable.finalY+5, STATE.lapGuruAkhir||todayStr());
  });
}
async function buatPDF(nama, gambar, orientasi){
  toast('Menyusun PDF…');
  let J;
  try{ J = await siapkanPDF(); }catch(e){ toast('Pustaka PDF butuh internet saat pertama kali dipakai. Sambungkan internet lalu coba lagi, atau gunakan tombol Cetak.','err'); return false; }
  try{
    const doc = new J({orientation:orientasi||'p', unit:'mm', format:'a4'});
    gambar(doc); pdfFooter(doc);
    doc.setProperties({title:nama.replace(/_/g,' '), author:DB.config.schoolName});
    doc.save(nama+'.pdf');
    catatLog('Ekspor PDF', nama);
    toast('PDF berhasil dibuat.','ok'); return true;
  }catch(e){ console.error(e); toast('Gagal membuat PDF: '+e.message,'err'); return false; }
}

/* ---------- CSV (aman dari formula injection saat dibuka di Excel) ---------- */
function selCSV(v){ let s = String(v==null?'':v); if(/^[=+\-@\t\r]/.test(s)) s = "'"+s; return `"${s.replace(/"/g,'""')}"`; }
function unduhCSV(baris, nama){
  const blob = new Blob(['\uFEFF'+baris.map(r=>r.map(selCSV).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nama; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportCSV(kind){
  const kepala = [[DB.config.schoolName]];

  if(kind==='harian'){
    const lap = dataHarian(STATE.lapTanggal);
    judul='LAPORAN ABSENSI HARIAN GURU'; sub=fmtDateID(lap.tanggal); nama=`Laporan_Absensi_Harian_${lap.tanggal}.csv`;

    rows=lap.rows.map((r,i)=>[i+1,r.nama,r.nip||'-',r.jamDatang||'-',r.jamPulang||'-',r.status==='Belum'?'Belum absen':r.status,r.ket||'-']);
  } else if(kind==='rentang' || kind==='bulanan'){
    let list;
    if(kind==='bulanan'){ const [th,bl]=STATE.lapBulan.split('-').map(Number); list = activeAbsensi().filter(a=>a.tanggal.slice(0,7)===STATE.lapBulan); judul='REKAP ABSENSI GURU BULANAN'; sub=`${NAMA_BULAN[bl-1]} ${th}`; nama=`Rekap_Absensi_${STATE.lapBulan}.csv`; }
    else { list = listPeriode(STATE.lapAwal, STATE.lapAkhir); judul='REKAP ABSENSI GURU'; sub=`${fmtDateLong(STATE.lapAwal)} sampai ${fmtDateLong(STATE.lapAkhir)}`; nama=`Rekap_Absensi_${STATE.lapAwal}_sd_${STATE.lapAkhir}.csv`; }
    head=['No','Nama Guru','NIP','Hadir','Sakit','Izin','Alpa','Terlambat','% Hadir'];
    rows=rekapLengkap(list).map((r,i)=>[i+1,r.nama,r.nip||'-',r.Hadir,r.Sakit,r.Izin,r.Alpa,r.telat,r.persen+'%']);
  } else {
    const g = guruById(STATE.lapGuruId); if(!g) return;
    judul='LAPORAN ABSENSI PER GURU'; sub=`${g.nama} - NIP ${g.nip||'-'}`; nama=`Riwayat_Absensi_${g.nama.replace(/[^A-Za-z0-9]+/g,'_')}.csv`;

  }
  unduhCSV([...kepala,[judul],[sub],[],head,...rows], nama);
  catatLog('Ekspor CSV', nama);
  toast('File CSV diunduh. Bisa dibuka di Excel.','ok');
}

function parseCSV(teksCSV){
  const pemisah = (teksCSV.split('\n')[0].match(/;/g)||[]).length > (teksCSV.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], sel = '', kutip = false;
  for(let i=0;i<teksCSV.length;i++){
    const c = teksCSV[i];
    if(kutip){ if(c==='"'){ if(teksCSV[i+1]==='"'){ sel+='"'; i++; } else kutip=false; } else sel+=c; }
    else if(c==='"') kutip = true;
    else if(c===pemisah){ row.push(sel); sel=''; }
    else if(c==='\n'){ row.push(sel); rows.push(row); row=[]; sel=''; }
    else if(c!=='\r') sel+=c;
  }
  if(sel||row.length){ row.push(sel); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function bukaImporGuru(){
  const m = bukaModal(`
    ${kepalaModal('Impor guru dari CSV')}
    <p class="muted" style="margin-top:0;">Buat file di Excel dengan kolom <b>Nama, NIP, NUPTK, Jenis Kelamin, Mata Pelajaran</b>, lalu simpan sebagai CSV. Baris judul akan dikenali otomatis. Nama yang sudah terdaftar dilewati.</p>
    <input type="file" id="imp_file" accept=".csv,text/csv" class="inp" style="margin-bottom:12px;">
    <div id="imp_prev"></div>`, {tanpaFokus:true});
  m.querySelector('#imp_file').onchange = ev=>{
    const f = ev.target.files[0]; if(!f) return;
    if(f.size > 1024*1024){ toast('File terlalu besar (maks 1 MB).','err'); return; }
    const r = new FileReader();
    r.onload = ()=>{
      let rows = parseCSV(String(r.result).replace(/^\uFEFF/,''));
      const h = (rows[0]||[]).map(x=>x.toLowerCase());
      const idx = k => h.findIndex(x=>x.includes(k));
      let iN = idx('nama'), iNip = h.findIndex(x=>x.trim()==='nip'), iNu = idx('nuptk'), iJk = h.findIndex(x=>x.includes('kelamin')||x==='jk'||x==='l/p'), iM = h.findIndex(x=>x.includes('mapel')||x.includes('pelajaran'));
      if(iN>=0) rows = rows.slice(1); else { iN=0; iNip=1; iNu=2; iJk=3; iM=4; }
      const ada = new Set(activeGuru().map(g=>g.nama.toLowerCase()));
      const baru = [];
      rows.forEach(c=>{
        const nama = teks(c[iN],120); if(nama.length<3 || ada.has(nama.toLowerCase())) return;
        ada.add(nama.toLowerCase());
        const jkRaw = String(c[iJk]||'').trim().toUpperCase();
        baru.push({id:uid(), nama, nip:teks(c[iNip],30).replace(/[^\d]/g,''), nuptk:teks(c[iNu],30).replace(/[^\d]/g,''), jk:(jkRaw.startsWith('P')||jkRaw.startsWith('W'))?'P':'L', mapel:teks(c[iM],80), synced:false, deleted:false, rev:Date.now()});
      });
      const prev = m.querySelector('#imp_prev');
      if(!baru.length){ prev.innerHTML = `<div class="note warn">${IKON.warn}<span>Tidak ada guru baru yang bisa diimpor dari file ini.</span></div>`; return; }
      prev.innerHTML = `<div class="preview-box"><b>${baru.length}</b> guru baru siap diimpor<br><span class="muted">${baru.slice(0,5).map(g=>esc(g.nama)).join(', ')}${baru.length>5?', …':''}</span></div>
        <button class="btn btn-primary" id="imp_ok">Impor ${baru.length} guru</button>`;
      prev.querySelector('#imp_ok').onclick = ()=>{
        DB.guru.push(...baru); saveDB(); catatLog('Impor guru', `${baru.length} guru`); m.remove(); renderGuru();
        toast(`${baru.length} guru ditambahkan.`,'ok'); sinkronDiamJikaOnline();
      };
    };
    r.readAsText(f);
  };
}

      <div class="set-row"><div><div class="sl">Password</div><div class="sd">${cfg.passVerified?'Sudah diverifikasi spreadsheet':'Belum diverifikasi spreadsheet'} · disimpan sebagai hash</div></div>
        <button class="btn btn-sm btn-outline" onclick="openGantiPassword()">Ganti</button></div>
      <div class="set-row"><div><div class="sl">Log aktivitas</div><div class="sd">${bacaLog().length} catatan${lo.gagal?` · ${lo.gagal} percobaan login gagal`:''}</div></div>
        <button class="btn btn-sm btn-outline" onclick="lihatLog()">Lihat</button></div>
      <div class="set-row"><div><div class="sl">Kunci sekarang</div><div class="sd">Kunci aplikasi saat perangkat ditinggal</div></div>
        <button class="btn btn-sm btn-outline" onclick="kunciAplikasi()">Kunci</button></div>
    </div>

    <div class="card">
      <div class="h-sec" style="margin-bottom:10px;">Jadwal sekolah</div>
      <div class="grid-2">
        <div class="field"><label for="c_masuk">Jam masuk</label><input type="time" id="c_masuk" value="${esc(cfg.jamMasuk)}"></div>
        <div class="field"><label for="c_pulang">Jam pulang</label><input type="time" id="c_pulang" value="${esc(cfg.jamPulang)}"></div>
      </div>
      <div class="set-row"><div><div class="sl">Tandai terlambat otomatis</div><div class="sd">Kedatangan setelah jam masuk diberi keterangan di laporan</div></div>
        <button class="sw ${cfg.tandaiTelat?'on':''}" role="switch" aria-checked="${cfg.tandaiTelat}" onclick="toggleCfg('tandaiTelat', this)"><i></i></button></div>
      <div class="set-row"><div><div class="sl">Sabtu hari sekolah</div><div class="sd">Aktifkan bila sekolah 6 hari seminggu</div></div>
        <button class="sw ${cfg.hitungSabtu?'on':''}" role="switch" aria-checked="${cfg.hitungSabtu}" onclick="toggleCfg('hitungSabtu', this)"><i></i></button></div>
      <button class="btn btn-outline" style="margin-top:6px;" onclick="simpanJadwal()">Simpan jam sekolah</button>
      <div class="divider"></div>
      <div class="h-sec" style="margin-bottom:8px;">Hari libur &amp; tanggal merah <small>(${cfg.libur.length})</small></div>
      <div class="grid-2" style="grid-template-columns:1fr 1.4fr;">
        <input type="date" class="inp" id="lb_tgl" aria-label="Tanggal libur">
        <input type="text" class="inp" id="lb_ket" maxlength="80" placeholder="Keterangan, mis. HUT RI" aria-label="Keterangan libur">
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="tambahLibur()">Tambah hari libur</button>
      ${cfg.libur.length?`<div style="margin-top:10px;max-height:220px;overflow-y:auto;">${cfg.libur.slice().reverse().map(l=>`
        <div class="set-row" style="padding:7px 0;"><div><div class="sl" style="font-size:13px;">${fmtDateID(l.tgl)}</div><div class="sd">${esc(l.ket||'Hari libur')}</div></div>
        <button class="iconbtn" aria-label="Hapus libur" onclick="hapusLibur('${l.tgl}')">${IKON.hapus}</button></div>`).join('')}</div>`:''}
    </div>

    <div class="card">
      <div class="h-sec" style="margin-bottom:10px;">Kop &amp; tanda tangan laporan</div>
      <div class="field"><label for="c_dinas">Nama dinas</label><input type="text" id="c_dinas" maxlength="140" value="${esc(cfg.dinas||'')}"></div>
      <div class="field"><label for="c_sekolah">Nama sekolah</label><input type="text" id="c_sekolah" maxlength="100" value="${esc(cfg.schoolName||'')}"></div>
      <div class="field"><label for="c_alamat">Alamat sekolah</label><input type="text" id="c_alamat" maxlength="200" value="${esc(cfg.alamat||'')}"></div>
      <div class="grid-2">
        <div class="field"><label for="c_kota">Kota tanda tangan</label><input type="text" id="c_kota" maxlength="60" value="${esc(cfg.kota||'')}"></div>
        <div class="field"><label for="c_ttdtgl">Tanggal tanda tangan</label>
          <select id="c_ttdtgl"><option value="laporan" ${cfg.ttdTanggal!=='cetak'?'selected':''}>Tanggal laporan</option><option value="cetak" ${cfg.ttdTanggal==='cetak'?'selected':''}>Tanggal cetak</option></select></div>
      </div>
      <div class="field"><label for="c_kepsek">Nama kepala sekolah</label><input type="text" id="c_kepsek" maxlength="100" value="${esc(cfg.kepsek||'')}" placeholder="Nama lengkap dan gelar"></div>
      <div class="field"><label for="c_nipkepsek">NIP kepala sekolah</label><input type="text" id="c_nipkepsek" inputmode="numeric" maxlength="30" value="${esc(cfg.nipKepsek||'')}"></div>
      <button class="btn btn-outline" onclick="simpanIdentitas()">Simpan identitas</button>
    </div>

    <div class="card">
      <div class="h-sec" style="margin-bottom:10px;">Tampilan &amp; data</div>
      <div class="set-row"><div><div class="sl">Tema gelap</div><div class="sd">Nyaman dipakai malam hari</div></div>
        <button class="sw ${cfg.tema==='gelap'?'on':''}" role="switch" aria-checked="${cfg.tema==='gelap'}" onclick="toggleTema(this)"><i></i></button></div>
      <div class="set-row"><div><div class="sl">Cadangan data</div><div class="sd">File cadangan tidak memuat password</div></div>
        <div style="display:flex;gap:6px;"><button class="btn btn-sm btn-outline" onclick="backupData()">Ekspor</button><button class="btn btn-sm btn-outline" onclick="mulaiRestore()">Impor</button></div></div>
      <input type="file" id="restoreFile" accept="application/json,.json" class="hidden" onchange="restoreData(event)">
    </div>

    <details class="card">
      <summary style="cursor:pointer;font-weight:700;font-size:13px;">Lanjutan</summary>
      <div class="field" style="margin-top:12px;"><label for="s_url">Alamat Web App Google Apps Script</label>
        <input type="url" id="s_url" value="${esc(cfg.sheetUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
        <div class="hint">Hanya alamat script.google.com yang diterima. Mengubahnya memerlukan password.</div></div>
      <button class="btn btn-outline" style="margin-bottom:10px;" onclick="simpanUrl()">Simpan alamat</button>
      <button class="btn btn-danger" onclick="mulaiUlangDariServer()">Ganti seluruh data perangkat dengan data spreadsheet</button>
    </details>

    <div class="card">
      <div class="muted" style="line-height:1.6;">Absensi Guru ${esc(cfg.schoolName)} · versi ${APP_VERSI}<br>Data tersimpan di perangkat dan disinkronkan dua arah dengan Google Spreadsheet sekolah.</div>
      <button class="btn btn-danger" style="margin-top:10px;" onclick="doLogout()">Keluar</button>
    </div>`;
}
function toggleCfg(key, btn){
  DB.config[key] = !DB.config[key];
  btn.classList.toggle('on', DB.config[key]); btn.setAttribute('aria-checked', DB.config[key]);
  saveDB();
}
function toggleTema(btn){
  DB.config.tema = DB.config.tema==='gelap' ? 'terang' : 'gelap';
  btn.classList.toggle('on', DB.config.tema==='gelap');
  saveDB(); terapkanTema();
}
function simpanJadwal(){
  const m = normJam(document.getElementById('c_masuk').value), p = normJam(document.getElementById('c_pulang').value);
  if(!m || !p){ toast('Isi jam masuk dan jam pulang.','err'); return; }
  if(p <= m){ toast('Jam pulang harus setelah jam masuk.','err'); return; }
  DB.config.jamMasuk = m; DB.config.jamPulang = p; saveDB();
  catatLog('Pengaturan', `Jam sekolah ${m}–${p}`); toast('Jam sekolah disimpan.','ok');
}
function tambahLibur(){
  const t = document.getElementById('lb_tgl').value, k = teks(document.getElementById('lb_ket').value, 80);
  if(!isISO(t)){ toast('Pilih tanggal libur.','err'); return; }
  if(DB.config.libur.some(l=>l.tgl===t)){ toast('Tanggal ini sudah terdaftar.','err'); return; }
  DB.config.libur = bersihkanLibur([...DB.config.libur, {tgl:t, ket:k||'Hari libur'}]);
  saveDB(); catatLog('Hari libur', `${t} ${k}`); renderPengaturan(); toast('Hari libur ditambahkan.','ok');
}
function hapusLibur(t){ DB.config.libur = DB.config.libur.filter(l=>l.tgl!==t); saveDB(); renderPengaturan(); }
async function simpanUrl(){
  const url = document.getElementById('s_url').value.trim();
  if(url===DB.config.sheetUrl){ toast('Alamat tidak berubah.'); return; }
  if(!URL_POLA.test(url)){ toast('Alamat harus berbentuk https://script.google.com/macros/s/…/exec','err'); return; }
  if(!await mintaSandi('Mengubah alamat spreadsheet menentukan ke mana data sekolah dikirim.')) return;
  DB.config.sheetUrl = url; saveDB();
  catatLog('Keamanan','Alamat Web App diubah','warn');
  toast('Alamat sinkron disimpan.','ok'); updateSyncPill();
}
function simpanIdentitas(){
  const v = id => teks(document.getElementById(id).value, 200);
  const nip = v('c_nipkepsek').replace(/\s+/g,'');
  if(nip && !/^\d{8,20}$/.test(nip)){ toast('NIP kepala sekolah hanya boleh angka.','err'); return; }
  Object.assign(DB.config, {dinas:v('c_dinas'), schoolName:v('c_sekolah')||'SMP KRISTEN BASAAN', alamat:v('c_alamat'), kota:v('c_kota'), kepsek:v('c_kepsek'), nipKepsek:nip, ttdTanggal:document.getElementById('c_ttdtgl').value==='cetak'?'cetak':'laporan'});
  saveDB(); document.getElementById('tbSekolah').textContent = judulSekolah();
  catatLog('Pengaturan','Identitas laporan diperbarui'); toast('Identitas laporan disimpan.','ok');
}
async function tarikPaksa(){
  if(!navigator.onLine){ toast('Tidak ada koneksi internet.','err'); return; }
  toast('Mengambil seluruh data spreadsheet…');
  const ok = await tarikOnline(true);
  toast(ok?'Data spreadsheet berhasil dimuat.':'Gagal mengambil data.', ok?'ok':'err');
  renderPengaturan();
}
function openGantiPassword(){
  bukaModal(`
    ${kepalaModal('Ganti password')}
    <div class="note">${IKON.info}<span>Password aplikasi harus sama dengan password di spreadsheet sekolah. Ubah dulu di spreadsheet (Code.gs), lalu ubah di sini.</span></div>
    <div class="field"><label for="p_old">Password lama</label>${inputSandi('p_old','Password lama')}</div>
    <div class="field"><label for="p_new">Password baru</label>${inputSandi('p_new','Minimal 6 karakter','oninput="kekuatanSandi(this.value)"')}<div class="hint" id="p_kuat"></div></div>
    <div class="field"><label for="p_new2">Ulangi password baru</label>${inputSandi('p_new2','Ketik ulang')}</div>
    <button class="btn btn-primary" id="p_btn" onclick="gantiPassword()">Simpan password</button>`, {center:true, id:'modalPass'});
}
function kekuatanSandi(p){
  let s = 0; if(p.length>=8) s++; if(p.length>=12) s++; if(/[A-Z]/.test(p)&&/[a-z]/.test(p)) s++; if(/\d/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++;
  const l = ['Sangat lemah','Lemah','Cukup','Kuat','Sangat kuat','Sangat kuat'][s];
  const el = document.getElementById('p_kuat'); if(el){ el.textContent = p ? 'Kekuatan: '+l : ''; el.style.color = s>=3?'var(--success)':s>=2?'var(--warning)':'var(--danger)'; }
}
async function gantiPassword(){
  const old = document.getElementById('p_old').value, n1 = document.getElementById('p_new').value, n2 = document.getElementById('p_new2').value;
  if(sisaKunci()>0){ toast(`Terlalu banyak percobaan. Tunggu ${fmtDurasi(sisaKunci())}.`,'err'); return; }
  if(!await cocokPassword(old)){ catatGagal(); toast('Password lama salah.','err'); return; }
  if(n1.length<6){ toast('Password baru minimal 6 karakter.','err'); return; }
  if(n1!==n2){ toast('Ulangan password tidak sama.','err'); return; }
  if(n1===old){ toast('Password baru sama dengan yang lama.','err'); return; }
  let terverifikasi = false;
  if(navigator.onLine && DB.config.sheetUrl){
    try{ const d = await apiKirim({action:'pull', password:n1}); terverifikasi = !!(d && d.ok); }catch(e){}
    if(!terverifikasi && !await konfirmasi({judul:'Belum cocok dengan spreadsheet', pesan:'Spreadsheet belum menerima password baru ini, sehingga sinkron akan gagal sampai password di spreadsheet juga diubah. Tetap simpan?', ok:'Tetap simpan'})) return;
  }
  DB.config.passRec = await buatPassRec(n1);
  DB.config.passVerified = terverifikasi;
  saveDB(); simpanSesi(n1); resetGagal();
  catatLog('Keamanan','Password diganti','warn');
  tutupModal(document.getElementById('modalPass'));
  toast('Password berhasil diubah.','ok'); renderPengaturan();
}
function lihatLog(){
  const log = bacaLog();
  bukaModal(`
    ${kepalaModal('Log aktivitas')}
    <p class="muted" style="margin-top:0;">Catatan tindakan di perangkat ini, terbaru di atas.</p>
    <div class="card card-flush" style="max-height:52vh;overflow-y:auto;">
      ${log.length ? log.slice(0,200).map(l=>`<div class="log-row ${l.l==='warn'?'warn':''}"><time>${new Date(l.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</time><div><b>${esc(l.a)}</b>${l.d?` · ${esc(l.d)}`:''}</div></div>`).join('')
        : `<div class="empty"><div class="d">Belum ada aktivitas.</div></div>`}
    </div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-outline btn-sm" onclick="unduhCSV([['Waktu','Aktivitas','Detail'],...bacaLog().map(l=>[new Date(l.t).toLocaleString('id-ID'),l.a,l.d])],'Log_Aktivitas_'+todayStr()+'.csv')">Unduh log</button>
      <button class="btn btn-danger btn-sm" onclick="hapusLog(this)">Kosongkan log</button>
    </div>`, {tanpaFokus:true});
}
async function hapusLog(btn){
  if(!await mintaSandi('Log aktivitas adalah jejak pemeriksaan. Mengosongkannya memerlukan password.')) return;
  localStorage.setItem(LOGKEY, '[]'); catatLog('Keamanan','Log dikosongkan','warn');
  tutupModal(btn); toast('Log dikosongkan.','ok'); renderPengaturan();
}
function backupData(){
  const salin = JSON.parse(JSON.stringify(DB));
  ['passRec','passVerified','password','setupDone','lastSync'].forEach(k=>delete salin.config[k]);
  salin.meta = {app:'absensi-guru', versi:APP_VERSI, dibuat:new Date().toISOString(), sekolah:DB.config.schoolName};
  const blob = new Blob([JSON.stringify(salin,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cadangan-absensi-guru-'+todayStr()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  catatLog('Cadangan','Cadangan diekspor'); toast('Cadangan diunduh.','ok');
}
async function mulaiRestore(){
  if(!await mintaSandi('Memulihkan cadangan akan mengganti seluruh data di perangkat ini.')) return;
  document.getElementById('restoreFile').click();
}
function restoreData(ev){
  const file = ev.target.files[0]; ev.target.value = '';
  if(!file) return;
  if(file.size > 20*1024*1024){ toast('File terlalu besar.','err'); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('File cadangan tidak bisa dibaca.','err'); return; }
    if(!data || !Array.isArray(data.guru) || !Array.isArray(data.absensi)){ toast('Ini bukan file cadangan Absensi Guru.','err'); return; }
    const guru = data.guru.map(bersihkanGuru).filter(Boolean), absensi = data.absensi.map(bersihkanAbsen).filter(Boolean);
    if(!await konfirmasi({judul:'Pulihkan cadangan', pesan:`File berisi <b>${guru.length} guru</b> dan <b>${absensi.length} catatan absensi</b>${data.meta&&data.meta.dibuat?`, dibuat ${new Date(data.meta.dibuat).toLocaleString('id-ID')}`:''}. Data di perangkat ini akan diganti.${pendingCount()?`<br><br><b>${pendingCount()} data yang belum terkirim akan hilang.</b>`:''}`, ok:'Pulihkan', bahaya:true})) return;
    const aman = {passRec:DB.config.passRec, passVerified:DB.config.passVerified, setupDone:true, sheetUrl:DB.config.sheetUrl, lastSync:DB.config.lastSync, autoLockMin:DB.config.autoLockMin};
    const cfgBaru = defaultConfig();
    const boleh = ['schoolName','dinas','alamat','kota','kepsek','nipKepsek','tema','autoSync','hitungSabtu','jamMasuk','jamPulang','tandaiTelat','ttdTanggal'];
    boleh.forEach(k=>{ if(data.config && data.config[k]!==undefined) cfgBaru[k] = typeof cfgBaru[k]==='boolean' ? !!data.config[k] : teks(data.config[k],200); });
    cfgBaru.libur = bersihkanLibur(data.config && data.config.libur);
    DB = {config:Object.assign(cfgBaru, aman), guru, absensi};
    saveDB(); terapkanTema();
    catatLog('Cadangan', `Dipulihkan: ${guru.length} guru, ${absensi.length} absensi`, 'warn');
    toast('Data berhasil dipulihkan.','ok'); renderPengaturan();
  };
  reader.readAsText(file);
}
function doLogout(){ catatLog('Keluar',''); hapusSesi(); location.reload(); }

async function tesKoneksi(){
  if(!DB.config.sheetUrl){ toast('Alamat Web App belum diisi.','err'); return; }
  toast('Menghubungi spreadsheet…');
  let data;
  try{ data = await apiKirim({action:'pull', password:sandi()}); }
  catch(e){ tampilkanHasilTes('Tidak bisa terhubung', `<div class="note danger">${IKON.warn}<span>Tidak ada balasan dari alamat Web App. Periksa internet, pastikan deployment sudah versi terbaru, dan akses disetel ke "Anyone".</span></div>`); return; }
  if(!data.ok){ tampilkanHasilTes('Ditolak server', `<div class="note danger">${IKON.warn}<span>${esc(data.message||'Server menolak permintaan.')}</span></div>`); return; }
  const jg = (data.guru||[]).length, ja = (data.absensi||[]).length;
  const contoh = (data.absensi||[])[0];
  let isi = `<div class="chip-row" style="margin-bottom:10px;"><span class="badge ${jg?'b-hadir':'b-alpa'}">${jg} guru</span><span class="badge ${ja?'b-hadir':'b-alpa'}">${ja} absensi</span></div>`;
  isi += (!jg && !ja) ? `<div class="note warn">${IKON.warn}<span>Server menjawab tetapi tidak mengirim data. Periksa judul kolom di sheet atau Deploy ulang Code.gs sebagai versi baru.</span></div>`
                     : `<div class="note ok">${IKON.ok}<span>Spreadsheet terbaca dengan baik.</span></div>`;
  if(contoh){
    const t = normTanggal(contoh.tanggal);
    isi += `<div class="muted">Contoh tanggal dari spreadsheet: <b>${esc(String(contoh.tanggal))}</b> → dibaca sebagai <b>${t?fmtDateID(t):'tidak dikenali'}</b></div>`;
    if(!t) isi += `<div class="note danger" style="margin-top:8px;">${IKON.warn}<span>Format tanggal tidak dikenali, laporan bisa kosong.</span></div>`;
  }
  tampilkanHasilTes('Hasil tes koneksi', isi);
}
function tampilkanHasilTes(judul, isiHTML){
  bukaModal(`${kepalaModal(judul)}${isiHTML}<button class="btn btn-outline" style="margin-top:12px;" onclick="tutupModal(this)">Tutup</button>`, {center:true, tanpaFokus:true});
}
async function mulaiUlangDariServer(){
  if(!navigator.onLine){ toast('Tidak ada koneksi internet.','err'); return; }
  if(!await mintaSandi('Seluruh data guru dan absensi di perangkat akan dihapus lalu diganti isi spreadsheet.')) return;
  if(!await konfirmasi({judul:'Ganti seluruh data', pesan:`Data perangkat diganti dengan isi spreadsheet.${pendingCount()?`<br><br><b>${pendingCount()} data yang belum terkirim akan HILANG.</b>`:''}`, ok:'Ganti data', bahaya:true, ketik:'GANTI'})) return;
  try{
    const data = await apiKirim({action:'pull', password:sandi()});
    if(!data.ok){ toast(data.message||'Server menolak permintaan.','err'); return; }
    DB.guru = []; DB.absensi = [];
    const hasil = gabungDataServer(data);
    DB.config.lastSync = new Date().toISOString(); saveDB();
    catatLog('Ganti data', `${hasil.guru} guru, ${hasil.absensi} absensi dari spreadsheet`, 'warn');
    toast(`${hasil.guru} guru dan ${hasil.absensi} absensi dimuat.`, 'ok');
    renderPengaturan(); updateSyncPill();
  }catch(e){ toast('Gagal terhubung ke spreadsheet.','err'); }
}

/* ============================================================
   BOOT
============================================================ */
(async function init(){
  terapkanTema();
  try{ await migrasiPassword(); }catch(e){}
  if(DB.config.setupDone && !DB.config.passRec){ DB.config.setupDone = false; }
  if(DB.config.setupDone && await pulihkanSesi()) bootApp();
  else renderGate();
})();
</script>
</body>
</html>
