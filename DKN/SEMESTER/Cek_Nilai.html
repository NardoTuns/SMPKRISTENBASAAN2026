<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cek Nilai Siswa</title>
  <meta name="description" content="Halaman siswa SMP Kristen 65 Basaan untuk mengecek nilai raport.">
  <meta name="theme-color" content="#312e81">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    :root {
      --cn-bg: #eef2ff;
      --cn-card: rgba(255, 255, 255, 0.86);
      --cn-line: rgba(99, 102, 241, 0.14);
      --cn-text: #0f172a;
      --cn-muted: #64748b;
      --cn-track: #e2e8f0;
      --gA: #10b981; --gB: #6366f1; --gC: #f59e0b; --gD: #ef4444;
    }
    [data-theme="dark"] {
      --cn-bg: #0b1020;
      --cn-card: rgba(30, 41, 59, 0.78);
      --cn-line: rgba(148, 163, 184, 0.16);
      --cn-text: #f1f5f9;
      --cn-muted: #94a3b8;
      --cn-track: #334155;
    }
    html, body { background: var(--cn-bg); color: var(--cn-text); }
    body { min-height: 100vh; overflow-x: hidden; }

    /* ---------- Latar & hero ---------- */
    .hero {
      position: relative; overflow: hidden; color: #fff;
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 45%, #7c3aed 75%, #0891b2 100%);
      padding: 18px 16px 86px; border-radius: 0 0 32px 32px;
    }
    .hero::before, .hero::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(8px); opacity: .35; pointer-events: none;
    }
    .hero::before { width: 260px; height: 260px; background: #22d3ee; top: -90px; right: -60px; animation: float 9s ease-in-out infinite; }
    .hero::after { width: 200px; height: 200px; background: #f472b6; bottom: -80px; left: -50px; animation: float 11s ease-in-out infinite reverse; }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px, 14px); } }
    .hero-inner { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; }
    .topbar img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 14px; padding: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
    .topbar .t { flex: 1; min-width: 0; }
    .topbar .t b { display: block; font-size: 15px; letter-spacing: .02em; }
    .topbar .t span { font-size: 12px; opacity: .85; font-weight: 600; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.14); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .icon-btn svg { width: 19px; height: 19px; }
    .hero h1 { font-size: 27px; line-height: 1.15; margin-top: 22px; font-weight: 800; }
    .hero h1 em { font-style: normal; background: linear-gradient(90deg, #fde68a, #f9a8d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p.sub { margin-top: 6px; opacity: .88; font-size: 13.5px; font-weight: 600; }

    .wrap { max-width: 860px; margin: -62px auto 0; padding: 0 14px 40px; position: relative; z-index: 2; }
    .panel {
      background: var(--cn-card); border: 1px solid var(--cn-line); border-radius: 22px; padding: 16px;
      box-shadow: 0 12px 34px rgba(30, 27, 75, 0.12); backdrop-filter: blur(14px); margin-bottom: 14px;
    }
    .panel-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--cn-muted); margin-bottom: 12px; }
    .panel-title .step { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }

    /* ---------- Pilih kelas ---------- */
    .kelas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
    .kelas-tile {
      position: relative; text-align: left; border: 1.5px solid var(--cn-line); background: var(--cn-card); color: var(--cn-text);
      border-radius: 16px; padding: 12px; cursor: pointer; transition: transform .15s, box-shadow .2s, border-color .2s; overflow: hidden;
    }
    .kelas-tile:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(79,70,229,.16); }
    .kelas-tile b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .kelas-tile span { display: block; font-size: 11.5px; color: var(--cn-muted); font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kelas-tile::after { content: ''; position: absolute; right: -18px; top: -18px; width: 56px; height: 56px; border-radius: 50%; background: var(--tile, #6366f1); opacity: .16; }
    .kelas-tile.active { border-color: transparent; color: #fff; background: linear-gradient(135deg, var(--tile, #6366f1), #7c3aed); box-shadow: 0 12px 26px rgba(79,70,229,.32); }
    .kelas-tile.active span { color: rgba(255,255,255,.85); }

    /* ---------- Pilih nama ---------- */
    .search { position: relative; margin-bottom: 10px; }
    .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--cn-muted); }
    .search input {
      width: 100%; padding: 13px 14px 13px 40px; border-radius: 14px; border: 1.5px solid var(--cn-line);
      background: var(--cn-bg); color: var(--cn-text); font-size: 15px; outline: none;
    }
    .search input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
    .name-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .name-item {
      display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 14px; cursor: pointer; text-align: left;
      border: 1px solid var(--cn-line); background: var(--cn-card); color: var(--cn-text); font-size: 14px;
      transition: transform .12s, border-color .2s, box-shadow .2s; animation: pop .35s ease both;
    }
    .name-item:hover { transform: translateX(3px); border-color: #818cf8; box-shadow: 0 6px 16px rgba(79,70,229,.12); }
    .name-item b { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.3; }
    .name-item .go { color: #818cf8; font-weight: 800; }
    .avatar {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 13.5px; background: linear-gradient(135deg, var(--a1, #6366f1), var(--a2, #8b5cf6));
    }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .hint { text-align: center; color: var(--cn-muted); font-size: 13.5px; padding: 22px 8px; }
    .hint .big { font-size: 34px; display: block; margin-bottom: 6px; }

    /* ---------- Hasil ---------- */
    .profile { display: flex; align-items: center; gap: 14px; }
    .profile .avatar { width: 60px; height: 60px; border-radius: 18px; font-size: 21px; box-shadow: 0 10px 24px rgba(79,70,229,.3); }
    .profile .who { flex: 1; min-width: 0; }
    .profile .who h2 { font-size: 19px; line-height: 1.25; font-weight: 800; }
    .profile .who div { font-size: 12.5px; color: var(--cn-muted); font-weight: 600; margin-top: 3px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }
    .pill.ok { background: rgba(16,185,129,.14); color: #059669; }
    .pill.warn { background: rgba(245,158,11,.16); color: #d97706; }
    .pill.bad { background: rgba(239,68,68,.14); color: #dc2626; }
    .pill.pri { background: rgba(99,102,241,.14); color: #6366f1; }

    .summary { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; margin-top: 16px; }
    .gauge { position: relative; width: 160px; height: 160px; margin: 0 auto; }
    .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge .track { stroke: var(--cn-track); }
    .gauge .bar { transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
    .gauge .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .gauge .center b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
    .gauge .center span { font-size: 11px; color: var(--cn-muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .gauge .center i { font-style: normal; font-size: 11.5px; font-weight: 800; margin-top: 3px; text-align: center; line-height: 1.3; max-width: 112px; }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tile { border-radius: 16px; padding: 12px; border: 1px solid var(--cn-line); background: var(--cn-bg); position: relative; overflow: hidden; }
    .tile span { display: block; font-size: 11px; color: var(--cn-muted); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .tile b { display: block; font-size: 24px; font-weight: 800; margin-top: 3px; letter-spacing: -.02em; }
    .tile small { font-size: 11.5px; color: var(--cn-muted); font-weight: 600; }
    .tile .medal { position: absolute; right: 10px; top: 8px; font-size: 26px; animation: bounce 2s ease-in-out infinite; }
    .tile.gold { background: linear-gradient(135deg, rgba(250,204,21,.22), rgba(251,146,60,.12)); border-color: rgba(250,204,21,.45); }
    @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }

    .banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
    .banner .e { font-size: 18px; line-height: 1.2; }
    .banner.ok { background: rgba(16,185,129,.12); color: #047857; }
    .banner.info { background: rgba(99,102,241,.12); color: #4338ca; }
    .banner.warn { background: rgba(245,158,11,.14); color: #b45309; }
    [data-theme="dark"] .banner.ok { color: #6ee7b7; }
    [data-theme="dark"] .banner.info { color: #a5b4fc; }
    [data-theme="dark"] .banner.warn { color: #fcd34d; }

    .mapel { padding: 13px 2px; border-bottom: 1px dashed var(--cn-line); animation: pop .4s ease both; }
    .mapel:last-child { border-bottom: 0; }
    .mapel-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .mapel-head .ic { width: 34px; height: 34px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0; }
    .mapel-head .nm { flex: 1; min-width: 0; }
    .mapel-head .nm b { display: block; font-size: 14px; line-height: 1.3; }
    .mapel-head .nm small { font-size: 11.5px; color: var(--cn-muted); font-weight: 700; }
    .mapel-head .sc { text-align: right; }
    .mapel-head .sc b { display: block; font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
    .mapel-head .sc small { font-size: 10.5px; color: var(--cn-muted); font-weight: 800; }
    .meter { position: relative; height: 9px; border-radius: 999px; background: var(--cn-track); margin: 10px 0 0 44px; overflow: visible; }
    .meter > i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
    .meter .kkm { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--cn-text); opacity: .45; border-radius: 2px; }
    .meter .kkm::after { content: 'KKM'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 8.5px; font-weight: 800; color: var(--cn-muted); }
    .desk { margin: 10px 0 0 44px; font-size: 12.5px; line-height: 1.55; color: var(--cn-muted); display: none; }
    .mapel.open .desk { display: block; animation: pop .25s ease both; }
    .k-row { margin: 6px 0 0 44px; font-size: 12px; color: var(--cn-muted); font-weight: 700; }

    .mini-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .mini { border-radius: 16px; padding: 12px; background: var(--cn-bg); border: 1px solid var(--cn-line); }
    .mini span { display: block; font-size: 11px; color: var(--cn-muted); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .mini b { display: block; font-size: 16px; margin-top: 3px; }
    .catatan { font-size: 13.5px; line-height: 1.6; font-style: italic; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions .btn { flex: 1; min-width: 140px; border-radius: 14px; padding: 13px 16px; }
    .btn-grad { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: 0; box-shadow: 0 10px 22px rgba(99,102,241,.3); }
    .foot { text-align: center; color: var(--cn-muted); font-size: 12px; margin-top: 16px; line-height: 1.6; }
    .foot a { color: #6366f1; font-weight: 700; text-decoration: none; }

    .skeleton { height: 54px; border-radius: 14px; background: linear-gradient(90deg, var(--cn-track) 25%, var(--cn-line) 50%, var(--cn-track) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }

    @media (max-width: 560px) {
      .summary { grid-template-columns: 1fr; }
      .hero h1 { font-size: 23px; }
    }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      html, body { background: #fff !important; color: #000 !important; }
      .no-print, .toast-container, .loading-overlay, .confetti { display: none !important; }
      .hero { background: none !important; color: #000; padding: 0 0 8px; border-radius: 0; }
      .hero::before, .hero::after { display: none; }
      .topbar img { box-shadow: none; }
      .wrap { margin-top: 0; padding: 0; max-width: none; }
      .panel { box-shadow: none; border-color: #bbb; background: #fff; backdrop-filter: none; break-inside: avoid; }
      .desk { display: block !important; }
      .mapel { break-inside: avoid; animation: none; }
      .meter > i { transition: none; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="topbar">
        <img src="assets/logo_left.png" alt="Logo sekolah">
        <div class="t"><b id="h-sekolah">SMP KRISTEN 65 BASAAN</b><span id="h-periode">E-Raport</span></div>
        <button class="icon-btn no-print" id="btn-theme" title="Mode gelap / terang" aria-label="Ubah tema">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
      <div id="hero-text">
        <h1>Yuk, cek <em>nilai raportmu</em> ✨</h1>
        <p class="sub">Pilih kelas, lalu ketuk namamu.</p>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- ===================== PILIH SISWA ===================== -->
    <section id="view-pilih">
      <div id="pilih-alert"></div>
      <div class="panel">
        <div class="panel-title"><span class="step">1</span> Pilih Kelas</div>
        <div class="kelas-grid" id="kelas-grid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title"><span class="step">2</span> Pilih Namamu <span id="nama-count" style="margin-left:auto;text-transform:none;letter-spacing:0;font-weight:700;"></span></div>
        <div class="search">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
          <input type="search" id="cari" placeholder="Ketik namamu untuk mencari..." autocomplete="off">
        </div>
        <div class="name-list" id="name-list"></div>
      </div>
      <div class="foot">
        Nilai resmi tetap mengacu pada raport yang dibagikan sekolah.<br>
        <a href="index.html">Masuk sebagai Guru / Admin</a> • <span id="app-version"></span>
      </div>
    </section>

    <!-- ===================== HASIL ===================== -->
    <section id="view-hasil" class="hidden">
      <div class="panel">
        <div class="profile" id="h-profile"></div>
        <div class="summary">
          <div class="gauge" id="h-gauge"></div>
          <div class="tiles" id="h-tiles"></div>
        </div>
      </div>

      <div id="h-alert"></div>

      <div class="panel">
        <div class="panel-title">📚 Nilai Mata Pelajaran <span class="no-print" style="margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;">ketuk untuk lihat deskripsi</span></div>
        <div id="h-mapel"></div>
      </div>

      <div class="panel" id="h-pelengkap"></div>

      <div class="actions no-print">
        <button class="btn" id="btn-back">← Pilih Siswa Lain</button>
        <button class="btn" id="btn-refresh">↻ Perbarui</button>
        <button class="btn btn-grad" id="btn-print">🖨️ Cetak / Simpan PDF</button>
      </div>
      <div class="foot" id="h-updated"></div>
    </section>
  </main>

  <div class="loading-overlay" id="loading"><div class="spinner"></div><div id="loading-text">Mengambil nilai...</div></div>
  <div class="toast-container" id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/core.js"></script>
  <script src="js/cek_nilai.js"></script>
</body>
</html>
