<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian - SMP Kristen Basaan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #eef2ff; /* Warna latar sementara menunggu load */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        .loading-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(79, 70, 229, 0.2);
            border-left-color: #4F46E5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #4F46E5;
            font-weight: 600;
        }
    </style>
</head>
<body>
    
    <!-- Animasi Loading sementara iframe memuat data -->
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Sistem Penilaian...</div>
    </div>

    <!-- Iframe yang mengambil data dari URL Google Apps Script -->
    <iframe src="https://script.google.com/macros/s/AKfycbxjfOa_5vYP4Dh07fj4szN40TacvFLcSEG-tR755xDQ5tFnwrtFD36NIKMuZB97gHPN/exec" allowfullscreen></iframe>

</body>
</html>
