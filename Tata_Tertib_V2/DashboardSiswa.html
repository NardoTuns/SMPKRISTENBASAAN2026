<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Info Kedisiplinan Siswa · SMP Kristen Basaan</title>
  <meta name="description" content="Halaman siswa & orang tua SMP Kristen Basaan: perkembangan kedisiplinan per siswa, per kelas, dan keseluruhan, beserta tata tertib sekolah. Tanpa login, bisa dibuka offline.">
  <meta name="theme-color" content="#6366F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Info Siswa">
  <link rel="manifest" href="manifest-siswa.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Google Fonts: Plus Jakarta Sans & Fredoka untuk kesan ceria -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css">

  <!-- Custom Styling Tema Berwarna & Ceria -->
  <style>
    :root {
      --c-indigo: #6366F1;
      --c-pink: #EC4899;
      --c-amber: #F59E0B;
      --c-emerald: #10B981;
      --c-sky: #0EA5E9;
      --c-violet: #8B5CF6;
      --c-rose: #F43F5E;
      --bg-cheerful: radial-gradient(circle at 10% 20%, rgba(224, 231, 255, 0.85) 0%, rgba(252, 231, 243, 0.75) 45%, rgba(254, 243, 199, 0.8) 100%);
      --card-surface: rgba(255, 255, 255, 0.92);
      --card-border: rgba(99, 102, 241, 0.14);
      --shadow-pop: 0 12px 28px -6px rgba(99, 102, 241, 0.14), 0 4px 12px -2px rgba(236, 72, 153, 0.08);
    }

    body.ds {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
      background: var(--bg-cheerful) !important;
      background-attachment: fixed !important;
      color: #1E293B !important;
    }

    h1, h2, h3, .brand-title, .top10-main-title {
      font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif !important;
      letter-spacing: 0.2px;
    }

    /* Splash Screen Ceria */
    #splash {
      background: linear-gradient(135deg, #6366F1 0%, #EC4899 55%, #F59E0B 100%) !important;
      color: #fff !important;
    }
    #splash .sp img {
      background: rgba(255, 255, 255, 0.22);
      padding: 14px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    /* Topbar & Navigasi */
    .topbar {
      background: rgba(255, 255, 255, 0.88) !important;
      backdrop-filter: blur(14px) !important;
      border-bottom: 2px solid rgba(99, 102, 241, 0.15) !important;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.08) !important;
    }
    .brand-title {
      background: linear-gradient(90deg, #4F46E5, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700 !important;
    }
    .ds-tabs {
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(10px) !important;
      border-bottom: 1px solid rgba(99, 102, 241, 0.12) !important;
      padding: 6px 16px !important;
      gap: 8px !important;
    }
    .ds-tab {
      border-radius: 999px !important;
      padding: 8px 16px !important;
      font-weight: 600 !important;
      transition: all 0.2s ease !important;
    }
    .ds-tab.on {
      background: linear-gradient(135deg, #6366F1, #EC4899) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3) !important;
    }
    .bottomnav.ds-nav {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(16px) !important;
      border-top: 2px solid rgba(99, 102, 241, 0.15) !important;
      box-shadow: 0 -6px 24px rgba(99, 102, 241, 0.12) !important;
    }
    .bottomnav .bn.on {
      color: #EC4899 !important;
      font-weight: 700 !important;
    }

    /* Hero Banner Beranda */
    .ds-hero {
      background: linear-gradient(135deg, #4F46E5 0%, #9333EA 50%, #EC4899 100%) !important;
      color: #ffffff !important;
      border-radius: 26px !important;
      padding: 28px 24px !important;
      box-shadow: 0 16px 32px -8px rgba(147, 51, 234, 0.38) !important;
      position: relative;
      overflow: hidden;
      border: none !important;
    }
    .ds-hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .ds-hero h1 {
      color: #ffffff !important;
      font-size: 1.65rem !important;
      margin-bottom: 6px !important;
    }
    .ds-hero p {
      color: rgba(255, 255, 255, 0.92) !important;
    }
    .ds-hero .btn.primary {
      background: #FBBF24 !important;
      color: #1E293B !important;
      font-weight: 800 !important;
      border: none !important;
      box-shadow: 0 6px 16px rgba(251, 191, 36, 0.4) !important;
    }
    .ds-hero .btn.tonal {
      background: rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      backdrop-filter: blur(6px);
    }

    /* Kartu Umum & Stat Tiles Berwarna */
    .card {
      background: var(--card-surface) !important;
      border: 1.5px solid var(--card-border) !important;
      border-radius: 22px !important;
      box-shadow: var(--shadow-pop) !important;
    }
    .ds-tiles > *:nth-child(1) {
      background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%) !important;
      border-color: #6EE7B7 !important;
    }
    .ds-tiles > *:nth-child(2) {
      background: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 100%) !important;
      border-color: #FDA4AF !important;
    }
    .ds-tiles > *:nth-child(3) {
      background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%) !important;
      border-color: #93C5FD !important;
    }
    .ds-tiles > *:nth-child(4) {
      background: linear-gradient(135deg, #FEFCE8 0%, #FEF3C7 100%) !important;
      border-color: #FDE047 !important;
    }

    /* Pencarian Ceria (Nama / NIS / NISN) */
    .ds-search {
      background: linear-gradient(135deg, #FFFFFF 0%, #F5F3FF 100%) !important;
      border: 2px solid #C7D2FE !important;
      padding: 16px !important;
      border-radius: 22px !important;
    }
    .ds-search .fsel.search {
      background: #FFFFFF !important;
      border: 2px solid #A5B4FC !important;
      border-radius: 16px !important;
      transition: all 0.2s ease;
    }
    .ds-search .fsel.search:focus-within {
      border-color: #EC4899 !important;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.15) !important;
    }
    .pick-list.big {
      margin-top: 10px;
      border-radius: 18px !important;
      overflow: hidden;
      background: #FFFFFF !important;
      border: 2px solid #E0E7FF !important;
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.16) !important;
    }
    .pick-list.big .pick {
      padding: 12px 16px !important;
      border-bottom: 1px solid #F1F5F9 !important;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .pick-list.big .pick:hover {
      background: #F5F3FF !important;
    }
    .pick-poin-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      background: #FCE7F3;
      color: #BE185D;
      white-space: nowrap;
    }
    .pick-poin-badge.clean {
      background: #DCFCE7;
      color: #15803D;
    }

    /* Top 10 Siswa Leaderboard */
    .top10-section {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFBEB 100%) !important;
      border: 2px solid #FDE68A !important;
      border-radius: 24px !important;
      padding: 22px !important;
      box-shadow: 0 14px 32px -8px rgba(245, 158, 11, 0.18) !important;
      margin: 18px 0;
    }
    .top10-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .top10-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .top10-trophy {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #F59E0B, #EC4899);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 16px rgba(245, 158, 11, 0.3);
      flex-shrink: 0;
    }
    .top10-main-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(90deg, #D97706, #DB2777, #4F46E5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top10-sub {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: #64748B;
    }

    /* Podium Top 3 */
    .top3-podium {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .podium-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid transparent;
    }
    .podium-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    .podium-card.r-1 {
      background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
      border-color: #F59E0B;
    }
    .podium-card.r-2 {
      background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
      border-color: #94A3B8;
    }
    .podium-card.r-3 {
      background: linear-gradient(135deg, #FFEDD5 0%, #FED7AA 100%);
      border-color: #F97316;
    }
    .podium-rank {
      font-size: 1.5rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .podium-pts {
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }
    .podium-pts strong {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      color: #BE185D;
    }
    .podium-pts span {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748B;
    }

    /* Baris Peringkat 4-10 */
    .top10-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top10-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1.5px solid #F1F5F9;
      text-decoration: none;
      color: inherit;
      transition: all 0.18s ease;
    }
    .top10-row:hover {
      border-color: #A5B4FC;
      background: #F5F3FF;
      transform: translateX(4px);
    }
    .rank-num {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
      color: #4F46E5;
      font-weight: 800;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .top10-bar-wrap {
      height: 6px;
      background: #F1F5F9;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 5px;
      max-width: 220px;
    }
    .top10-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #F59E0B, #EC4899, #6366F1);
    }
    .top10-pts-badge {
      padding: 6px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FCE7F3, #FFE4E6);
      color: #BE185D;
      font-weight: 800;
      font-size: 0.9rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Chips Filter Ceria */
    .chip.on {
      background: linear-gradient(135deg, #6366F1, #EC4899) !important;
      color: #fff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body class="ds">
  <div id="splash"><div class="sp"><img src="icons/favicon.svg" alt=""><span>✨ Info Kedisiplinan Siswa · SMP Kristen Basaan ✨</span></div></div>
  <div id="app"></div>
  <div id="print-root" class="docs"></div>
  <noscript><p style="padding:24px">Halaman ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
  <script type="module" src="js/siswa.js"></script>
</body>
</html>
